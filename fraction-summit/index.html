<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fraction Summit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout idea: one dusk-sky world, a single snow-white work card, a lantern-lit trail of 15 camps */
  --sky:#17233f; --sky2:#2c4272; --snow:#f7f4ec; --ink:#1a2236; --lantern:#f2a33a;
  --pine:#1f8a68; --ember:#cf4a3a; --mist:#a9b8d6; --rule:#d8d2c2; --ice:#dbe7f6;
  --display:"Fredoka","Trebuchet MS",sans-serif; --body:"Atkinson Hyperlegible",Verdana,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--body);color:var(--ink);background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 70%,#48608f 100%) fixed;font-size:18px;line-height:1.5}
.peaks{position:fixed;left:0;right:0;bottom:0;height:34vh;z-index:0;pointer-events:none;opacity:.5}
.top,main,footer{position:relative;z-index:1}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;color:var(--snow)}
.brand{font-family:var(--display);font-weight:700;font-size:1.5rem;letter-spacing:.01em}
.brand span{color:var(--lantern)}
#who{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:.95rem}
.chip{background:rgba(255,255,255,.12);border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums}
main{max-width:860px;margin:0 auto;padding:8px 16px 40px}
.card{background:var(--snow);border-radius:18px;padding:24px;box-shadow:0 10px 30px rgba(8,14,30,.35)}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0 0 .4em;text-wrap:balance}
h1{font-size:2rem} h2{font-size:1.5rem} h3{font-size:1.15rem}
p{margin:.4em 0 .8em;max-width:65ch}
.tiny{font-size:.85rem;color:#5a6378;margin:.3em 0}
.code{font-family:var(--display);font-size:.85rem;letter-spacing:.06em;color:#7a5410;background:#fbe6c2;border-radius:6px;padding:2px 8px;display:inline-block}
button{font:inherit;cursor:pointer}
.btn{font-family:var(--display);font-weight:600;font-size:1.1rem;border:0;border-radius:12px;padding:12px 22px;background:var(--lantern);color:#2a1c00;box-shadow:0 4px 0 #b5741b}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #b5741b}
.btn.alt{background:var(--ice);color:var(--ink);box-shadow:0 4px 0 #a9bcd8}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:inherit;text-decoration:underline;padding:4px}
:focus-visible{outline:3px solid #3b7ddd;outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
input.name{font:inherit;font-size:1.2rem;padding:12px 14px;border:2px solid var(--rule);border-radius:12px;width:100%;max-width:340px;background:#fff}
/* trail */
.trail{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 16px}
.trail i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.72rem;font-weight:700;background:#e6e0d0;color:#6d6654}
.trail i.done{background:var(--lantern);color:#2a1c00}
.trail i.now{background:#fff;box-shadow:0 0 0 3px var(--lantern)}
.trail .gate{font-family:var(--display);font-size:.8rem;padding:3px 10px;border-radius:8px;background:#e6e0d0;color:#6d6654}
.trail .gate.done{background:var(--pine);color:#fff}
.seccard{border:2px solid var(--rule);border-radius:16px;padding:18px;background:#fff;display:flex;flex-direction:column;gap:6px}
.seccard.locked{opacity:.6}
.pill{display:inline-block;border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:700;white-space:nowrap}
.pill.good{background:#d3efe4;color:#0e5d44}.pill.warn{background:#fde9c4;color:#7a5410}.pill.bad{background:#f8d5cf;color:#8a2114}.pill.idle{background:#e8e6de;color:#5c5a52}
/* question */
.prompt{font-size:1.15rem;font-weight:700;max-width:60ch}
.eq{font-size:1.7rem;margin:14px 0;display:flex;flex-wrap:wrap;align-items:center;gap:.25em;font-variant-numeric:tabular-nums}
.fr{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 .15em;font-weight:700;line-height:1.15}
.fr>b{padding:1px .3em;font-weight:700}
.fr>b:first-child{border-bottom:.11em solid currentColor}
.wh{font-weight:700}
.ai{font:inherit;font-weight:700;width:2.7em;text-align:center;border:2px solid #8fa3c7;border-radius:8px;padding:2px;background:#fff;color:var(--ink)}
.ai::placeholder{font-size:.5em;font-weight:400;color:#8b93a5}
.mixin{display:inline-flex;align-items:center;gap:.15em}
.model{margin:12px 0;display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mrow .lab{min-width:3.2em;font-size:1.1rem}
.barwrap{display:flex;flex-direction:column;gap:4px;flex:1;min-width:220px;max-width:520px}
.bar{display:flex;height:40px;border:2px solid var(--ink);border-radius:6px;overflow:hidden;background:#fff}
.bar i{flex:1;border-left:1px solid #7c869c}
.bar i:first-child{border-left:0}
.bar i.gb{border-left:3px solid var(--ink)}
.bar i.on{background:var(--lantern)}
.bar.b2 i.on{background:#5aa7d8}
.bar.pick i{cursor:pointer}
.bar.pick i:hover{background:#fbe6c2}.bar.pick i.on:hover{background:var(--lantern)}
.hgrid{display:grid;grid-template-columns:repeat(10,1fr);width:200px;height:200px;border:2px solid var(--ink);background:#fff}
.hgrid i{border:1px solid #c5c9d3}.hgrid i.on{background:var(--lantern)}
.ks{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.95rem}
.kbtn{border:2px solid #8fa3c7;background:#fff;border-radius:8px;padding:4px 12px;font-weight:700}
.kbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.opts{display:grid;gap:10px;margin:12px 0}
.opt{text-align:left;border:2px solid #8fa3c7;background:#fff;border-radius:12px;padding:10px 14px;font-size:1.05rem;color:var(--ink)}
.opt.sel{border-color:var(--ink);background:var(--ice);box-shadow:inset 0 0 0 2px var(--ink)}
.opt:disabled{cursor:default}
svg.nl{width:100%;max-width:660px;height:auto}
.nl .ax{stroke:var(--ink);stroke-width:2}
.nl .nt{font:700 15px var(--body);fill:var(--ink)}
.nl .tk{fill:transparent;cursor:pointer}
.nl .tk:hover{fill:rgba(242,163,58,.35)}
.nl .tk.sel{fill:var(--lantern);stroke:var(--ink);stroke-width:2}
.nl .flag{fill:#5aa7d8;stroke:var(--ink);stroke-width:2}
.nl .mk{fill:var(--lantern);stroke:var(--ink);stroke-width:2}
.fb{border-radius:12px;padding:12px 16px;margin:14px 0}
.fb.good{background:#d3efe4;border-left:6px solid var(--pine)}
.fb.bad{background:#f8d5cf;border-left:6px solid var(--ember)}
.fb.hint{background:#fde9c4;border-left:6px solid var(--lantern)}
.fb .fr{font-size:1.05rem}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.shake,.pop{animation:none}}
.big{font-family:var(--display);font-size:3.2rem;font-weight:700;line-height:1}
.stars{color:#c9811a;letter-spacing:.1em}
.qbar{height:10px;background:#e6e0d0;border-radius:99px;overflow:hidden;margin:6px 0 16px}
.qbar b{display:block;height:100%;background:var(--pine)}
/* dashboard */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.tile{background:#fff;border:2px solid var(--rule);border-radius:14px;padding:12px 14px}
.tile b{font-family:var(--display);font-size:1.9rem;display:block;line-height:1.1}
.tw{overflow-x:auto;border:2px solid var(--rule);border-radius:14px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--rule);white-space:nowrap}
thead th{background:#efeadc;font-family:var(--display);font-weight:600}
th.grp{text-align:center;border-left:2px solid var(--rule)}
td.s,th.s{border-left:2px solid var(--rule)}
.pbar{position:relative;z-index:1;max-width:860px;margin:0 auto 12px;padding:0 16px}
.pbar>div{background:rgba(255,255,255,.12);color:var(--snow);border-radius:14px;padding:10px 16px;display:flex;flex-direction:column;gap:6px}
.pbar .tiny{color:var(--ice);margin:0}
.prow{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.prow .pn{font-weight:700;min-width:9em}
.ptrack{flex:1;min-width:120px;height:12px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}
.ptrack b{display:block;height:100%;background:var(--lantern)}
.dsb{background:var(--ice);border-radius:12px;padding:10px 14px;margin:12px 0;display:flex;flex-direction:column;gap:6px}
.dsb .ptrack{background:#b9c9e2}.dsb .ptrack b{background:var(--pine)}
.pbtn{font:inherit;font-weight:700;border:0;border-radius:99px;padding:4px 14px;background:var(--lantern);color:#2a1c00}
footer{color:var(--mist);text-align:center;padding:10px 16px 28px;font-size:.88rem;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;align-items:center}
textarea{width:100%;min-height:120px;font:13px monospace}
</style>
</head>
<body>
<svg class="peaks" viewBox="0 0 1200 300" preserveAspectRatio="none" aria-hidden="true"><path d="M0 300V190l150-110 120 90 170-150 160 140 130-80 180 120 140-90 150 110V300z" fill="#101a31"/><path d="M440 20l40 36-34-10-22 22-24-12z M150 80l34 26-30-6-20 14z" fill="#e9eef8"/></svg>
<header class="top"><div class="brand">Fraction <span>Summit</span></div><div id="who"></div></header>
<div class="pbar" id="pbar" hidden></div>
<main id="app"><div class="card"><p>Loading…</p></div></main>
<footer><button class="link" id="tbtn" type="button">Teacher dashboard</button><span id="sync"></span></footer>
<script>
'use strict';
const PASS=8,NSTEP=15;
/* ---------- helpers ---------- */
let rnd=Math.random;const R=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[R(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):a;
const NTH={2:'halves',3:'thirds',4:'fourths',5:'fifths',6:'sixths',8:'eighths',10:'tenths',12:'twelfths',100:'hundredths'};
const F=(n,d)=>`<span class="fr"><b>${n}</b><b>${d}</b></span>`;
const MXr=(w,f)=>(w?`<span class="wh">${w}</span>`:'')+(f[0]?F(f[0],f[1]):(w?'':'<span class="wh">0</span>'));
const MX=(n,d)=>{const g=gcd(n,d)||1;n/=g;d/=g;return MXr(Math.floor(n/d),[n%d,d])};
const MXD=(v,D)=>{const n=v[0]*D/v[1];return MXr(Math.floor(n/D),[n%D,D])};
const simp=([n,d])=>{const g=gcd(n,d)||1;return[n/g,d/g]};
const addR=(x,y)=>simp([x[0]*y[1]+y[0]*x[1],x[1]*y[1]]);
const subR=(x,y)=>simp([x[0]*y[1]-y[0]*x[1],x[1]*y[1]]);
const cmpR=(x,y)=>x[0]*y[1]-y[0]*x[1];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const INP=(id,ph)=>`<input id="${id}" class="ai" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="${ph||''}" aria-label="${ph||'answer'}">`;
function mkQ(o){o.sig=(o.prompt+'|'+(o.eq||'')+'|'+(o.ansText||'')).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');return o}
function mc(prompt,right,wrongs,extra){return mkQ(Object.assign({kind:'mc',prompt,opts:shuffle([{h:right,ok:true}].concat(wrongs.map(h=>({h,ok:false})))),ansText:right},extra))}

/* ---------- Section 1 generators: NC.4.NF.1 ---------- */
const EASY=[[2,4],[2,6],[2,8],[3,6],[4,8],[5,10],[2,10]],MID=[[2,12],[3,12],[4,12],[6,12],[4,8],[5,10],[3,6],[2,8]],HUN=[[2,100],[4,100],[5,100],[10,100]];
function eqp(l){const[b,D]=pick(l);let a;do a=R(1,b-1);while(gcd(a,b)!==1);return{a,b,D,k:D/b}}
const G1={
 split(){const{a,b,D,k}=eqp(EASY);return mkQ({kind:'num',prompt:`Slice every part of the bar into ${k} equal pieces. How many ${NTH[D]} are shaded now?`,eq:`${F(a,b)} = ${F('@@',D)}`,model:{t:'split',n:a,d:b,ks:[1,2,3,4,5,6].filter(x=>b*x<=12)},ans:a*k,ansText:F(a*k,D),hint:`Tap ${k} under the bar, then count the shaded pieces.`,explain:`Each of the ${b} parts became ${k} smaller pieces, so ${a} shaded became ${a} × ${k} = ${a*k}. ${F(a,b)} = ${F(a*k,D)}.`})},
 shade(){const{a,b,D,k}=eqp(EASY.concat([[3,12],[4,12],[6,12]]));return mkQ({kind:'shade',prompt:`Shade the ${NTH[D]} bar so it covers the same amount as ${F(a,b)}.`,refN:a,refD:b,D,ans:a*k,ansText:`${a*k} ${NTH[D]} shaded, ${F(a*k,D)}`,hint:`Line the bars up. Each part of the top bar is as long as ${k} parts of the bottom bar.`,explain:`Each ${NTH[b].replace(/s$/,'').replace('halve','half')} matches ${k} ${NTH[D]}, so shade ${a} × ${k} = ${a*k}. ${F(a,b)} = ${F(a*k,D)}.`})},
 missNum(l){const{a,b,D,k}=eqp(l||EASY);return mkQ({kind:'num',prompt:'Find the missing numerator.',eq:`${F(a,b)} = ${F('@@',D)}`,model:D<=12?{t:'split',n:a,d:b,ks:[1,2,3,4,5,6].filter(x=>b*x<=12)}:null,ans:a*k,ansText:F(a*k,D),hint:`How many pieces must each part be sliced into to turn ${NTH[b]} into ${NTH[D]}?`,explain:`${b} × ${k} = ${D}, so every part is sliced into ${k}. ${a} × ${k} = ${a*k}. ${F(a,b)} = ${F(a*k,D)}.`})},
 missDen(l){const{a,b,D,k}=eqp(l||MID.concat(HUN));return mkQ({kind:'num',prompt:'Find the missing denominator.',eq:`${F(a,b)} = ${F(a*k,'@@')}`,ans:D,ansText:F(a*k,D),hint:`The shaded count went from ${a} to ${a*k}. What happened to every part?`,explain:`${a} × ${k} = ${a*k}, so every part was sliced into ${k}. The whole now has ${b} × ${k} = ${D} parts.`})},
 simplify(l){const{a,b,D,k}=eqp(l||MID.concat(HUN));return mkQ({kind:'num',prompt:`Merge the small parts into bigger ones. Find the missing numerator.`,eq:`${F(a*k,D)} = ${F('@@',b)}`,ans:a,ansText:F(a,b),hint:`${D} parts become ${b} parts when you merge them in groups of ${k}.`,explain:`Merge every ${k} pieces into 1. ${a*k} ÷ ${k} = ${a} and ${D} ÷ ${k} = ${b}. ${F(a*k,D)} = ${F(a,b)}.`})},
 whichEq(){const{a,b,D,k}=eqp(MID);return mc(`Which fraction names the same amount as ${F(a,b)}?`,F(a*k,D),[F(a+D-b,D),F(a,D),F(a*k,b)],{hint:`Slice every part into the same number of pieces. Multiply the top and the bottom by that number.`,explain:`${b} × ${k} = ${D} and ${a} × ${k} = ${a*k}, so ${F(a,b)} = ${F(a*k,D)}.`})},
 notEq(){const fam=pick([[[1,2],[2,4],[3,6],[4,8],[5,10],[6,12],[50,100]],[[1,4],[2,8],[3,12],[25,100]],[[3,4],[6,8],[9,12],[75,100]]]);const m=shuffle(fam).slice(0,4),t=m[0],src=pick(fam.filter(x=>x[1]>=6)),bad=[src[0]+1,src[1]];
  return mc(`Three of these fractions equal ${F(t[0],t[1])}. Tap the one that does not.`,F(bad[0],bad[1]),m.slice(1).map(x=>F(x[0],x[1])),{hint:`Rename each choice with the same denominator as its neighbor, or merge parts to simplify it.`,explain:`${F(bad[0],bad[1])} is one piece more than ${F(src[0],src[1])}, which is the fraction that equals ${F(t[0],t[1])}.`})},
 explain(){const{a,b,D,k}=eqp(MID);return mc(`${F(a,b)} = ${F(a*k,D)}. What is true about the parts?`,`${F(a*k,D)} has ${k} times as many parts, and each part is smaller, so the amount is the same.`,[`${F(a*k,D)} is a bigger amount because its numbers are bigger.`,`${F(a*k,D)} has ${k} times as many parts and each part is the same size as before.`,`The parts in ${F(a*k,D)} are larger, so fewer of them are needed.`],{hint:`Picture slicing each part of ${F(a,b)}. What happens to the number of parts? What happens to their size?`,explain:`Slicing each part into ${k} gives ${k} times as many parts, each one smaller. The shaded amount does not change.`})},
 errorJo(){const{a,b}=eqp(EASY.concat(MID)),c=R(1,3),nm=pick(['Jo','Malik','Priya','Dante']);return mc(`${nm} says ${F(a,b)} = ${F(a+c,b+c)} because ${c} was added to the top and the bottom. Which reply is correct?`,`Not equal. Adding changes the amount. Slice every part equally instead, which multiplies the top and bottom by the same number.`,[`Equal. Doing the same thing to the top and bottom always keeps a fraction the same.`,`Equal, because both numbers got bigger by the same amount.`,`Not equal, because two different fractions can never name the same amount.`],{hint:`Draw both fractions as bars of the same length. Do they cover the same amount?`,explain:`${F(a+c,b+c)} covers a different amount than ${F(a,b)}. Equivalent fractions come from slicing (multiply both) or merging (divide both), never from adding.`})},
 linePlace(){const{a,b,D,k}=eqp(EASY.concat(MID));return mkQ({kind:'line',prompt:`This number line is marked in ${NTH[D]}. Tap the point that is the same as ${F(a,b)}.`,d:D,max:1,ans:a*k,ansText:`tick ${a*k}, which is ${F(a*k,D)}`,hint:`Split the line into ${b} equal jumps first. Each jump covers ${k} tick marks.`,explain:`Each ${F(1,b)} jump covers ${k} ticks, so ${F(a,b)} lands on tick ${a} × ${k} = ${a*k}. ${F(a,b)} = ${F(a*k,D)}.`})},
 chain(){const[b1,b2,b3]=pick([[2,4,8],[2,6,12],[3,6,12],[5,10,100],[2,10,100],[2,4,12]]);let a;do a=R(1,b1-1);while(gcd(a,b1)!==1);return mkQ({kind:'num',prompt:'Complete the chain of equal fractions.',eq:`${F(a,b1)} = ${F(a*b2/b1,b2)} = ${F('@@',b3)}`,ans:a*b3/b1,ansText:F(a*b3/b1,b3),hint:`Go straight from ${NTH[b1]} to ${NTH[b3]}: ${b1} × ? = ${b3}.`,explain:`${b1} × ${b3/b1} = ${b3}, so ${a} × ${b3/b1} = ${a*b3/b1}. All three fractions cover the same amount.`})},
 cross(){let[n1,d1,n2,d2]=pick([[6,8,9,12],[2,4,3,6],[2,4,5,10],[4,8,3,6],[2,8,3,12],[4,8,6,12],[3,6,5,10],[25,100,3,12],[75,100,6,8],[5,10,4,8],[50,100,6,12],[20,100,2,10]]);if(R(0,1))[n1,d1,n2,d2]=[n2,d2,n1,d1];const s=simp([n1,d1]);return mkQ({kind:'num',prompt:'Tricky one. You cannot get there in a single slice.',eq:`${F(n1,d1)} = ${F('@@',d2)}`,ans:n2,ansText:F(n2,d2),hint:`Merge parts first to make a simpler fraction, then slice that one.`,explain:`${F(n1,d1)} = ${F(s[0],s[1])} (merge). Then ${F(s[0],s[1])} = ${F(n2,d2)} (slice each part into ${d2/s[1]}).`})},
 compare(){for(;;){const{a,b,D,k}=eqp(MID),x=a*k+pick([-1,0,1]);if(x<1||x>=D)continue;const A=pick(['Ana','Luis','Mei']),B=pick(['Ben','Zora','Kofi']);const r=x>a*k?`${B} is higher.`:x<a*k?`${A} is higher.`:'They are at the same height.';const all=[`${A} is higher.`,`${B} is higher.`,'They are at the same height.'];
  return mc(`${A} has climbed ${F(a,b)} of the wall. ${B} has climbed ${F(x,D)} of the same wall. Who is higher?`,r,all.filter(o=>o!==r),{hint:`Rename ${F(a,b)} in ${NTH[D]} so both fractions use same-size parts.`,explain:`${F(a,b)} = ${F(a*k,D)}. Compare ${F(a*k,D)} with ${F(x,D)}.`})}},

/* ---------- models ---------- */
function bar(n,d,cls,g){if(d===100)return hgrid(n);let h=`<div class="bar ${cls||''}">`;for(let i=0;i<d;i++)h+=`<i class="${i<n?'on':''}${g&&i&&i%g===0?' gb':''}"></i>`;return h+'</div>'}
function bars(n,d,cls){let h='<div class="barwrap">',left=n;do{h+=bar(Math.min(left,d),d,cls);left-=d}while(left>0);return h+'</div>'}
function hgrid(n){let h='<div class="hgrid">';for(let i=0;i<100;i++)h+=`<i class="${i<n?'on':''}"></i>`;return h+'</div>'}
function mrow(lab,inner){return `<div class="mrow"><span class="lab">${lab}</span><div class="barwrap">${inner}</div></div>`}
function lineSVG(d,max,o){o=o||{};const W=660,p=34,L=W-2*p,N=d*max;let s=`<svg viewBox="0 0 ${W} 110" class="nl" role="img" aria-label="number line from 0 to ${max}"><line x1="${p}" y1="60" x2="${W-p}" y2="60" class="ax"/>`;
 for(let i=0;i<=N;i++){const x=p+L*i/N,wh=i%d===0;s+=`<line x1="${x}" x2="${x}" y1="${wh?42:50}" y2="${wh?78:70}" class="ax"/>`;if(wh)s+=`<text x="${x}" y="100" text-anchor="middle" class="nt">${i/d}</text>`;
  if(o.flag===i)s+=`<path d="M${x} 58V16l18 8-18 8" class="flag"/>`;
  if(o.marks&&o.marks[i])s+=`<circle cx="${x}" cy="60" r="8" class="mk"/><text x="${x}" y="30" text-anchor="middle" class="nt">${o.marks[i]}</text>`;
  if(o.click)s+=`<circle cx="${x}" cy="60" r="${Math.min(13,L/N/2)}" class="tk" data-t="${i}"/>`}
 return s+'</svg>'}
function mountModel(el,m){
 if(m.t==='grid'){el.innerHTML=hgrid(m.n);return}
 if(m.t==='line'){el.innerHTML=lineSVG(m.d,m.max,{marks:m.marks});return}
 if(m.t==='bars'){el.innerHTML=m.rows.map((r,i)=>`<div class="mrow"><span class="lab">${F(r[0],r[1])}</span>${bars(r[0],r[1],i?'b2':'')}</div>`).join('');return}
 if(m.t==='split'){let k=1;const draw=()=>{el.innerHTML=`<div class="barwrap">${bar(m.n*k,m.d*k,'',k)}</div><div class="ks"><span>Slice each part into:</span>${m.ks.map(x=>`<button type="button" class="kbtn${x===k?' on':''}" data-k="${x}">${x}</button>`).join('')}</div><p class="tiny">${m.d*k} equal parts in the whole.</p>`;el.querySelectorAll('.kbtn').forEach(b=>b.onclick=()=>{k=+b.dataset.k;draw()})};draw()}
}

function challenge(){const b=others().find(p=>p.presence.k===rec.buddy);if(!b)return;beginDuel(rec.buddy,1+Math.floor(Math.random()*2e9),Math.max(0,Math.min(SECS.length-1,myProg().pt,+b.presence.pt||0)))}
function beginDuel(opp,id,part){duel={id,opp,part,score:0,at:0,fin:false,ms:0,t0:0,qs:null,started:false,logged:false,show:false,last:null,oppName:'Your partner'};mode='duel';pres();vDuel()}
function sbHTML(){const p=oppPeer(),od=oppDuel()||duel.last,row=(n,d)=>`<div class="prow"><span class="pn">${esc(n)}</span><span class="ptrack"><b style="width:${Math.min(100,(+d.at||0)*10)}%"></b></span><span>${+d.score||0} correct · ${d.fin?'finished':'on question '+Math.min(10,(+d.at||0)+1)}</span></div>`;
 return row(rec.name+' (you)',duel)+(od?row(duel.oppName,od):`<p class="tiny">${p?'Waiting for your partner…':'Your partner is not online.'}</p>`)}
function vDuel(){who0();const S=SECS[duel.part];
 app().innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><span class="code">Fraction duel · ${S.code} · ${S.label}</span><button class="link" id="dq" type="button">Leave the duel</button></div><div id="dsb" class="dsb"></div><div id="dbody"></div></div>`;
 app().querySelector('#dq').onclick=()=>vHome();drawBar()}
function duelTick(){if(mode!=='duel'||!duel)return;const sb=document.getElementById('dsb'),body=document.getElementById('dbody');if(!sb)return;const od=oppDuel();sb.innerHTML=sbHTML();
 if(!duel.started){if(od){duel.started=true;duel.qs=duelQs(duel.part,duel.id);duel.t0=Date.now();duelQ()}else if(!body.dataset.w){body.dataset.w='1';body.innerHTML='<h2>Waiting for your partner to accept…</h2><p>They will see your challenge at the top of their screen. You both get the same 10 questions. Most correct wins. If it is a tie, the faster climber wins.</p>'}return}
 if(duel.fin&&duel.show)duelEnd()}
function duelQ(){const body=document.getElementById('dbody'),q=duel.qs[duel.at];let done=false;
 body.innerHTML=`<h2>Question ${duel.at+1} of 10</h2><div id="qh"></div><div id="fb" aria-live="polite"></div><button class="btn" id="ck" type="button">Lock in my answer</button>`;
 const ck=body.querySelector('#ck'),fb=body.querySelector('#fb'),w=mountQ(q,body.querySelector('#qh'),()=>ck.click());
 ck.onclick=()=>{if(done){if(duel.at<10)duelQ();else{duel.show=true;duelTick()}return}
  const r=w.read();if(r===null){fb.innerHTML='<div class="fb hint">Finish your answer first.</div>';return}
  done=true;w.lock();const ok=isRight(q,r);if(ok)duel.score++;duel.at++;if(duel.at>=10){duel.fin=true;duel.ms=Date.now()-duel.t0}pres();
  fb.innerHTML=ok?'<div class="fb good"><b>Correct.</b></div>':`<div class="fb bad"><b>Not this time.</b> Answer: ${q.ansText}</div>`;ck.textContent=duel.at<10?'Next question':'See the result';ck.focus()}}
function duelEnd(){const body=document.getElementById('dbody'),od=oppDuel()||duel.last;let h;
 if(od&&od.fin){const my=duel.score,th=+od.score||0,tm=+od.ms||0,res=my>th?'w':my<th?'l':duel.ms<tm?'w':duel.ms>tm?'l':'t';
  if(!duel.logged){duel.logged=true;rec.duels=Object.assign({w:0,l:0,t:0},rec.duels);rec.duels[res]++;save()}
  h=`<p class="big">${my} – ${th}</p><h2>${res==='w'?'You win the duel!':res==='l'?esc(duel.oppName)+' wins this one.':'It is a tie!'}</h2>${my===th&&res!=='t'?'<p>Same score, so the faster climber wins.</p>':''}`}
 else h=`<p class="big">${duel.score} / 10</p><h2>${oppPeer()?'Waiting for your partner to finish…':'Your partner left the duel.'}</h2><p class="tiny">Stay on this screen to see who wins.</p>`;
 body.innerHTML=h+'<div><button class="btn" id="dh" type="button">Back to base camp</button></div>';body.querySelector('#dh').onclick=()=>vHome()}
function who(){who0();pres()}
function who0(){const w=document.getElementById('who');if(!rec){w.innerHTML='';return}const stars=totalStars();w.innerHTML=`<span class="chip">${esc(rec.name)}</span><span class="chip">★ ${stars} · ${rank(stars)}</span><span class="chip">Streak ${streak}</span><button class="link" id="out" type="button">Switch student</button>`;w.querySelector('#out').onclick=()=>{rec=null;streak=0;vLogin()}}
function trail(s){let h='<div class="trail" aria-label="15 steps then a quiz">';for(let i=0;i<NSTEP;i++)h+=`<i class="${i<s.steps?'done':i===s.steps?'now':''}">${i+1}</i>`;return h+`<span class="gate ${passed(s)?'done':''}">Quiz</span></div>`}

/* ---------- views ---------- */
function vLogin(msg){mode='';duel=null;who();app().innerHTML=`<div class="card pop"><span class="code">NC.4.NF.1 · NC.5.NF.1</span><h1>Climb the Fraction Summit</h1><p>Two ridges with three parts on each. Every part has 15 steps and a quiz gate that opens the next part.</p><form id="lf" class="row"><label for="nm" style="width:100%;font-weight:700">Type your first name and last initial</label><input id="nm" class="name" maxlength="30" autocomplete="off" placeholder="Jordan P"><button class="btn" id="go">Start climbing</button></form><p class="tiny" id="lmsg">${msg||'Use the same name every time so your progress is saved.'}</p></div>`;
 const f=document.getElementById('lf');document.getElementById('nm').focus();
 f.onsubmit=async e=>{e.preventDefault();const name=document.getElementById('nm').value.trim().replace(/\s+/g,' '),key=keyOf(name);if(key.length<2){document.getElementById('lmsg').textContent='Type your name first (at least 2 letters).';return}
  const b=document.getElementById('go');b.disabled=true;b.textContent='Finding your trail…';await timeout(init,10500).catch(()=>{});
  let r=await loadRec(key);if(!r)r={name,key,created:Date.now()};
  SECS.map(S=>S.id).forEach(k=>{r[k]=Object.assign(blankSec(),r[k]||{});r[k].attempts.forEach(a=>{if(!a.done){a.done=true;if(a.score<PASS)r[k].lessonNeeded=true}})});
  rec=r;syncNote();save();vHome()}}
function vHome(){mode='';duel=null;who();if(SECS.every(S=>finished(rec[S.id])))return vFinale();
 const card=(S,i)=>{const s=rec[S.id],state=st(s),locked=i>0&&!finished(rec[SECS[i-1].id]);let pill,btn='';
  if(locked){pill='<span class="pill idle">Locked until the part before it is finished</span>'}
  else if(state==='steps'){pill=`<span class="pill idle">Step ${s.steps+1} of 15</span>`;btn=s.steps?'Keep climbing':'Start climbing'}
  else if(state==='quiz'){pill=`<span class="pill warn">Quiz ready · try ${s.attempts.length+1} of 2</span>`;btn='Go to the quiz'}
  else if(state==='lesson'){pill='<span class="pill warn">Lesson required</span>';btn='Open the lesson'}
  else if(state==='passed'){pill=`<span class="pill good">Passed · ${Math.max(...s.attempts.map(a=>a.score))}/10</span>`}
  else pill='<span class="pill bad">Finished · your teacher will review this with you</span>';
  return `<div class="seccard ${locked?'locked':''}"><h3>Part ${S.part}: ${S.title}</h3>${trail(s)}<div>${pill}</div>${btn?`<div><button class="btn" data-go="${i}" type="button">${btn}</button></div>`:''}</div>`};
 const ridges=RIDGES.map((Rg,r)=>`<section style="margin-top:22px"><span class="code">${Rg.code}</span><h2>Ridge ${r+1}: ${Rg.title}</h2><p class="tiny">${Rg.about}</p><div class="grid2">${SECS.map((S,i)=>S.ridge===r?card(S,i):'').join('')}</div></section>`).join('');
 app().innerHTML=`<div class="card"><h1>Base camp</h1><p>Welcome, ${esc(rec.name)}. Each ridge has three parts. Every part is 15 steps and then a quiz gate. Pass with ${PASS} out of 10 to open the next part.</p>${ridges}</div>`;
 app().querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>enter(+b.dataset.go))}
function enter(i){const state=st(rec[SECS[i].id]);if(state==='steps')vStep(i);else if(state==='quiz')vGate(i);else if(state==='lesson')vLesson(i);else vHome()}
function vStep(si){const S=SECS[si],s=rec[S.id];let tries=0,q=S.steps[s.steps](),w,solved=false;who();
 app().innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><span class="code">${S.code} · ${S.label}</span><button class="link" id="bk" type="button">Back to base camp</button></div>${trail(s)}<h2>Step ${s.steps+1}: ${S.names[s.steps]}</h2><div id="qh"></div><div id="fb" aria-live="polite"></div><div class="row"><button class="btn" id="ck" type="button">Check</button></div></div>`;
 const qh=app().querySelector('#qh'),fb=app().querySelector('#fb'),ck=app().querySelector('#ck');
 app().querySelector('#bk').onclick=vHome;
 const mount=()=>{w=mountQ(q,qh,()=>ck.click())};mount();
 ck.onclick=()=>{
  if(solved){s.steps++;save();return s.steps>=NSTEP?vGate(si):vStep(si)}
  if(ck.dataset.fresh){delete ck.dataset.fresh;q=S.steps[s.steps]();fb.innerHTML='';ck.textContent='Check';mount();return}
  const r=w.read();if(r===null){fb.innerHTML='<div class="fb hint">Finish your answer first. Use whole numbers in each box.</div>';return}
  if(isRight(q,r)){solved=true;w.lock();const got=tries===0?3:tries===1?2:1;s.stars+=got;streak++;who();fb.innerHTML=`<div class="fb good pop"><b>Yes!</b> <span class="stars">${'★'.repeat(got)}</span> ${streak>=3?`Streak of ${streak}. `:''}${q.explain}</div>`;ck.textContent=s.steps+1>=NSTEP?'Go to the quiz gate':'Next step';ck.focus()}
  else{tries++;streak=0;who();qh.classList.remove('shake');void qh.offsetWidth;qh.classList.add('shake');
   if(tries===1)fb.innerHTML=`<div class="fb hint"><b>Not yet.</b> ${q.hint}</div>`;
   else{w.lock();fb.innerHTML=`<div class="fb bad"><b>Here is how it works.</b> ${q.explain}<br>Answer: ${q.ansText}. Now show you can do a new one.</div>`;ck.textContent='Try a new one';ck.dataset.fresh='1'}}}}
function vGate(si){const S=SECS[si],s=rec[S.id];if(st(s)!=='quiz')return enter(si);who();const n=s.attempts.length+1;
 app().innerHTML=`<div class="card pop"><span class="code">${S.code} · Quiz gate</span><h1>Quiz for ${S.label}: ${S.title}</h1><p>You finished all 15 steps. Now show what you know.</p><p><b>10 questions.</b> You need <b>${PASS} correct</b> to pass. No hints.<br>This is <b>try ${n} of 2</b>. ${n===2?'These are new questions.':'If you do not pass, you will take a short lesson and get one more try with new questions.'}<br>Once you begin, the try counts, even if you leave.</p><div class="row"><button class="btn" id="bg" type="button">Begin the quiz</button><button class="btn alt" id="bk" type="button">Not yet</button></div></div>`;
 app().querySelector('#bk').onclick=vHome;app().querySelector('#bg').onclick=()=>vQuiz(si)}
function vQuiz(si){mode='quiz';const S=SECS[si],s=rec[S.id],qs=genQuiz(S,s.used),att={score:0,done:false,at:Date.now(),answered:0};s.attempts.push(att);s.used=s.used.concat(qs.map(q=>q.sig)).slice(-40);save();let i=0;
 const show=()=>{const q=qs[i];let w,done=false;who();
  app().innerHTML=`<div class="card"><span class="code">${S.code} · Quiz · try ${s.attempts.length} of 2</span><h2>Question ${i+1} of 10</h2><div class="qbar"><b style="width:${i*10}%"></b></div><div id="qh"></div><div id="fb" aria-live="polite"></div><div class="row"><button class="btn" id="ck" type="button">Lock in my answer</button></div></div>`;
  const qh=app().querySelector('#qh'),fb=app().querySelector('#fb'),ck=app().querySelector('#ck');w=mountQ(q,qh,()=>ck.click());
  ck.onclick=()=>{if(done){i++;return i<10?show():finish()}
   const r=w.read();if(r===null){fb.innerHTML='<div class="fb hint">Finish your answer first. Use whole numbers in each box.</div>';return}
   done=true;w.lock();const ok=isRight(q,r);if(ok)att.score++;att.answered=i+1;if(i===9)close();save();
   fb.innerHTML=ok?'<div class="fb good"><b>Correct.</b></div>':`<div class="fb bad"><b>Not this time.</b> Answer: ${q.ansText}</div>`;ck.textContent=i<9?'Next question':'See my score';ck.focus()}};
 const close=()=>{att.done=true;if(att.score<PASS)s.lessonNeeded=true};
 const finish=()=>vResult(si,att);show()}
function vResult(si,att){const S=SECS[si],s=rec[S.id],ok=att.score>=PASS;mode='';who();
 app().innerHTML=`<div class="card pop"><span class="code">${S.code} · Quiz result</span><p class="big">${att.score}<span style="font-size:1.4rem"> / 10</span></p>${ok?`<h2>You passed ${S.title}!</h2><p>${si<SECS.length-1?'The next part is now open.':'You reached the summit.'}</p>`:`<h2>Not a pass yet</h2><p>You needed ${PASS}. Take the short lesson next. ${s.attempts.length<2?'Then you get one more try with new questions.':'Your teacher will see your scores and help you with this.'}</p>`}<button class="btn" id="nx" type="button">${ok?'Continue':'Open the lesson'}</button></div>`;
 app().querySelector('#nx').onclick=()=>ok?vHome():vLesson(si)}
function vLesson(si){const S=SECS[si],s=rec[S.id],slides=S.lesson();let i=0;who();
 const show=()=>{app().innerHTML=`<div class="card"><span class="code">${S.code} · Lesson · part ${i+1} of ${slides.length+1}</span>${slides[i]}<div class="row"><button class="btn alt" id="pv" type="button" ${i?'':'disabled'}>Back</button><button class="btn" id="nx" type="button">${i<slides.length-1?'Next':'Now you try'}</button></div></div>`;
  app().querySelector('#pv').onclick=()=>{i--;show()};app().querySelector('#nx').onclick=()=>{i++;i<slides.length?show():tryIt()}};
 const tryIt=()=>{let q=S.tryIt(),w,state=0;app().innerHTML=`<div class="card"><span class="code">${S.code} · Lesson · your turn</span><h2>Show it once to finish the lesson</h2><div id="qh"></div><div id="fb" aria-live="polite"></div><button class="btn" id="ck" type="button">Check</button></div>`;
  const qh=app().querySelector('#qh'),fb=app().querySelector('#fb'),ck=app().querySelector('#ck');const mount=()=>{w=mountQ(q,qh,()=>ck.click())};mount();
  ck.onclick=()=>{if(state===2){s.lessonNeeded=false;s.lessons++;save();return st(s)==='quiz'?vGate(si):vHome()}
   if(state===1){state=0;q=S.tryIt();fb.innerHTML='';ck.textContent='Check';mount();return}
   const r=w.read();if(r===null){fb.innerHTML='<div class="fb hint">Finish your answer first.</div>';return}
   w.lock();if(isRight(q,r)){state=2;fb.innerHTML=`<div class="fb good"><b>That is it.</b> ${q.explain}</div>`;ck.textContent=s.attempts.length<2?'Lesson done. Go to try 2':'Lesson done. Move on'}
   else{state=1;fb.innerHTML=`<div class="fb bad"><b>Look at the steps.</b> ${q.explain}</div>`;ck.textContent='Try another one'}}};
 show()}
function vFinale(){const stars=totalStars(),rows=SECS.map(S=>{const s=rec[S.id],p=passed(s);return `<p><span class="code">${S.code}</span> Part ${S.part}, ${S.title}: <span class="pill ${p?'good':'bad'}">${p?'Passed':'Review with your teacher'}</span> best quiz ${Math.max(0,...s.attempts.map(a=>a.score))}/10</p>`}).join('');
 app().innerHTML=`<div class="card pop"><h1>You finished the climb, ${esc(rec.name)}!</h1><p class="big stars">★ ${stars}</p><p>Rank: <b>${rank(stars)}</b> (${SECS.length*45} stars possible)</p>${rows}<p class="tiny">Your teacher can see your quiz scores.</p></div>`}

/* ---------- teacher dashboard ---------- */
function secStatus(s){const state=st(s);if(state==='steps')return s.steps?['idle',`Step ${s.steps+1}/15`]:['idle','Not started'];if(state==='quiz')return['warn',s.attempts.length?'Try 2 ready':'Quiz ready'];if(state==='lesson')return['warn','In lesson'];if(state==='passed')return['good',`Passed on try ${s.attempts.findIndex(a=>a.done&&a.score>=PASS)+1}`];return['bad','Did not pass']}
async function vDash(){who();await timeout(init,10500).catch(()=>{});
 if(user&&teacher===false){app().innerHTML=`<div class="card"><h2>Teacher dashboard</h2><p>This page is for the teacher. Ask your teacher if you need help.</p><button class="btn" id="bk" type="button">Back</button></div>`;app().querySelector('#bk').onclick=()=>rec?vHome():vLogin();return}
 app().innerHTML=`<div class="card"><h1>Teacher dashboard</h1><p>Loading scores…</p></div>`;
 let all=lsAll(),src='this device only';
 if(db){try{const q=await timeout(db.collection('students').get(),10000);q.docs.forEach(d=>{all[d.id]=d.data()});src='all signed-in devices'}catch(e){src='this device only (shared scores could not be reached)'}}
 const list=Object.values(all).filter(r=>r&&r.name&&r.key).map(r=>{r=clone(r);SECS.forEach(S=>r[S.id]=Object.assign(blankSec(),r[S.id]));return r}).sort((a,b)=>a.name.localeCompare(b.name));
 const cnt=f=>list.filter(f).length,tr=(s,i)=>{const a=s.attempts[i];return a?`${a.score}/10${a.done?'':' (left early)'}`:'–'},ridgePass=(r,g)=>SECS.filter(S=>S.ridge===g).every(S=>passed(r[S.id]));
 const body=list.map(r=>`<tr><th>${esc(r.name)}</th>${SECS.map(S=>{const s=r[S.id],p=secStatus(s);return `<td class="s">${tr(s,0)}</td><td>${tr(s,1)}</td><td><span class="pill ${p[0]}" title="${s.lessons} lesson${s.lessons===1?'':'s'} taken">${p[1]}</span></td>`}).join('')}<td class="s">${r.duels?+r.duels.w||0:0}</td><td>${r.updated?new Date(r.updated).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'–'}</td><td><button class="link" data-reset="${esc(r.key)}" type="button">Reset</button></td></tr>`).join('');
 app().innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h1>Teacher dashboard</h1><div class="row"><button class="btn alt" id="rf" type="button">Refresh</button><button class="btn alt" id="cp" type="button">Copy as CSV</button><button class="btn" id="bk" type="button">Close</button></div></div>
 <p class="tiny">Showing scores from ${src}. Six quizzes, one per part. Passing is ${PASS} of 10. Each student gets two tries per quiz. A miss assigns the lesson before the next try.</p>
 <div class="tiles"><div class="tile"><b>${list.length}</b>students</div><div class="tile"><b>${cnt(r=>ridgePass(r,0))}</b>passed all of NC.4.NF.1</div><div class="tile"><b>${cnt(r=>ridgePass(r,1))}</b>passed all of NC.5.NF.1</div><div class="tile"><b>${cnt(r=>SECS.some(S=>st(r[S.id])==='moved'||r[S.id].lessonNeeded))}</b>need reteaching</div></div>
 ${list.length?`<div class="tw"><table><thead><tr><th rowspan="2">Student</th>${SECS.map(S=>`<th class="grp" colspan="3">${S.code.slice(3)} Part ${S.part}: ${S.title}</th>`).join('')}<th class="s" rowspan="2">Duel wins</th><th rowspan="2">Last active</th><th rowspan="2"></th></tr><tr>${'<th class="s">Try 1</th><th>Try 2</th><th>Status</th>'.repeat(SECS.length)}</tr></thead><tbody>${body}</tbody></table></div>`:'<p>No students have logged in yet. Scores appear here as soon as a student starts.</p>'}
 <p class="tiny">Reset erases one student's progress and quiz tries so they can start over. The CSV also lists steps finished and lessons taken.</p><div id="csv"></div></div>`;
 app().querySelector('#bk').onclick=()=>rec?vHome():vLogin();app().querySelector('#rf').onclick=vDash;
 app().querySelectorAll('[data-reset]').forEach(b=>b.onclick=async()=>{if(!b.dataset.sure){b.dataset.sure='1';b.textContent='Tap again to erase';return}const k=b.dataset.reset;lsPut(k,null);if(db){try{await db.doc('students/'+k).delete()}catch(e){}}if(rec&&rec.key===k)rec=null;vDash()});
 app().querySelector('#cp').onclick=async()=>{const csv=['Student,'+SECS.map(S=>{const p=`${S.code.slice(3)} P${S.part}`;return `${p} steps,${p} try 1,${p} try 2,${p} lessons,${p} status`}).join(',')].concat(list.map(r=>['"'+r.name.replace(/"/g,'""')+'"'].concat(SECS.flatMap(S=>{const s=r[S.id],a=s.attempts;return[s.steps,a[0]?a[0].score:'',a[1]?a[1].score:'',s.lessons,secStatus(s)[1]]})).join(','))).join('\n');
  try{await navigator.clipboard.writeText(csv);app().querySelector('#cp').textContent='Copied'}catch(e){app().querySelector('#csv').innerHTML='<p class="tiny">Select and copy:</p><textarea id="csvt" readonly></textarea>';app().querySelector('#csvt').value=csv}}}

if(typeof document!=='undefined'){document.getElementById('tbtn').onclick=vDash;syncNote();init.then(()=>{syncNote();pres();if(user&&teacher===false)document.getElementById('tbtn').hidden=true});vLogin()}
</script>
</body>
</html>
