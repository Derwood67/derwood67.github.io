<style>
/* Layout: a student desk — sticky header, composition-notebook pages stacked down the middle, red-pen feedback on the same paper. */
:root{
  --desk:#E9EFF6; --paper:#FFFEF9; --ink:#1E2A44; --muted:#5A6680; --rule:#BCD4EE; --margin:#E79A9A;
  --pencil:#F2B632; --pencil-ink:#3A2A00; --redpen:#C2302B; --ok:#1F7A52; --warn:#9A6408; --line:#D3DCE8; --chip:#E3EBF5;
  --fix-bg:#FBE4E2; --warn-bg:#FBF0D9; --ok-bg:#DFF3E8;
  --f-display:"Grandstander","Comic Sans MS",system-ui,sans-serif;
  --f-ui:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-pen:"Gochi Hand","Comic Sans MS",cursive;
  --f-write:"Lexend",system-ui,sans-serif;
  --write-size:20px; --lh:36px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#121822; --paper:#1B2230; --ink:#E7ECF4; --muted:#9BA8BE; --rule:#2C3A52; --margin:#7E4141;
  --pencil:#F2B632; --pencil-ink:#2A1E00; --redpen:#FF8078; --ok:#57C994; --warn:#E8B655; --line:#2B3648; --chip:#253145;
  --fix-bg:#3A2224; --warn-bg:#3A311C; --ok-bg:#1C3529; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#121822; --paper:#1B2230; --ink:#E7ECF4; --muted:#9BA8BE; --rule:#2C3A52; --margin:#7E4141;
  --pencil:#F2B632; --pencil-ink:#2A1E00; --redpen:#FF8078; --ok:#57C994; --warn:#E8B655; --line:#2B3648; --chip:#253145;
  --fix-bg:#3A2224; --warn-bg:#3A311C; --ok-bg:#1C3529; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--desk)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--desk);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px;border-bottom:2px dashed var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand h1{font-size:1.5rem;font-weight:800;letter-spacing:.01em}
.pencil{width:38px;height:38px;flex:none}
.who{font-size:.9rem;color:var(--muted)}
.btn{border:2px solid var(--ink);background:var(--paper);border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 3px 0 var(--ink);transition:transform .08s, box-shadow .08s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--pencil);color:var(--pencil-ink);border-color:var(--pencil-ink);box-shadow:0 3px 0 var(--pencil-ink)}
.btn.small{padding:6px 12px;font-size:.88rem}
.btn.ghost{box-shadow:none;border-color:var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.sheet{background:var(--paper);border-radius:6px;box-shadow:0 1px 0 var(--line),0 8px 24px rgba(20,30,50,.08);padding:24px;position:relative}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
input[type=text]{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--paper)}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:10px 18px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.fonts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fontcard{border:2px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.fontcard[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--pencil)}
.fontcard .sample{font-size:1.25rem;line-height:1.3}
.fontcard .nm{font-size:.75rem;color:var(--muted)}
/* prompt card */
.prompt{display:flex;flex-direction:column;gap:12px}
.prompt .genre{display:inline-flex;align-self:flex-start;background:var(--ink);color:var(--paper);border-radius:999px;padding:3px 12px;font-size:.8rem;font-weight:600;letter-spacing:.04em}
.prompt h2{font-size:1.45rem;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);border-radius:999px;padding:4px 12px;font-size:.88rem}
.chip.used{background:var(--ok-bg);color:var(--ok);font-weight:600;text-decoration:line-through}
.code{font-family:var(--f-ui);font-size:.72rem;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
/* notebook paragraphs */
.para{display:flex;flex-direction:column;gap:8px}
.para-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.para-head h3{font-size:1.15rem}
.para-head .tip{color:var(--muted);font-size:.9rem;flex:1 1 260px;min-width:0}
.para-head .wc{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
textarea.nb{width:100%;min-height:calc(var(--lh)*6 + 16px);resize:vertical;border:1px solid var(--line);border-radius:4px;
  padding:8px 14px 8px 56px;font-family:var(--f-write);font-size:var(--write-size);line-height:var(--lh);color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(90deg,transparent 42px,var(--margin) 42px,var(--margin) 44px,transparent 44px),
    repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px),var(--rule) var(--lh));
  background-position:0 0,0 8px;background-attachment:local}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.size{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted)}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.55);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--paper);border-radius:12px;max-width:520px;width:100%;padding:24px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
.modal h2{font-size:1.4rem}
.checklist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.checklist label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checklist input{width:20px;height:20px;margin-top:3px;accent-color:var(--ink);flex:none}
.warnline{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.92rem}
/* results */
.score{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
@media (max-width:560px){.score{grid-template-columns:1fr;justify-items:start}}
.dial{width:150px;height:150px;position:relative}
.dial svg{width:100%;height:100%}
.dial .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dial .num b{font-family:var(--f-display);font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.dial .num span{font-size:.8rem;color:var(--muted)}
.level{font-family:var(--f-pen);font-size:2rem;color:var(--redpen);transform:rotate(-3deg);display:inline-block;line-height:1.1}
.bars{display:flex;flex-direction:column;gap:8px;min-width:0}
.bar{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;font-size:.9rem}
@media (max-width:480px){.bar{grid-template-columns:110px 1fr 48px}}
.track{height:10px;background:var(--chip);border-radius:6px;overflow:hidden}
.track i{display:block;height:100%;background:var(--ink);border-radius:6px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ok);color:var(--ok);border-radius:999px;padding:4px 12px;font-weight:600;font-size:.88rem}
.badge.locked{border-color:var(--line);color:var(--muted);font-weight:400}
.stars{display:flex;gap:4px}
.stars svg{width:28px;height:28px}
.marked{font-family:var(--f-write);font-size:calc(var(--write-size) * .95);line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;padding:8px 14px 8px 56px;
  background-image:linear-gradient(90deg,transparent 42px,var(--margin) 42px,var(--margin) 44px,transparent 44px);border:1px solid var(--line);border-radius:4px}
mark{color:inherit;background:transparent;border-radius:3px;padding:0 1px}
mark.fix{background:var(--fix-bg);text-decoration:underline wavy var(--redpen);text-underline-offset:4px}
mark.almost{background:var(--warn-bg);text-decoration:underline dashed var(--warn);text-underline-offset:4px}
mark.great{background:var(--ok-bg)}
mark sup{font-family:var(--f-pen);font-size:.8em;color:var(--redpen);margin-left:1px}
mark.great sup{color:var(--ok)} mark.almost sup{color:var(--warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block}
.cards{display:flex;flex-direction:column;gap:10px}
.card{border:1px solid var(--line);border-left-width:6px;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:var(--paper);min-width:0}
.card.fix{border-left-color:var(--redpen)} .card.almost{border-left-color:var(--warn)} .card.great{border-left-color:var(--ok)}
.card .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;border-radius:5px;padding:2px 8px}
.card.fix .tag{background:var(--fix-bg);color:var(--redpen)} .card.almost .tag{background:var(--warn-bg);color:var(--warn)} .card.great .tag{background:var(--ok-bg);color:var(--ok)}
.card .num{font-family:var(--f-pen);font-size:1.25rem;color:var(--muted)}
.card .title{font-weight:600}
.card .change{font-family:var(--f-write);font-size:1.05rem;overflow-wrap:anywhere}
.card .change s{color:var(--redpen);text-decoration-thickness:2px}
.card .change .to{font-family:var(--f-pen);font-size:1.3rem;color:var(--ok)}
.card .why{color:var(--muted);font-size:.93rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:.9rem}
.tabs button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.history{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
.history th,.history td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.tablewrap{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;z-index:30;font-weight:600}
.demo .marked{font-size:1.05rem;padding-left:14px;background-image:none}
.muted{color:var(--muted)}
.redpen{font-family:var(--f-pen);color:var(--redpen);font-size:1.3rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function sentencesOf(text){
  const out=[];const re=/[^.!?]+(?:[.!?]+["”’']?|$)/g;let m;
  while((m=re.exec(text))){if(!m[0].length){re.lastIndex++;continue}
    const raw=m[0];const lead=raw.length-raw.trimStart().length;const s=raw.trim();
    if(s){const prev=out[out.length-1];
      if(prev&&/\b(Mr|Mrs|Ms|Dr|St)\.$/.test(prev.text)){prev.text=text.slice(prev.start,m.index+lead+s.length);prev.end=m.index+lead+s.length}
      else out.push({text:s,start:m.index+lead,end:m.index+lead+s.length})}}
  return out;
}

/* ---------------- prompt maker ---------------- */
function makePrompt(name,grade,forceGenre){
  const used=store.get('pq-used',[]);
  const r=rng(hash(name.toLowerCase()+'|'+Date.now()+'|'+Math.random()));
  let p,tries=0;
  do{
    const g=forceGenre||pick(r,['opinion','informative','narrative']);
    const topic=pick(r,TOPICS[g]);
    p={genre:g,topic:topic.t,keys:topic.k,audience:pick(r,AUDIENCE[g]),bank:shuffle(r,BANK[grade]).slice(0,3),grade,
       challenge:pick(r,['Use at least three transition words.','Use at least one word from your word bank.','Include one question to hook your reader.','Use at least one sentence with a comma before "but" or "so."','Give at least one specific example or number.'])};
    tries++;
  }while(used.includes(p.genre+'|'+p.topic+'|'+p.audience)&&tries<60);
  used.push(p.genre+'|'+p.topic+'|'+p.audience);store.set('pq-used',used.slice(-300));
  return p;
}

      if(wc>32||ands>=3)add({...at(s.start,st.length),type:'almost',cat:'conv',kind:'runon',title:'Run-on sentence',suggestion:ands>=3?'Split at one of the "and"s into two sentences.':'Break this into two or three shorter sentences.',why:`This sentence has ${wc} words${ands>=3?` and ${ands} "and"s`:''}. Long chains are hard to follow. End one idea with a period and start the next with a capital letter.`,std:`L.${g==4?'4.1f':'5.1'}`});
      if(!STARTERS.test(st)&&!/["“”]/.test(st)){const cs=st.match(/, (I|he|she|it|we|they|you) (am|is|was|were|are|went|like|love|loved|liked|have|had|can|will|did|do|think|thought|felt|saw|ran|got|want|wanted|need|needed)\b/);
        if(cs)add({...at(s.start+cs.index,1),type:'almost',cat:'conv',kind:'runon',title:'Comma splice',suggestion:`Change the comma to a period, or add "and," "but," or "so" after it.`,why:'A comma by itself is not strong enough to join two complete sentences. Use a period, or a comma plus a joining word.',std:`L.${g==4?'4.1f':'5.1'}`})}
      const sub=st.match(/^(Because|Since|When|Although|If|While|After|Before|Unless|Whenever)\b/);
      if(sub&&!st.includes(',')){const bad=sub[1]==='Because'&&wc<=9;
        add({...at(s.start,st.length),type:bad?'fix':'almost',cat:'conv',kind:'frag',title:bad?'Sentence fragment':'Comma after the opening part',suggestion:bad?'Join it to the sentence before it, or finish the thought.':`Add a comma after the "${sub[1].toLowerCase()}" part.`,why:bad?'A sentence that starts with "Because" is only half a thought. Attach it to the sentence before it: "I love dogs because they are loyal."':`When a sentence starts with "${sub[1]}," put a comma after that opening part before the main idea. If there is no main idea yet, add one.`,std:`L.${g==4?'4.1f':'5.2b'}`})}
      if(wc<=2&&!/!$/.test(st)&&!/^(Wow|Oh|Hey|Ouch|Yikes|Whoa|Yes|No|Boom|Crash)/i.test(st))add({...at(s.start,st.length),type:'almost',cat:'conv',kind:'frag',title:'Possible fragment',suggestion:'Add a subject and a verb so it is a complete thought.',why:'A complete sentence tells who or what (subject) and what they do or are (verb).',std:`L.${g==4?'4.1f':'5.1'}`});
      const first=(st.match(/^[A-Za-z']+/)||[''])[0].toLowerCase();
      if(first&&first===prevStart){sameRun++;if(sameRun===3)add({...at(s.start,first.length),type:'almost',cat:'word',kind:'variety',title:'Vary your sentence beginnings',suggestion:'Start with a time word, a describing word, or a "When…" phrase.',why:`Three sentences in a row start with "${first}." Changing how sentences begin makes your writing flow.`,std:`L.${g}.3a`})}else sameRun=1;
      prevStart=first;
    });
    // word choice
    let wcNotes=0;const lower=text.toLowerCase();
    for(const m of text.matchAll(/\b(very|really|so) ([a-z]+)\b/gi)){if(wcNotes>=4)break;const w=m[2].toLowerCase();if(VERY[w]){add({...at(m.index,m[0].length),type:'almost',cat:'word',kind:'word',title:'Use one strong word',suggestion:caseLike(m[0],VERY[w]),why:`"${m[0]}" can become one powerful word: "${VERY[w]}." Precise words paint a clearer picture.`,std:`L.${g}.3a`});wcNotes++}}
    for(const w in OVERUSED){if(wcNotes>=4)break;const m=new RegExp('\\b'+w+'\\b','i').exec(text);if(m&&!/\b(very|really|so) $/i.test(text.slice(Math.max(0,m.index-7),m.index))){add({...at(m.index,m[0].length),type:'almost',cat:'word',kind:'word',title:`Upgrade "${w}"`,suggestion:`Try ${OVERUSED[w]}`,why:`"${w}" is a word everyone uses. A more exact word helps your reader see and feel what you mean.`,std:`L.${g}.3a`});wcNotes++}}
    // praise
    let wow=0;const seen=new Set();
    for(const m of text.matchAll(/[A-Za-z]+/g)){const w=m[0].toLowerCase();if(wow>=4)break;
      const inBank=P.bank.some(b=>w.startsWith(b.replace(/e$/,'').toLowerCase())&&w.length<=b.length+3);
      if((WOW.includes(w)||inBank)&&!seen.has(w)){seen.add(w);wow++;add({...at(m.index,m[0].length),type:'great',cat:'word',kind:inBank?'bank':'wow',title:inBank?'Word bank word!':'Strong word choice',suggestion:'',why:inBank?`You used "${m[0]}" from your word bank. That shows you can use new vocabulary.`:`"${m[0]}" is a precise, vivid word. It helps your reader picture exactly what you mean.`,std:`L.${g}.${inBank?6:'3a'}`})}}
    const gram=[
     [/\b[A-Za-z]+,? (who|whose|whom|which)\b/i,'Relative pronoun',`You used "$1" to add detail about a noun. That is a relative pronoun.`,'L.4.1a'],
     [/\b(am|is|are|was|were|will be) [a-z]+ing\b/i,'Progressive verb tense','You used a progressive verb ("$0") to show an action that keeps going.','L.4.1b'],
     [/\b(can|may|must|might|should|could|would)(?! of) [a-z]+/i,'Helping (modal) verb','You used "$1" to show how likely or needed an action is.','L.4.1c'],
    ];
    if(g==5)gram.push([/\b(have|has|had) (\w+ed|been|seen|gone|done|eaten|written|taken|given|known|grown|flown|ridden|driven|chosen|spoken|forgotten|begun|found|made|built)\b/i,'Perfect verb tense','"$0" uses a perfect tense to show an action that is finished or happened before another one.','L.5.1b'],
      [/\b(either\b[^.!?]{1,60}\bor|neither\b[^.!?]{1,60}\bnor|not only\b[^.!?]{1,60}\bbut also)\b/i,'Correlative conjunctions','You used a conjunction pair ("$0") to connect ideas.','L.5.1e'],
      [/\b(Wow|Oh|Hey|Ouch|Yikes|Whoa|Hooray|Oops)[,!]/,'Interjection','"$1" is an interjection. It shows strong feeling, and you punctuated it correctly.','L.5.1a']);
    for(const [re,title,why,std] of gram){const m=re.exec(text);if(m)add({...at(m.index,m[0].length),type:'great',cat:'gram',kind:'gram',title,suggestion:'',why:why.replace('$0',m[0]).replace('$1',m[1]||''),std})}
    for(const m of text.matchAll(/([A-Za-z]+), (but|so|and) (I|he|she|we|they|it|my|the)\b/g)){add({...at(m.index,m[0].length),type:'great',cat:'gram',kind:'comma',title:'Compound sentence',suggestion:'',why:`You joined two complete thoughts with a comma and "${m[2]}." That is a correctly punctuated compound sentence.`,std:'L.4.2c'});break}
  });
  // structure
  const S=(para,o)=>add({para,start:-1,end:-1,original:'',cat:'org',suggestion:'',...o});
  const lc={},sc={};PARTS.forEach(p=>{lc[p.id]=(texts[p.id]||'').toLowerCase();sc[p.id]=sentencesOf(texts[p.id]||'').length});
  const gs=GENRES[P.genre].std(g);
  PARTS.forEach(p=>{
    if(!lc[p.id].trim())S(p.id,{type:'fix',title:`${p.name} is missing`,why:`Your writing needs all three paragraphs. Write your ${p.name.toLowerCase()} before you submit.`,std:gs});
    else if(sc[p.id]<p.min)S(p.id,{type:sc[p.id]<p.min-1?'fix':'almost',title:`Add more sentences to your ${p.name.toLowerCase()}`,why:`This paragraph has ${sc[p.id]} sentence${sc[p.id]==1?'':'s'}. Aim for at least ${p.min} so your ideas are fully developed.`,std:gs});
  });
  const firstSent=(sentencesOf(texts.intro||'')[0]||{text:''}).text;
  if(lc.intro.trim()){
    if(/\?$/.test(firstSent)||/!$/.test(firstSent)||/^(have you ever|imagine|did you know|what if|picture this|close your eyes|"|“)/i.test(firstSent)||(P.genre==='narrative'&&/^(boom|crash|bang|splash|knock|ring|zoom|whoosh|suddenly)/i.test(firstSent)))
      S('intro',{type:'great',cat:'org',title:'Great hook!',why:'Your first sentence grabs the reader\'s attention and makes them want to keep reading.',std:gs+'a'});
    else S('intro',{type:'almost',title:'Try a stronger hook',why:'Start with a question, a surprising fact, a sound, or a line of dialogue to pull your reader in. Example: "Have you ever wondered…?"',std:gs+'a'});
    if(P.genre==='opinion'){
      if(/\b(i think|i believe|in my opinion|i feel|should|shouldn't|is the best|are the best|is better|are better|i prefer|i would rather|i'd rather)\b/.test(lc.intro))S('intro',{type:'great',cat:'org',title:'Clear opinion statement',why:'You told the reader exactly what you think. That is the heart of opinion writing.',std:gs+'a'});
      else S('intro',{type:'fix',title:'State your opinion',why:'Your introduction needs a sentence that tells your opinion, like "I believe…" or "Students should…"',std:gs+'a'});
    }else if(P.genre==='informative'){
      if(P.keys.some(k=>lc.intro.includes(k)))S('intro',{type:'great',cat:'org',title:'Topic introduced',why:'You told the reader what your writing is about right away.',std:gs+'a'});
      else S('intro',{type:'almost',title:'Name your topic',why:'Make sure your introduction clearly says what topic you will explain.',std:gs+'a'});
    }else{
      const setting=/\b(one day|morning|afternoon|night|evening|yesterday|last (week|summer|year)|at (the|my|school|home)|in (the|my)|on (the|a|my))\b/.test(lc.intro);
      if(setting)S('intro',{type:'great',cat:'org',title:'Setting and character',why:'You let the reader know who the story is about and where or when it happens.',std:gs+'a'});
      else S('intro',{type:'almost',title:'Show the setting',why:'Tell the reader when and where your story happens, like "One rainy morning at school…"',std:gs+'a'});
    }
  }
  const all=[lc.intro,lc.body,lc.concl].join(' ');
  const trans=TRANSITIONS.filter(t=>new RegExp('\\b'+t+'\\b').test(lc.body));
  if(lc.body.trim()){
    if(trans.length>=2)S('body',{type:'great',cat:'org',title:'Transition words',why:`You linked your ideas with transitions (${trans.slice(0,4).map(t=>'"'+t+'"').join(', ')}). They guide your reader from one idea to the next.`,std:gs+(P.genre==='narrative'?'c':'c')});
    else if(trans.length===1)S('body',{type:'almost',title:'Add another transition',why:`You used "${trans[0]}." Add at least one more, like "for example," "another reason," "next," or "after that."`,std:gs+'c'});
    else S('body',{type:'fix',title:'Use transition words',why:'Your middle paragraph needs linking words such as "first," "also," "for example," or "next" to connect your ideas.',std:gs+'c'});
    if(P.genre==='opinion'){
      if(/\b(because|for example|for instance|another reason|one reason|this is why|since)\b/.test(lc.body))S('body',{type:'great',cat:'org',title:'Reasons that support your opinion',why:'You backed up your opinion with reasons. That makes your writing convincing.',std:gs+'b'});
      else S('body',{type:'almost',title:'Give reasons',why:'Explain why you feel this way. Use "because," "one reason is," or "for example" to support your opinion.',std:gs+'b'});
    }else if(P.genre==='informative'){
      if(/\d|\b(for example|for instance|such as|in fact|scientists|experts)\b/.test(lc.body))S('body',{type:'great',cat:'org',title:'Facts and examples',why:'You included specific facts or examples. Details like these make informative writing strong.',std:gs+'b'});
      else S('body',{type:'almost',title:'Add a fact or example',why:'Add a specific fact, number, or example. Try "For example," or "Did you know that…"',std:gs+'b'});
    }else{
      if(/["“”]/.test(texts.body||''))S('body',{type:'great',cat:'org',title:'Dialogue',why:'Your characters speak! Dialogue brings a story to life and shows how characters feel.',std:gs+'b'});
      else S('body',{type:'almost',title:'Add dialogue',why:'Let a character talk. Put their exact words inside quotation marks: "Watch out!" yelled Mia.',std:gs+'b'});
    }
  }
  if(lc.concl.trim()){
    if(CLOSERS.some(c=>lc.concl.includes(c)))S('concl',{type:'great',cat:'org',title:'Strong closing transition',why:'You signaled that your writing is wrapping up.',std:gs+(P.genre==='narrative'?'e':'d')});
    else S('concl',{type:'almost',title:'Signal the ending',why:'Begin your conclusion with a closing phrase such as "In conclusion," "Overall," "In the end," or "That is why."',std:gs+(P.genre==='narrative'?'e':'d')});
    if(P.genre==='narrative'){
      if(/\b(learned|realized|felt|feel|never forget|from then on|from now on|ever since|grateful|proud|glad|relieved|happiest|best day)\b/.test(lc.concl))S('concl',{type:'great',cat:'org',title:'Meaningful ending',why:'You showed how your character felt or what they learned. That gives your story a satisfying ending.',std:gs+'e'});
      else S('concl',{type:'almost',title:'Show what changed',why:'End by telling how your character felt or what they learned from the adventure.',std:gs+'e'});
    }else{
      const stop=new Set(['about','their','there','these','those','would','could','should','which','where','because','other','think','believe','really','opinion','conclusion','reason','reasons','things','every','after','before','while','first','also']);
      const kw=new Set(wordsOf(lc.intro).filter(w=>w.length>4&&!stop.has(w)).map(w=>w.slice(0,5)));
      const hit=wordsOf(lc.concl).some(w=>w.length>4&&kw.has(w.slice(0,5)));
      if(hit)S('concl',{type:'great',cat:'org',title:P.genre==='opinion'?'Opinion restated':'Main idea restated',why:'Your conclusion connects back to your introduction. That ties your whole piece together.',std:gs+'d'});
      else S('concl',{type:'almost',title:P.genre==='opinion'?'Restate your opinion':'Restate your main idea',why:'Remind the reader of your main idea from the introduction, using new words.',std:gs+'d'});
    }
  }
  return {issues,trans:TRANSITIONS.filter(t=>new RegExp('\\b'+t+'\\b').test(all)).length,words:wordsOf(all).length};
}

function score(res,P){
  const I=res.issues;const c=(cat,type)=>I.filter(i=>i.cat===cat&&i.type===type).length;
  const conv=Math.max(0,40-4*c('conv','fix')-1.5*c('conv','almost'));
  const org=Math.max(0,30-8*c('org','fix')-4*c('org','almost'));
  const praiseW=I.filter(i=>i.type==='great'&&i.cat==='word').length;
  const word=Math.max(0,Math.min(15,8+1.4*praiseW+0.6*I.filter(i=>i.cat==='gram').length-1*c('word','almost')));
  const target=P.grade==5?180:150;
  const dev=Math.round(15*Math.min(1,res.words/target));
  const total=Math.round(conv+org+word+dev);
  const has=k=>I.some(i=>i.kind===k);
  const kinds=t=>I.filter(i=>i.type!=='great'&&i.kind===t).length;
  const badges=[
   {n:'Spelling Bee',ok:kinds('spell')===0&&kinds('verb')===0&&res.words>=60},
   {n:'Comma Captain',ok:kinds('comma')===0&&res.words>=60},
   {n:'Hook Master',ok:I.some(i=>i.title==='Great hook!')},
   {n:'Transition Trailblazer',ok:res.trans>=3},
   {n:'Word Wizard',ok:I.filter(i=>i.kind==='wow'||i.kind==='bank').length>=3},
   {n:'Sentence Builder',ok:kinds('runon')===0&&kinds('frag')===0&&res.words>=60},
   {n:'Grammar Guardian',ok:I.filter(i=>i.kind==='gram').length>=2},
  ];
  const level=total>=90?'Wow! Publish-ready':total>=75?'Almost there!':total>=55?'Good start. Keep revising!':'Keep building!';
  const stars=total>=90?3:total>=75?2:total>=55?1:0;
  return {total,conv:Math.round(conv),org:Math.round(org),word:Math.round(word),dev,badges,level,stars,target};
}

function saveDraft(){if(S.name)store.set('pq-draft-'+S.name.toLowerCase(),{prompt:S.prompt,texts:S.texts,history:S.history,attempt:S.attempt})}
function applyFont(){const f=FONTS.find(f=>f.id===S.font)||FONTS[0];document.documentElement.style.setProperty('--f-write',f.css);document.documentElement.style.setProperty('--write-size',S.size+'px');document.documentElement.style.setProperty('--lh',Math.round(S.size*1.8)+'px');store.set('pq-font',{font:S.font,size:S.size})}
function toast(msg){const t=$('#toastRoot');t.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>t.innerHTML='',2200)}

const pencilSVG=`<svg class="pencil" viewBox="0 0 40 40" aria-hidden="true"><g transform="rotate(-35 20 20)"><rect x="6" y="15" width="22" height="10" rx="1.5" fill="var(--pencil)" stroke="var(--ink)" stroke-width="1.6"/><rect x="2" y="15" width="5" height="10" rx="1.5" fill="var(--margin)" stroke="var(--ink)" stroke-width="1.6"/><path d="M28 15 L37 20 L28 25 Z" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.6"/><path d="M34.5 18.6 L37 20 L34.5 21.4 Z" fill="var(--ink)"/></g></svg>`;
const starSVG=on=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z" fill="${on?'var(--pencil)':'none'}" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round"/></svg>`;

function markup(text,list){
  const spans=list.filter(i=>i.start>=0).sort((a,b)=>a.start-b.start||b.end-a.end);
  let out='',pos=0;
  for(const s of spans){if(s.start<pos)continue;out+=esc(text.slice(pos,s.start))+`<mark class="${s.type}" title="${esc(s.title)}">${esc(text.slice(s.start,s.end))}<sup>${s.n||''}</sup></mark>`;pos=s.end}
  return out+esc(text.slice(pos));
}
const legend=()=>`<div class="legend"><span><i class="sw" style="background:var(--fix-bg);border:1px solid var(--redpen)"></i>Fix it</span><span><i class="sw" style="background:var(--warn-bg);border:1px solid var(--warn)"></i>Almost there</span><span><i class="sw" style="background:var(--ok-bg);border:1px solid var(--ok)"></i>Great work</span></div>`;

function card(i){
  const tag={fix:'Fix it',almost:'Almost there',great:'Great work'}[i.type];
  const change=i.type!=='great'&&i.original&&i.suggestion?`<div class="change"><s>${esc(i.original.length>70?i.original.slice(0,70)+'…':i.original)}</s> &rarr; <span class="to">${esc(i.suggestion)}</span></div>`:
    (i.type!=='great'&&i.suggestion?`<div class="change"><span class="to">${esc(i.suggestion)}</span></div>`:(i.original&&i.type==='great'?`<div class="change">“${esc(i.original.length>70?i.original.slice(0,70)+'…':i.original)}”</div>`:''));
  return `<div class="card ${i.type}"><div class="hd">${i.n?`<span class="num">#${i.n}</span>`:''}<span class="tag">${tag}</span><span class="title">${esc(i.title)}</span><span class="code">${esc(i.std)}</span></div>${change}<div class="why"><b>Why:</b> ${esc(i.why)}</div></div>`;
}

function viewResults(){
  const R=S.result,sc=R.sc,I=R.issues;
  let n=0;I.forEach(i=>{if(i.start>=0)i.n=++n});
  const counts={fix:I.filter(i=>i.type==='fix').length,almost:I.filter(i=>i.type==='almost').length,great:I.filter(i=>i.type==='great').length};
  const C=2*Math.PI*62;
  const filt=S.tab==='all'?I:I.filter(i=>i.type===S.tab);
  const order={fix:0,almost:1,great:2};
  return `${header()}
  <section class="sheet" style="display:flex;flex-direction:column;gap:18px">
    <div class="score">
      <div class="dial"><svg viewBox="0 0 150 150" aria-hidden="true"><circle cx="75" cy="75" r="62" fill="none" stroke="var(--chip)" stroke-width="14"/><circle cx="75" cy="75" r="62" fill="none" stroke="${sc.total>=90?'var(--ok)':sc.total>=75?'var(--pencil)':'var(--redpen)'}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C*sc.total/100} ${C}" transform="rotate(-90 75 75)"/></svg>
        <div class="num"><b>${sc.total}</b><span>out of 100</span></div></div>
      <div style="display:flex;flex-direction:column;gap:10px;min-width:0">
        <div class="row"><span class="level">${esc(sc.level)}</span><div class="stars" aria-label="${sc.stars} of 3 stars">${[0,1,2].map(k=>starSVG(k<sc.stars)).join('')}</div></div>
        <div class="bars">
          ${[['Grammar & conventions',sc.conv,40],['Organization',sc.org,30],['Word choice',sc.word,15],['Development (length)',sc.dev,15]].map(([l,v,m])=>`<div class="bar"><span>${l}</span><div class="track"><i style="width:${100*v/m}%"></i></div><span class="v">${v}/${m}</span></div>`).join('')}
        </div>
        <p class="muted" style="margin:0;font-size:.88rem">${R.words} words total (goal: ${sc.target}+) · Submission ${S.attempt}</p>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px"><span class="label">Badges</span>
      <div class="badges">${sc.badges.map(b=>`<span class="badge ${b.ok?'':'locked'}">${b.ok?'&#10003; ':''}${esc(b.n)}</span>`).join('')}</div></div>
    <div class="row"><button class="btn primary" type="button" data-act="revise">Revise and resubmit</button><button class="btn" type="button" data-act="next">Start a new story</button><button class="btn ghost" type="button" data-act="copy">Copy results for my teacher</button></div>
  </section>
  <section class="sheet" style="display:flex;flex-direction:column;gap:16px">
    <div class="row" style="justify-content:space-between"><h2 style="font-size:1.3rem">Your marked-up writing</h2>${legend()}</div>
    ${PARTS.map(p=>`<div style="display:flex;flex-direction:column;gap:6px"><span class="label">${p.name}</span><div class="marked">${S.texts[p.id].trim()?markup(S.texts[p.id],I.filter(i=>i.para===p.id)):'<span class="redpen">Missing!</span>'}</div></div>`).join('')}
  </section>
  <section class="sheet" style="display:flex;flex-direction:column;gap:14px">
    <div class="row" style="justify-content:space-between"><h2 style="font-size:1.3rem">Corrections and comments</h2>
      <div class="tabs" role="group" aria-label="Filter feedback">
        ${[['all','All',I.length],['fix','Fix it',counts.fix],['almost','Almost there',counts.almost],['great','Great work',counts.great]].map(([k,l,c])=>`<button type="button" data-tab="${k}" aria-pressed="${S.tab===k}">${l} (${c})</button>`).join('')}</div></div>
    ${PARTS.map(p=>{const list=filt.filter(i=>i.para===p.id).sort((a,b)=>order[a.type]-order[b.type]||(a.n||999)-(b.n||999));
      return list.length?`<div style="display:flex;flex-direction:column;gap:8px"><span class="label">${p.name}</span><div class="cards">${list.map(card).join('')}</div></div>`:''}).join('')||'<p class="muted">Nothing in this group.</p>'}
  </section>
  ${S.history.length>1?`<section class="sheet" style="display:flex;flex-direction:column;gap:10px"><h2 style="font-size:1.2rem">Your progress on this prompt</h2>
    <div class="tablewrap"><table class="history"><thead><tr><th>Submission</th><th>Score</th><th>Fix it</th><th>Almost there</th><th>Great work</th></tr></thead><tbody>
    ${S.history.map((h,k)=>`<tr><td>${k+1}</td><td>${h.total}</td><td>${h.fix}</td><td>${h.almost}</td><td>${h.great}</td></tr>`).join('')}</tbody></table></div></section>`:''}`;
}

function modalHTML(){
  if(S.modal==='submit'){
    const empty=PARTS.filter(p=>!S.texts[p.id].trim());
    const total=wordsOf(Object.values(S.texts).join(' ')).length;
    const items=['I wrote an introduction, a middle paragraph, and a conclusion.','I started every sentence with a capital letter and ended it with punctuation.','I reread my writing out loud to check that it makes sense.','I used transition words to connect my ideas.','I checked my spelling.'];
    return `<div class="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mh"><h2 id="mh">Ready to turn it in?</h2>
      <p class="muted" style="margin:0">Check off each step before you submit. You will be able to revise after you see your feedback.</p>
      ${empty.length?`<div class="warnline">Your ${empty.map(p=>p.name.toLowerCase()).join(' and ')} ${empty.length>1?'are':'is'} still empty. You can submit, but it will lose points.</div>`:''}
      ${total<60&&!empty.length?`<div class="warnline">You have ${total} words. Most strong pieces have at least ${S.grade==5?180:150}.</div>`:''}
      <ul class="checklist">${items.map((t,k)=>`<li><label><input type="checkbox" class="ck" id="ck${k}"> <span>${esc(t)}</span></label></li>`).join('')}</ul>
      <div class="row"><button class="btn primary" type="button" data-act="confirm" id="confirmBtn" disabled>Submit for grading</button><button class="btn ghost" type="button" data-act="close">Keep writing</button></div></div></div>`;
  }
  if(S.modal==='newprompt'||S.modal==='next')return `<div class="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mh"><h2 id="mh">${S.modal==='next'?'Start a new story?':'Get a new prompt?'}</h2>
    <p style="margin:0">${S.modal==='next'?'You will get a brand-new prompt and empty paragraphs.':'Your paragraphs will be cleared so you can start on a new prompt.'}</p>
    <div class="row"><button class="btn primary" type="button" data-act="doNew">Yes, new prompt</button><button class="btn ghost" type="button" data-act="close">Cancel</button></div></div></div>`;
  return '';
}

function render(){
  const app=$('#app');
  app.innerHTML=S.view==='start'?viewStart():S.view==='write'?viewWrite():viewResults();
  $('#modalRoot').innerHTML=modalHTML();
  if(S.modal==='submit')setTimeout(()=>$('#ck0')&&$('#ck0').focus(),0);
}

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.grade){S.grade=+b.dataset.grade;render();return}
  if(b.dataset.font){S.font=b.dataset.font;applyFont();render();return}
  if(b.dataset.tab){S.tab=b.dataset.tab;render();return}
  const a=b.dataset.act;
  if(a==='begin'){const nm=($('#nm').value||'').trim();if(!nm){toast('Type your first name to start.');$('#nm').focus();return}
    S.name=nm;const d=store.get('pq-draft-'+nm.toLowerCase(),null);
    if(d&&d.prompt&&d.prompt.grade==S.grade){S.prompt=d.prompt;S.texts=d.texts;S.history=d.history||[];S.attempt=d.attempt||0;toast('Welcome back! Your draft is saved.')}
    else{S.prompt=makePrompt(nm,S.grade);S.texts={intro:'',body:'',concl:''};S.history=[];S.attempt=0}
    S.view='write';saveDraft();render();window.scrollTo(0,0)}
  if(a==='home'){saveDraft();S.view='start';S.name='';render()}
  if(a==='newprompt'){S.modal='newprompt';render()}
  if(a==='next'){S.modal='next';render()}
  if(a==='doNew'){S.prompt=makePrompt(S.name,S.grade);S.texts={intro:'',body:'',concl:''};S.history=[];S.attempt=0;S.result=null;S.modal=null;S.view='write';S.tab='all';saveDraft();render();window.scrollTo(0,0);toast('New prompt ready')}
  if(a==='submit'){S.modal='submit';render()}
  if(a==='close'){S.modal=null;render()}
  if(a==='confirm'){
    const res=grade(S.texts,S.prompt);res.sc=score(res,S.prompt);S.result=res;S.attempt++;
    S.history.push({total:res.sc.total,fix:res.issues.filter(i=>i.type==='fix').length,almost:res.issues.filter(i=>i.type==='almost').length,great:res.issues.filter(i=>i.type==='great').length});
    S.modal=null;S.view='results';S.tab='all';saveDraft();render();window.scrollTo(0,0)}
  if(a==='revise'){S.view='write';render();window.scrollTo(0,0)}
  if(a==='copy'){const R=S.result,sc=R.sc;
    const txt=`Paragraph Quest results\nStudent: ${S.name} (Grade ${S.grade})\nPrompt (${GENRES[S.prompt.genre].label}): ${S.prompt.topic}\nSubmission ${S.attempt}: ${sc.total}/100 — ${sc.level}\nConventions ${sc.conv}/40 · Organization ${sc.org}/30 · Word choice ${sc.word}/15 · Development ${sc.dev}/15\nWords: ${R.words}\nBadges: ${sc.badges.filter(b=>b.ok).map(b=>b.n).join(', ')||'none yet'}\nFix it: ${R.issues.filter(i=>i.type==='fix').map(i=>i.title).join('; ')||'none'}\n\nINTRODUCTION\n${S.texts.intro}\n\nMIDDLE\n${S.texts.body}\n\nCONCLUSION\n${S.texts.concl}`;
    const fallback=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copied')}catch(err){toast('Select and copy the text manually')}ta.remove()};
    if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('Copied. Paste it where your teacher asks.'),fallback);else fallback()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches('textarea.nb')){S.texts[t.dataset.part]=t.value;const w=$('#wc-'+t.dataset.part);if(w)w.textContent=wordsOf(t.value).length+' words';saveDraft();
    const chips=document.querySelectorAll('.chip');const all=Object.values(S.texts).join(' ');S.prompt.bank.forEach((b,i)=>chips[i]&&chips[i].classList.toggle('used',new RegExp('\\b'+b.replace(/e$/,''),'i').test(all)))}
  if(t.id==='sz'||t.id==='sz2'){S.size=+t.value;applyFont();if(t.id==='sz')t.nextElementSibling.textContent=S.size+'px'}
  if(t.id==='nm')S.name=t.value;
  if(t.classList.contains('ck')){const all=[...document.querySelectorAll('.ck')].every(c=>c.checked);$('#confirmBtn').disabled=!all}
});
document.addEventListener('change',e=>{if(e.target.id==='fontSel'){S.font=e.target.value;applyFont()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;render()}if(e.key==='Enter'&&e.target.id==='nm'){document.querySelector('[data-act="begin"]').click()}});

/* ---------------- boot ---------------- */
function start(saved){
  const f=store.get('pq-font',null);if(f){S.font=f.font;S.size=f.size}
  if(saved&&saved.S)S=Object.assign(S,saved.S,{modal:null});
  applyFont();render();
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
</body>
</html>
