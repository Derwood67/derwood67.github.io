<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lemonade War Reading Stand</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Lemonade-stand sign board. Students sign in, work through 5 skill sections in order
   (Learn -> 10 practice questions -> 10-question mastery check at 80%), then a final book quiz.
   Teacher dashboard behind lock code. */
:root{
  color-scheme: light;
  --sky:#DDF1F8;--paper:#FFFFFF;--ink:#1B2A41;--ink-soft:#4A5A72;
  --lemon:#FFD93B;--rind:#E5A900;--leaf:#1F6B4A;--pink:#E8527A;
  --good:#1F7A4D;--good-bg:#DFF5E6;--bad:#B3261E;--bad-bg:#FBE4E2;
  --display:"Fredoka","Trebuchet MS",sans-serif;
  --body:"Atkinson Hyperlegible","Verdana",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 56px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.7rem,5vw,2.5rem);font-weight:700}
h2{font-size:1.55rem;font-weight:600}
h3{font-size:1.2rem;font-weight:600}
p{margin:0;max-width:65ch}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
[hidden]{display:none!important}

header.sign{background:var(--lemon);border:3px solid var(--ink);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 5px 0 var(--ink)}
.sign-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.sign-top svg{flex:none}
.sign-top .grow{flex:1;min-width:220px}
.byline{font-size:1rem}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:1rem}
.who b{font-family:var(--display);font-size:1.1rem}
.linkbtn{background:none;border:none;padding:0;text-decoration:underline;font-size:.95rem;color:var(--ink-soft)}
.jar{background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.jar-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.jar-label{font-family:var(--display);font-weight:600}
.jar-amt{font-family:var(--display);font-weight:700;font-size:1.3rem;font-variant-numeric:tabular-nums}
.meter{height:22px;border:2px solid var(--ink);border-radius:999px;background:#F3F6F8;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--pink) 0 12px,#F17C9A 12px 24px);transition:width .4s}
.jar-note{font-size:.95rem;color:var(--ink-soft)}

nav.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{font-family:var(--display);font-weight:600;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:8px 14px;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{background:var(--leaf);color:#fff}
.tab:disabled{opacity:.5;cursor:not-allowed;border-style:dashed}
.tab .count{font-size:.85rem;font-variant-numeric:tabular-nums;opacity:.9}

.card{background:var(--paper);border:2px solid var(--ink);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-family:var(--display);font-weight:600;font-size:.9rem;letter-spacing:.08em;text-transform:uppercase;color:var(--leaf)}
.practice .eyebrow{color:var(--pink)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.mini{border:2px solid var(--ink);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;background:#FFF9DC}
.mini.alt{background:#E9F6EE}
.mini p{font-size:1rem}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.85rem;font-weight:700;border:2px solid var(--ink);border-radius:999px;padding:1px 10px;background:var(--paper)}
details{font-size:1rem}
summary{cursor:pointer;font-weight:700;color:var(--leaf)}
details p{margin-top:6px}
ul.plain{margin:0;padding-left:1.2em;max-width:65ch}
ul.plain li{margin:4px 0}

.q{border-top:2px dashed #C9D3DE;padding-top:14px;display:flex;flex-direction:column;gap:10px}
.q:first-child{border-top:none;padding-top:0}
.q-text{font-weight:700;max-width:65ch}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts.stack{flex-direction:column;align-items:stretch}
.opt{background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:8px 14px;text-align:left;box-shadow:0 3px 0 var(--ink)}
.opt:hover:not(:disabled){background:#FFF3B0}
.opt.right{background:var(--good-bg);border-color:var(--good);box-shadow:0 3px 0 var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);box-shadow:none;text-decoration:line-through}
.opt.pick{background:#FFF3B0;border-width:3px}
.opt:disabled{cursor:default}
.fb{font-size:1rem;border-radius:10px;padding:8px 12px;max-width:65ch}
.fb.good{background:var(--good-bg);color:var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb:empty{display:none}

ol.seq{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ol.seq li{display:flex;gap:10px;align-items:center;border:2px solid var(--ink);border-radius:12px;padding:8px 10px;background:#FFF9DC}
ol.seq .num{font-family:var(--display);font-weight:700;width:1.6em;text-align:center;flex:none}
ol.seq .txt{flex:1;font-size:1rem}
ol.seq .mv{display:flex;flex-direction:column;gap:4px;flex:none}
ol.seq .mv button{border:2px solid var(--ink);background:var(--paper);border-radius:8px;width:38px;height:30px;line-height:1;font-weight:700}
ol.seq .mv button:disabled{opacity:.3;cursor:default}
ol.seq.done li{background:var(--good-bg);border-color:var(--good)}

.btn{align-self:flex-start;font-family:var(--display);font-weight:600;background:var(--leaf);color:#fff;border:2px solid var(--ink);border-radius:12px;padding:9px 18px;box-shadow:0 3px 0 var(--ink)}
.btn.alt{background:var(--paper);color:var(--ink)}
.btn.pink{background:var(--pink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.write{background:#E9F6EE}
textarea{width:100%;min-height:110px;border:2px solid var(--ink);border-radius:10px;padding:10px;background:#fff;resize:vertical}
.small{font-size:.92rem;color:var(--ink-soft)}
.lockbox{background:#F3F6F8;border-style:dashed}
.passed-badge{display:inline-block;background:var(--good-bg);color:var(--good);border:2px solid var(--good);border-radius:999px;padding:2px 12px;font-weight:700;font-size:.95rem}
.progress{height:12px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:#F3F6F8}
.progress i{display:block;height:100%;background:var(--leaf);width:0}
.score-big{font-family:var(--display);font-size:2.4rem;font-weight:700}
.missed{border-left:5px solid var(--bad);background:#FFF6F5;padding:8px 12px;border-radius:8px;font-size:1rem}
.missed.ok{border-left-color:var(--good);background:#F2FBF5}

/* login */
.login{max-width:520px;align-self:center;width:100%}
.field{display:flex;flex-direction:column;gap:6px}
.field input{border:2px solid var(--ink);border-radius:10px;padding:10px 12px;background:#fff;font-size:1.1rem}

/* teacher */
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border-bottom:1px solid #C9D3DE;padding:7px 8px;text-align:left;vertical-align:top}
th{font-family:var(--display);font-weight:600;background:#FFF9DC;position:sticky;top:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tscroll{overflow-x:auto;border:2px solid var(--ink);border-radius:12px}
tr.click{cursor:pointer}
tr.click:hover td{background:#FFFBE6}
.pill{display:inline-block;border-radius:999px;padding:0 8px;font-size:.85rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--good-bg);color:var(--good)}
.pill.no{background:var(--bad-bg);color:var(--bad)}
.pill.wait{background:#EEF1F5;color:var(--ink-soft)}
.cert{background:var(--lemon);border:4px double var(--ink);text-align:center;align-items:center}
.modal{position:fixed;inset:0;background:rgba(27,42,65,.55);display:grid;place-items:center;z-index:40;padding:16px}
.modal .card{max-width:460px;width:100%}
@media (prefers-reduced-motion:reduce){.meter i{transition:none}}
@media print{body{background:#fff}.noprint{display:none!important}}
</style>

<body>
<!-- Class sign-in gate: first-name sign-in, blocked names, teacher unlock. The live blocked list is /classgate.json -->
<style>
#cg-ov{position:fixed;inset:0;z-index:2147483000;background:#141c24;display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#cg-ov *{box-sizing:border-box}
#cg-ov .cg-card{background:#fff;color:#1b2420;border-radius:14px;max-width:420px;width:100%;padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 32px rgba(0,0,0,.35);font-size:18px;line-height:1.45}
#cg-ov h2{margin:0;font-size:1.45rem;line-height:1.2}
#cg-ov p{margin:0}
#cg-ov label{font-weight:700}
#cg-ov input{font:inherit;width:100%;padding:12px;border:2px solid #c9d1cc;border-radius:8px;background:#f6f8f6;color:#1b2420}
#cg-ov input:focus{outline:3px solid #f2c230;outline-offset:1px}
#cg-ov button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:12px 16px;background:#0b6b4a;color:#fff;cursor:pointer}
#cg-ov .cg-msg{min-height:1.4em;color:#a83226;font-size:.95rem}
#cg-ov .cg-small{font-size:.9rem;color:#55625b}
#cg-ov details{border-top:1px solid #e1e6e2;padding-top:10px}
#cg-ov summary{cursor:pointer;font-size:.9rem;color:#55625b}
#cg-ov form{display:flex;flex-direction:column;gap:10px;margin:0}
#cg-badge{position:fixed;right:10px;bottom:10px;z-index:2147482000;background:#1b2430;color:#fff;font:600 14px/1.2 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;border-radius:999px;padding:7px 8px 7px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 3px 10px rgba(0,0,0,.25)}
#cg-badge button{font:inherit;background:#f2c230;color:#1b1b1b;border:0;border-radius:999px;padding:4px 10px;cursor:pointer}
</style>
<script data-watch="#nm" data-session="s:lw-who">
(function(){
  var BLOCKED=["james"];          /* fallback list; /classgate.json on the site replaces it when it loads */
  var CODE_HASH="cf2d0fe7ea0a7780592080ef0bf415a6043a3d59aa5d72ace64d39c6e0837285";  /* scrambled teacher code; the code itself is not stored in this page */
  var TRY_KEY="echols-classgate-tries";
  function sha(t){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")})}
  /* Checks a teacher code. Three wrong tries locks code entry on this device for 10 minutes. Resolves "ok", "wrong" or "wait". */
  function checkCode(code){var t={};try{t=JSON.parse(lsGet(TRY_KEY))||{}}catch(x){}
    if(t.until&&Date.now()<t.until)return Promise.resolve("wait");
    return sha("echols-room2:"+String(code||"").trim()).then(function(h){
      if(h===CODE_HASH){lsSet(TRY_KEY,null);return "ok"}
      t.n=(t.n||0)+1;if(t.n>=3){t={n:0,until:Date.now()+600000};lsSet(TRY_KEY,JSON.stringify(t));return "wait"}
      lsSet(TRY_KEY,JSON.stringify(t));return "wrong"},function(){return "wrong"})}
  var CODE_MSG={wrong:"That code is not right.",wait:"Too many tries. Wait 10 minutes and try again."};
  var LOCK_KEY="echols-classgate-lock", NAME_KEY="echols-classgate-name";
  var me=document.currentScript, needLogin=!!(me&&me.getAttribute("data-login")!==null);
      function attr(a){return (me&&me.getAttribute(a))||""}
      /* data-watch: name inputs of an app's own sign-in. data-pick: buttons whose text is a name. data-session: saved sign-ins (s:key or l:key:prop). */
      var WATCH=attr("data-watch"), PICK=attr("data-pick"), SESS=attr("data-session").split(",").filter(Boolean);
      var current="", locked=false;
  function first(n){return String(n||"").trim().split(/[\s\-_]+/)[0].toLowerCase().replace(/[^a-z]/g,"")}
  function isBlocked(n){return BLOCKED.indexOf(first(n))>-1}
  function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function lsSet(k,v){try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
  function ssGet(k){try{return sessionStorage.getItem(k)}catch(e){return null}}
  function ssSet(k,v){try{v===null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function tidy(n){return String(n).replace(/\s+/g," ").trim().split(" ").map(function(w){return w.charAt(0).toUpperCase()+w.slice(1)}).join(" ")}
  function overlay(html){var o=document.getElementById("cg-ov");if(!o){o=document.createElement("div");o.id="cg-ov";o.setAttribute("role","dialog");o.setAttribute("aria-modal","true");document.body.appendChild(o)}o.innerHTML='<div class="cg-card">'+html+'</div>';var i=o.querySelector("input");if(i)setTimeout(function(){i.focus()},30);return o}
  function close(){var o=document.getElementById("cg-ov");if(o)o.remove()}
  function badge(){var b=document.getElementById("cg-badge");if(b)b.remove();var n=ssGet(NAME_KEY);if(!needLogin||!n)return;b=document.createElement("div");b.id="cg-badge";b.innerHTML='<span>'+esc(n)+'</span><button type="button">Sign out</button>';b.querySelector("button").onclick=function(){ssSet(NAME_KEY,null);location.reload()};document.body.appendChild(b)}
  function showBlocked(){
    var o=overlay('<h2>This activity is not available</h2><p>This app is not open to you right now. Please check with Mr. Echols.</p>'+
      '<details><summary>Teacher unlock</summary><form id="cg-unlock" style="margin-top:10px"><label for="cg-code">Teacher code</label><input id="cg-code" type="password" inputmode="numeric" autocomplete="off"><button type="submit">Unlock this device</button><p class="cg-msg" id="cg-umsg"></p></form></details>');
    o.querySelector("#cg-unlock").onsubmit=function(e){e.preventDefault();var c=o.querySelector("#cg-code");
      checkCode(c.value).then(function(r){if(r==="ok"){lsSet(LOCK_KEY,null);ssSet(NAME_KEY,null);location.reload();return}
        c.value="";o.querySelector("#cg-umsg").textContent=CODE_MSG[r]})};
  }
  function lock(){if(locked)return;locked=true;lsSet(LOCK_KEY,"1");ssSet(NAME_KEY,null);var b=document.getElementById("cg-badge");if(b)b.remove();showBlocked()}
  function showLogin(){
    var o=overlay('<h2>Sign in</h2><p class="cg-small">Mr. Echols’ Room 2</p><form id="cg-form"><label for="cg-name">Type your first name</label><input id="cg-name" type="text" maxlength="30" autocomplete="off" autocapitalize="words" placeholder="First name"><button type="submit">Start</button><p class="cg-msg" id="cg-msg"></p></form>');
    o.querySelector("#cg-form").onsubmit=function(e){e.preventDefault();
      var raw=o.querySelector("#cg-name").value.replace(/\s+/g," ").trim();
      if(!/^[A-Za-zÀ-ɏ][A-Za-zÀ-ɏ .'\-]{0,29}$/.test(raw)){o.querySelector("#cg-msg").textContent="Please type your first name using letters.";return}
      if(isBlocked(raw)){lock();return}
      var n=tidy(raw);current=n;ssSet(NAME_KEY,n);close();badge();
      try{document.dispatchEvent(new CustomEvent("classgate:signin",{detail:{name:n}}))}catch(err){}
    };
  }
  window.ClassGate={
    /* Apps with their own sign-in call this; returns false (and locks the device) for a blocked name. */
    check:function(n){if(lsGet(LOCK_KEY)&&BLOCKED.length){showBlocked();return false}if(isBlocked(n)){lock();return false}current=String(n||"");return true},
    name:function(){return ssGet(NAME_KEY)||""},
    /* Teacher code check for in-app teacher tools: resolves "ok", "wrong" or "wait". */
    checkCode:checkCode, codeMsg:function(r){return CODE_MSG[r]||""}
  };
  function saved(){var out=[];SESS.forEach(function(s){var p=s.split(":"),v=null;try{v=(p[0]==="l"?localStorage:sessionStorage).getItem(p[1])}catch(e){}
          if(v&&p[2]){try{v=(JSON.parse(v)||{})[p[2]]}catch(e){v=null}}if(v)out.push(String(v))});return out}
      function watched(){var out=[];if(!WATCH)return out;try{Array.prototype.forEach.call(document.querySelectorAll(WATCH),function(i){if(i!==document.activeElement&&i.value)out.push(i.value)})}catch(e){}return out}
      /* Signs a blocked student out of anything already open. */
      function sweep(){if(locked||!BLOCKED.length)return;
        if(lsGet(LOCK_KEY)){locked=true;showBlocked();return}
        var all=[ssGet(NAME_KEY),current].concat(saved(),watched());
        for(var i=0;i<all.length;i++)if(all[i]&&isBlocked(all[i])){lock();return}}
      function refresh(){if(!window.fetch)return;
        fetch("/classgate.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(j){
          if(j&&Array.isArray(j.blocked)){BLOCKED=j.blocked.map(first).filter(Boolean);sweep()}}).catch(function(){})}
      function guard(e){if(locked)return;var bad=false;
        if(WATCH){try{Array.prototype.forEach.call(document.querySelectorAll(WATCH),function(i){if(i.value&&isBlocked(i.value))bad=true;else if(i.value)current=i.value})}catch(x){}}
        if(!bad&&PICK&&e.type==="click"&&e.target.closest){var b=e.target.closest(PICK);if(b&&isBlocked(b.getAttribute("data-n")||b.textContent))bad=true}
        if(bad){e.preventDefault();e.stopImmediatePropagation();lock()}}
      function start(){
        if(lsGet(LOCK_KEY)&&BLOCKED.length){locked=true;showBlocked();return}
        var n=ssGet(NAME_KEY);
        if(n&&isBlocked(n)){lock();return}
        if(needLogin&&!n)showLogin();else badge();
        if(WATCH||PICK){["submit","click","change"].forEach(function(t){document.addEventListener(t,guard,true)});
          document.addEventListener("keydown",function(e){if(e.key==="Enter")guard(e)},true)}
        sweep();refresh();setInterval(sweep,2000);setInterval(refresh,30000);
        document.addEventListener("visibilitychange",function(){if(!document.hidden)refresh()});
      }
      if(document.body)start();else document.addEventListener("DOMContentLoaded",start);
})();
</script>
<!-- /Class sign-in gate -->

<template id="learn-characters">
  <div class="card">
    <span class="eyebrow">Learn</span>
    <h2>Characters</h2>
    <p>Authors show us who characters are through what they say, do, think, and feel. These are called <strong>character traits</strong>. Good readers also ask what each character <strong>wants</strong> and how the character <strong>changes</strong>.</p>
    <div class="grid">
      <div class="mini">
        <h3>Evan Treski</h3>
        <div class="tagrow"><span class="tag">friendly</span><span class="tag">proud</span><span class="tag">people-smart</span></div>
        <p>Big brother, heading into fourth grade. He makes friends easily, but math is hard for him.</p>
        <details><summary>What he wants and how he changes</summary><p>Evan wants to feel smart and respected. He starts out angry and hiding his feelings. By the end he admits what he did wrong and tells Jessie the truth.</p></details>
      </div>
      <div class="mini alt">
        <h3>Jessie Treski</h3>
        <div class="tagrow"><span class="tag">math whiz</span><span class="tag">determined</span><span class="tag">puzzled by feelings</span></div>
        <p>Little sister. She is skipping third grade and will be in Evan's class. Numbers are easy for her, but people confuse her.</p>
        <details><summary>What she wants and how she changes</summary><p>Jessie wants her brother back and wants to fit in at school. She learns to notice how others feel and to say sorry.</p></details>
      </div>
      <div class="mini">
        <h3>Megan Moriarty</h3>
        <div class="tagrow"><span class="tag">kind</span><span class="tag">generous</span></div>

/* ================= HELPERS ================= */
const $=s=>document.querySelector(s);
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const keyOf=n=>n.toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,50);
const app=()=>$("#app");
const needToPass=n=>Math.ceil(n*PASS-1e-9);
const fmtDate=t=>t?new Date(t).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"—";

/* ================= STORAGE ================= */
let db=null,cloudWrite=true,saveQ=Promise.resolve();
const lsAll=()=>{try{return JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){return{}}};
const lsPut=(k,r)=>{try{const a=lsAll();if(r)a[k]=r;else delete a[k];localStorage.setItem(LS,JSON.stringify(a))}catch(e){}};
const timeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),ms))]);
const clone=o=>JSON.parse(JSON.stringify(o));
const init=(async()=>{try{if(window.claude&&window.claude.use){db=await window.claude.use("db")}}catch(e){db=null}})();
function save(r){r=r||rec;r.updated=Date.now();lsPut(r.key,r);
  if(db&&cloudWrite){const body=clone(r);saveQ=saveQ.then(()=>db.doc("students/"+r.key).set(body)).catch(e=>{if(e&&e.code!=="unavailable")cloudWrite=false})}}
async function loadRec(key){await Promise.race([init,new Promise(r=>setTimeout(r,1500))]);
  if(db){try{const s=await timeout(db.doc("students/"+key).get(),8000);if(s.exists)return clone(s.data())}catch(e){}}
  return lsAll()[key]||null}
async function loadAll(){await Promise.race([init,new Promise(r=>setTimeout(r,1500))]);
  const all=lsAll();let src="this device only";
  if(db){try{const q=await timeout(db.collection("students").get(),10000);q.docs.forEach(d=>{const x=d.data();if(!all[d.id]||(x.updated||0)>=(all[d.id].updated||0))all[d.id]=x});src="this device and all signed-in devices"}catch(e){src="this device only (shared scores could not be reached)"}}
  return{all,src}}
async function removeRec(key){lsPut(key,null);if(db){try{await db.doc("students/"+key).delete()}catch(e){}}}

function blankRec(name){
  const r={key:keyOf(name),name:name.trim(),created:Date.now(),updated:Date.now(),earned:[],writes:{},sec:{},final:{attempts:[],passed:false}};
  SECTIONS.forEach(S=>r.sec[S.id]={attempts:[],passed:false});return r}
function fix(r){if(!r.earned)r.earned=[];if(!r.writes)r.writes={};if(!r.sec)r.sec={};
  SECTIONS.forEach(S=>{if(!r.sec[S.id])r.sec[S.id]={attempts:[],passed:false}});
  if(!r.final)r.final={attempts:[],passed:false};return r}

/* ================= IN-PAGE DIALOG (pop-up boxes are blocked in some viewers) ================= */
function ask(msg,opt){opt=opt||{};return new Promise(res=>{
  const m=el("div","modal");m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");
  const c=el("form","card");c.appendChild(el("p",null,msg));
  let inp=null;if(opt.input){inp=el("input");inp.type="password";inp.inputMode="numeric";inp.autocomplete="off";inp.style.cssText="border:2px solid var(--ink);border-radius:10px;padding:8px 10px;font-size:1.1rem";c.appendChild(inp)}
  const err=el("div","fb bad");c.appendChild(err);
  const row=el("div","row");const ok=el("button","btn",opt.ok||"OK");ok.type="submit";row.appendChild(ok);
  const no=el("button","btn alt",opt.cancel||"Cancel");no.type="button";row.appendChild(no);c.appendChild(row);
  const done=v=>{m.remove();res(v)};
  no.addEventListener("click",()=>done(opt.input?null:false));
  m.addEventListener("keydown",e=>{if(e.key==="Escape")done(opt.input?null:false)});
  c.addEventListener("submit",async e=>{e.preventDefault();if(opt.check){const r=await opt.check(inp.value);if(r!==true){err.textContent=typeof r==="string"?r:(opt.bad||"Try again.");inp.value="";inp.focus();return}}done(opt.input?inp.value:true)});
  m.appendChild(c);document.body.appendChild(m);(inp||ok).focus();
})}
const leaveOk=()=>quiz?ask("Leave the quiz? Your answers on this try will not count.",{ok:"Leave",cancel:"Stay"}):Promise.resolve(true);

/* ================= STATE ================= */
let rec=null,view=null,quiz=null;
const practiceDone=(r,id)=>r.earned.filter(k=>k.startsWith(id+":")).length;
const practiceComplete=(r,id)=>practiceDone(r,id)>=PRACTICE[id].length;
const unlocked=(r,i)=>i===0||r.sec[SECTIONS[i-1].id].passed;
const finalUnlocked=r=>SECTIONS.every(S=>r.sec[S.id].passed);
const best=a=>a.length?a.reduce((b,x)=>x.score/x.total>b.score/b.total?x:b):null;
function currentSpot(r){const i=SECTIONS.findIndex(S=>!r.sec[S.id].passed);return i<0?(r.final.passed?"Finished":"Final quiz"):SECTIONS[i].label}

function updateJar(){
  const money=Math.min(100,rec.earned.length*PER);
  $("#amt").textContent="$"+money;
  $("#bar").style.width=money+"%";
  $("#note").textContent=money>=100?"You earned $100. You win the lemonade war!":
    money===0?"Evan and Jessie raced to earn $100. You can too. Every correct practice answer puts $"+PER+" in your jar.":
    "$"+(100-money)+" to go. Every correct practice answer puts $"+PER+" in your jar.";
}

/* ================= LOGIN ================= */
function showLogin(){
  rec=null;quiz=null;$("#who").hidden=true;$("#jar").hidden=true;
  app().innerHTML=`<div class="card login">
    <span class="eyebrow">Open your stand</span>
    <h2>Sign in to start</h2>
    <p>Type your first and last name. Use the same name every time so your work is saved.</p>
    <form id="login-form" class="field" autocomplete="off">
      <label for="nm"><b>Your name</b></label>
      <input id="nm" maxlength="40" required placeholder="First and last name">
      <div class="fb bad" id="login-fb" role="status"></div>
      <button class="btn" type="submit">Let's read!</button>
    </form>
    <p class="small">You will work through 5 sections in order. Pass each section's 10-question mastery check with ${needToPass(QUIZ_LEN)} or more correct to unlock the next one. Then take the final book quiz.</p>
  </div>`;
  $("#login-form").addEventListener("submit",async e=>{
    e.preventDefault();
    const name=$("#nm").value.replace(/\s+/g," ").trim();
    const fb=$("#login-fb");
    if(name.length<2||!/[a-z]/i.test(name)){fb.textContent="Please type your name.";return}
    if(name.split(" ").length<2){fb.textContent="Please type your first AND last name.";return}
    fb.textContent="";
    const btn=e.target.querySelector("button");btn.disabled=true;btn.textContent="Opening your stand...";
    const key=keyOf(name);
    let r=await loadRec(key);
    if(!r){r=blankRec(name);save(r)}
    rec=fix(r);
    try{sessionStorage.setItem("lw-who",key)}catch(e){}
    startApp();
  });
  $("#nm").focus();
}

function startApp(){
  $("#who").hidden=false;$("#who-name").textContent=rec.name;$("#jar").hidden=false;
  updateJar();
  const i=SECTIONS.findIndex(S=>!rec.sec[S.id].passed);
  view=i<0?"final":SECTIONS[i].id;
  render();
}

/* ================= MAIN RENDER ================= */
function renderTabs(){
  const nav=el("nav","tabs noprint");nav.setAttribute("role","tablist");nav.setAttribute("aria-label","Reading sections");
  SECTIONS.forEach((S,i)=>{
    const ok=unlocked(rec,i),st=rec.sec[S.id];
    const b=el("button","tab");b.type="button";b.setAttribute("role","tab");
    b.setAttribute("aria-selected",view===S.id?"true":"false");b.disabled=!ok;
    b.appendChild(el("span",null,(ok?"":"🔒 ")+(i+1)+". "+S.label));
    b.appendChild(el("span","count",st.passed?"✓":practiceDone(rec,S.id)+"/"+PRACTICE[S.id].length));
    if(!ok)b.title="Pass "+SECTIONS[i-1].label+" first";
    b.addEventListener("click",async()=>{if(!(await leaveOk()))return;quiz=null;view=S.id;render();window.scrollTo(0,0)});
    nav.appendChild(b);
  });
  const fu=finalUnlocked(rec);
  const f=el("button","tab");f.type="button";f.setAttribute("role","tab");f.setAttribute("aria-selected",view==="final"?"true":"false");f.disabled=!fu;
  f.appendChild(el("span",null,(fu?"":"🔒 ")+"Final book quiz"));
  if(rec.final.passed)f.appendChild(el("span","count","✓"));
  f.addEventListener("click",async()=>{if(!(await leaveOk()))return;quiz=null;view="final";render();window.scrollTo(0,0)});
  nav.appendChild(f);
  return nav;
}

function render(){
  const a=app();a.innerHTML="";
  a.appendChild(renderTabs());
  if(quiz){a.appendChild(renderQuiz());return}
  if(view==="final"){renderFinal(a);return}
  renderSection(a,view);
}

function renderSection(a,id){
  const S=SECTIONS.find(x=>x.id===id),idx=SECTIONS.indexOf(S),st=rec.sec[id];
  a.appendChild(document.getElementById("learn-"+id).content.cloneNode(true));

  /* practice */
  const pc=el("div","card practice");
  pc.appendChild(el("span","eyebrow","Practice · "+practiceDone(rec,id)+" of "+PRACTICE[id].length+" done"));
  pc.appendChild(el("h2",null,"Practice: "+S.label));
  pc.appendChild(el("p",null,"Answer all "+PRACTICE[id].length+" practice questions to unlock the mastery check. If you miss, read the hint and try again."));
  const box=el("div");box.style.cssText="display:flex;flex-direction:column;gap:14px";
  PRACTICE[id].forEach((item,i)=>box.appendChild(item.seq?renderSeqItem(id,i):renderPracticeItem(id,i,item)));
  pc.appendChild(box);a.appendChild(pc);

  /* think and write */
  const w=el("div","card write");
  w.appendChild(el("span","eyebrow","Think and write"));
  w.appendChild(el("p",null,S.write));
  const ta=el("textarea");ta.value=rec.writes[id]||"";ta.setAttribute("aria-label","Your written response");
  const saved=el("span","small","");
  let t=null;ta.addEventListener("input",()=>{saved.textContent="Saving...";clearTimeout(t);t=setTimeout(()=>{rec.writes[id]=ta.value.slice(0,3000);save();saved.textContent="Saved for Mr. Echols."},700)});
  w.appendChild(ta);w.appendChild(saved);a.appendChild(w);

  /* mastery check */
  a.appendChild(masteryCard(id,idx,st));
}

function masteryCard(id,idx,st){
  const S=SECTIONS[idx];
  const done=practiceComplete(rec,id);
  const c=el("div","card"+(done?"":" lockbox"));
  c.id="mastery";
  c.appendChild(el("span","eyebrow","Mastery check"));
  c.appendChild(el("h2",null,(done?"":"🔒 ")+S.label+" mastery check"));
  const b=best(st.attempts);
  if(st.passed){
    const p=el("p");p.innerHTML=`<span class="passed-badge">Mastered ✓</span> Best score: <b>${b.score}/${b.total}</b>.`;c.appendChild(p);
    const row=el("div","row");
    if(idx<SECTIONS.length-1){const nx=el("button","btn","Go to "+SECTIONS[idx+1].label+" →");nx.type="button";nx.addEventListener("click",()=>{view=SECTIONS[idx+1].id;render();window.scrollTo(0,0)});row.appendChild(nx)}
    else{const nx=el("button","btn pink","Go to the final book quiz →");nx.type="button";nx.addEventListener("click",()=>{view="final";render();window.scrollTo(0,0)});row.appendChild(nx)}
    const again=el("button","btn alt","Take it again for practice");again.type="button";again.addEventListener("click",()=>startQuiz(id));row.appendChild(again);
    c.appendChild(row);
  }else if(!done){
    c.appendChild(el("p",null,"Finish all the practice questions above to unlock this check. You have "+practiceDone(rec,id)+" of "+PRACTICE[id].length+" done."));
  }else{
    c.appendChild(el("p",null,"Answer "+QUIZ_LEN+" questions. Get "+needToPass(QUIZ_LEN)+" or more right to show mastery and unlock the next section. You can try as many times as you need, and you get a new mix of questions each time."));
    if(st.attempts.length){const last=st.attempts[st.attempts.length-1];c.appendChild(el("p","small","Tries so far: "+st.attempts.length+". Last score: "+last.score+"/"+last.total+". Review the Learn card at the top before you try again."))}
    const go=el("button","btn pink",st.attempts.length?"Try the mastery check again":"Start the mastery check");go.type="button";go.addEventListener("click",()=>startQuiz(id));
    c.appendChild(go);
  }
  return c;
}

function renderPracticeItem(id,i,item){
  const key=id+":"+i,isDone=rec.earned.includes(key);
  const q=el("div","q");
  q.appendChild(el("div","q-text",(i+1)+". "+item.q));
  const opts=el("div","opts"),fb=el("div","fb");fb.setAttribute("role","status");
  item.o.forEach((label,j)=>{
    const b=el("button","opt",label);b.type="button";
    if(isDone){b.disabled=true;if(j===item.a)b.classList.add("right")}
    b.addEventListener("click",()=>{
      if(j===item.a){
        b.classList.add("right");opts.querySelectorAll("button").forEach(x=>x.disabled=true);
        fb.className="fb good";fb.textContent="Correct! +$"+PER+". "+item.why;
        earn(id,key);
      }else{b.classList.add("wrong");b.disabled=true;fb.className="fb bad";fb.textContent="Not yet. "+item.hint}
    });
    opts.appendChild(b);
  });
  if(isDone){fb.className="fb good";fb.textContent="Correct! "+item.why}
  q.appendChild(opts);q.appendChild(fb);return q;
}

function renderSeqItem(id,i){
  const key=id+":"+i,isDone=rec.earned.includes(key);
  const q=el("div","q");
  q.appendChild(el("div","q-text",(i+1)+". Put the events in time order. Use the arrows to move each event, then check your order."));
  const ol=el("ol","seq"),fb=el("div","fb");fb.setAttribute("role","status");
  const chk=el("button","btn","Check my order");chk.type="button";
  let order=SEQ.map((_,k)=>k);
  if(!isDone){do{order=shuffle(order)}while(order.every((v,k)=>v===k))}
  function draw(done){
    ol.innerHTML="";ol.classList.toggle("done",!!done);
    order.forEach((ix,pos)=>{
      const li=el("li");li.appendChild(el("span","num",String(pos+1)));li.appendChild(el("span","txt",SEQ[ix]));
      if(!done){
        const mv=el("span","mv");
        const up=el("button",null,"▲");up.type="button";up.setAttribute("aria-label","Move up");up.disabled=pos===0;
        const dn=el("button",null,"▼");dn.type="button";dn.setAttribute("aria-label","Move down");dn.disabled=pos===order.length-1;
        up.addEventListener("click",()=>{[order[pos-1],order[pos]]=[order[pos],order[pos-1]];draw()});
        dn.addEventListener("click",()=>{[order[pos+1],order[pos]]=[order[pos],order[pos+1]];draw()});
        mv.appendChild(up);mv.appendChild(dn);li.appendChild(mv);
      }
      ol.appendChild(li);
    });
    chk.hidden=!!done;
  }
  chk.addEventListener("click",()=>{
    const right=order.filter((v,k)=>v===k).length;
    if(right===SEQ.length){fb.className="fb good";fb.textContent="Correct! +$"+PER+". Notice how each event causes the next one.";draw(true);earn(id,key)}
    else{fb.className="fb bad";fb.textContent="Not yet. "+right+" of "+SEQ.length+" events are in the right spot. Think about what caused the bet, and how the war ended."}
  });
  draw(isDone);
  if(isDone){fb.className="fb good";fb.textContent="Correct! Each event causes the next one."}
  q.appendChild(ol);q.appendChild(chk);q.appendChild(fb);return q;
}

function earn(id,key){
  if(rec.earned.includes(key))return;
  rec.earned.push(key);save();updateJar();
  // refresh tab counts + mastery card without losing scroll
  const nav=app().querySelector("nav.tabs");if(nav)nav.replaceWith(renderTabs());
  const idx=SECTIONS.findIndex(S=>S.id===id);
  const old=$("#mastery");if(old)old.replaceWith(masteryCard(id,idx,rec.sec[id]));
  const eb=app().querySelector(".practice .eyebrow");if(eb)eb.textContent="Practice · "+practiceDone(rec,id)+" of "+PRACTICE[id].length+" done";
  if(practiceComplete(rec,id)&&!rec.sec[id].passed){setTimeout(()=>{const m=$("#mastery");if(m)m.scrollIntoView({behavior:"smooth",block:"center"})},600)}
}

/* ================= QUIZ ENGINE ================= */
function prepQ(item){
  const idx=item.o.map((_,j)=>j);const order=item.o.length===4?shuffle(idx):idx;
  return{q:item.q,o:order.map(j=>item.o[j]),a:order.indexOf(item.a),why:item.why};
}
function startQuiz(id){
  const bank=id==="final"?FINAL:QUIZ[id];
  const n=id==="final"?FINAL_LEN:QUIZ_LEN;
  // prefer questions not seen on the last try
  const st=id==="final"?rec.final:rec.sec[id];
  const last=st.attempts.length?new Set((st.attempts[st.attempts.length-1].asked||[])):new Set();
  const fresh=shuffle(bank.filter(x=>!last.has(x.q))),seen=shuffle(bank.filter(x=>last.has(x.q)));
  const pick=shuffle(fresh.concat(seen).slice(0,n)).map(prepQ);
  quiz={id,items:pick,i:0,ans:new Array(pick.length).fill(null),done:false};
  render();window.scrollTo(0,0);
}
function quizTitle(id){return id==="final"?"Final book quiz":SECTIONS.find(S=>S.id===id).label+" mastery check"}

function renderQuiz(){
  const c=el("div","card");
  const Q=quiz;
  if(Q.done)return renderResults();
  const it=Q.items[Q.i];
  c.appendChild(el("span","eyebrow",quizTitle(Q.id)));
  c.appendChild(el("h2",null,"Question "+(Q.i+1)+" of "+Q.items.length));
  const pr=el("div","progress");const bar=el("i");bar.style.width=(Q.i/Q.items.length*100)+"%";pr.appendChild(bar);c.appendChild(pr);
  c.appendChild(el("p","q-text",it.q));
  const opts=el("div","opts stack");
  it.o.forEach((label,j)=>{
    const b=el("button","opt"+(Q.ans[Q.i]===j?" pick":""),label);b.type="button";b.setAttribute("aria-pressed",Q.ans[Q.i]===j?"true":"false");
    b.addEventListener("click",()=>{Q.ans[Q.i]=j;render()});
    opts.appendChild(b);
  });
  c.appendChild(opts);
  const row=el("div","row");
  if(Q.i>0){const bk=el("button","btn alt","← Back");bk.type="button";bk.addEventListener("click",()=>{Q.i--;render()});row.appendChild(bk)}
  const last=Q.i===Q.items.length-1;
  const nx=el("button","btn"+(last?" pink":""),last?"Finish and score my quiz":"Next →");nx.type="button";nx.disabled=Q.ans[Q.i]==null;
  nx.addEventListener("click",()=>{
    if(!last){Q.i++;render();return}
    if(Q.ans.some(x=>x==null))return;
    finishQuiz();
  });
  row.appendChild(nx);c.appendChild(row);
  c.appendChild(el("p","small","You will see your score and the answers after you finish."));
  return c;
}

function finishQuiz(){
  const Q=quiz;
  const score=Q.items.reduce((t,it,k)=>t+(Q.ans[k]===it.a?1:0),0),total=Q.items.length;
  const passed=score>=needToPass(total);
  const st=Q.id==="final"?rec.final:rec.sec[Q.id];
  const wasPassed=st.passed;
  st.attempts.push({at:Date.now(),score,total,passed,asked:Q.items.map(x=>x.q),
    missed:Q.items.map((it,k)=>Q.ans[k]===it.a?null:{q:it.q,chose:it.o[Q.ans[k]],right:it.o[it.a]}).filter(Boolean)});
  if(passed)st.passed=true;
  save();
  Q.done=true;Q.score=score;Q.passed=passed;Q.newPass=passed&&!wasPassed;
  render();window.scrollTo(0,0);
}

function renderResults(){
  const Q=quiz,c=el("div","card");
  const need=needToPass(Q.items.length);
  c.appendChild(el("span","eyebrow",quizTitle(Q.id)+" · results"));
  c.appendChild(el("div","score-big",Q.score+" / "+Q.items.length));
  if(Q.passed){
    c.appendChild(el("p","fb good",Q.id==="final"?"You passed the final book quiz! You are a Lemonade War reading expert.":
      "Mastery shown! "+(Q.newPass?"The next section is now unlocked.":"Nice work.")));
  }else{
    c.appendChild(el("p","fb bad","You need "+need+" or more to show mastery. Read the answers below, review the Learn card, and try again. You will get a new mix of questions."));
  }
  c.appendChild(el("h3",null,"Check your answers"));
  Q.items.forEach((it,k)=>{
    const ok=Q.ans[k]===it.a;
    const d=el("div","missed"+(ok?" ok":""));
    d.innerHTML=`<b>${k+1}. ${esc(it.q)}</b><br>${ok?"✓ You chose: "+esc(it.o[Q.ans[k]]):"✗ You chose: "+esc(it.o[Q.ans[k]])+"<br>Correct answer: <b>"+esc(it.o[it.a])+"</b>"}<br><span class="small">${esc(it.why)}</span>`;
    c.appendChild(d);
  });
  const row=el("div","row");
  if(Q.passed){
    const idx=SECTIONS.findIndex(S=>S.id===Q.id);
    if(Q.id==="final"){const b=el("button","btn pink","See my certificate");b.type="button";b.addEventListener("click",()=>{quiz=null;view="final";render()});row.appendChild(b)}
    else if(idx<SECTIONS.length-1){const b=el("button","btn","Go to "+SECTIONS[idx+1].label+" →");b.type="button";b.addEventListener("click",()=>{quiz=null;view=SECTIONS[idx+1].id;render();window.scrollTo(0,0)});row.appendChild(b)}
    else{const b=el("button","btn pink","Go to the final book quiz →");b.type="button";b.addEventListener("click",()=>{quiz=null;view="final";render();window.scrollTo(0,0)});row.appendChild(b)}
  }else{
    const b=el("button","btn","Review the lesson");b.type="button";b.addEventListener("click",()=>{const id=Q.id;quiz=null;view=id;render();window.scrollTo(0,0)});row.appendChild(b);
  }
  c.appendChild(row);
  return c;
}

/* ================= FINAL ================= */
function renderFinal(a){
  if(!finalUnlocked(rec)){const c=el("div","card lockbox");c.appendChild(el("h2",null,"🔒 Final book quiz"));c.appendChild(el("p",null,"Master all five sections to unlock the final quiz."));a.appendChild(c);return}
  const st=rec.final,b=best(st.attempts);
  if(st.passed){
    const c=el("div","card cert");
    c.innerHTML=`<span class="eyebrow" style="color:var(--ink)">Certificate of Mastery</span>
      <h2 style="font-size:2rem">${esc(rec.name)}</h2>
      <p>mastered characters, setting, text structure, main idea, and theme in<br><b>The Lemonade War</b> by Jacqueline Davies</p>
      <p>Final quiz score: <b>${b.score}/${b.total}</b> · Money jar: <b>$${Math.min(100,rec.earned.length*PER)}</b></p>
      <p class="small" style="color:var(--ink)">Mr. Echols' Room 2 · ${new Date(st.attempts.find(x=>x.passed).at).toLocaleDateString()}</p>`;
    a.appendChild(c);
    const row=el("div","row noprint");
    const p=el("button","btn alt","Print certificate");p.type="button";p.addEventListener("click",()=>window.print());row.appendChild(p);
    const again=el("button","btn alt","Take the final quiz again");again.type="button";again.addEventListener("click",()=>startQuiz("final"));row.appendChild(again);
    a.appendChild(row);return;
  }
  const c=el("div","card");
  c.appendChild(el("span","eyebrow","Final book quiz"));
  c.appendChild(el("h2",null,"Show what you know about the whole book"));
  c.appendChild(el("p",null,"Answer "+FINAL_LEN+" questions from all five sections. Get "+needToPass(FINAL_LEN)+" or more right to earn your certificate."));
  if(st.attempts.length){const l=st.attempts[st.attempts.length-1];c.appendChild(el("p","small","Tries so far: "+st.attempts.length+". Last score: "+l.score+"/"+l.total+"."))}
  const go=el("button","btn pink",st.attempts.length?"Try again":"Start the final quiz");go.type="button";go.addEventListener("click",()=>startQuiz("final"));
  c.appendChild(go);a.appendChild(c);
}

/* ================= TEACHER DASHBOARD ================= */
async function teacherGate(){
  const code=await ask("Teacher lock code:",{input:true,ok:"Open dashboard",check:checkTeacherCode});
  if(code===null)return;
  try{sessionStorage.setItem("lw-teacher","1")}catch(e){}
  showDashboard();
}
async function showDashboard(){
  quiz=null;$("#who").hidden=true;$("#jar").hidden=true;
  app().innerHTML=`<div class="card"><h2>Teacher dashboard</h2><p>Loading scores...</p></div>`;
  const {all,src}=await loadAll();
  const list=Object.values(all).map(fix).sort((x,y)=>x.name.localeCompare(y.name));
  const a=app();a.innerHTML="";
  const top=el("div","card");
  top.innerHTML=`<span class="eyebrow">Mr. Echols' Room 2</span><h2>Teacher dashboard</h2>
    <p class="small">Showing scores from <b>${esc(src)}</b>. Mastery = ${Math.round(PASS*100)}% (${needToPass(QUIZ_LEN)}/${QUIZ_LEN} on each section check, ${needToPass(FINAL_LEN)}/${FINAL_LEN} on the final). ${list.length} reader${list.length===1?"":"s"}.</p>`;
  const row=el("div","row noprint");
  const csv=el("button","btn alt","Download CSV");csv.type="button";csv.addEventListener("click",()=>downloadCSV(list));row.appendChild(csv);
  const rf=el("button","btn alt","Refresh");rf.type="button";rf.addEventListener("click",showDashboard);row.appendChild(rf);
  const out=el("button","btn","Lock dashboard");out.type="button";out.addEventListener("click",()=>{try{sessionStorage.removeItem("lw-teacher")}catch(e){}showLogin()});row.appendChild(out);
  top.appendChild(row);a.appendChild(top);

  const tc=el("div","card");
  if(!list.length){tc.appendChild(el("p",null,"No students have signed in yet."));a.appendChild(tc);return}
  const wrap=el("div","tscroll");
  const cell=st=>{const b=best(st.attempts);if(!b)return`<span class="pill wait">—</span>`;
    return`<span class="pill ${st.passed?"ok":"no"}">${b.score}/${b.total}${st.passed?" ✓":""}</span><br><span class="small">${st.attempts.length} tr${st.attempts.length===1?"y":"ies"}</span>`};
  let h=`<table><thead><tr><th>Student</th><th>Now on</th>${SECTIONS.map(S=>`<th>${esc(S.label)}</th>`).join("")}<th>Final</th><th>Practice</th><th>Last active</th></tr></thead><tbody>`;
  list.forEach(r=>{
    h+=`<tr class="click" data-k="${esc(r.key)}"><td><b>${esc(r.name)}</b></td><td>${esc(currentSpot(r))}</td>${SECTIONS.map(S=>`<td class="num">${cell(r.sec[S.id])}</td>`).join("")}<td class="num">${cell(r.final)}</td><td class="num">${r.earned.length}/50<br><span class="small">$${Math.min(100,r.earned.length*PER)}</span></td><td class="num small">${fmtDate(r.updated)}</td></tr>`;
  });
  h+="</tbody></table>";wrap.innerHTML=h;tc.appendChild(el("p","small","Click a student to see every quiz try, missed questions, and written responses."));tc.appendChild(wrap);a.appendChild(tc);
  wrap.querySelectorAll("tr.click").forEach(tr=>tr.addEventListener("click",()=>showStudent(all[tr.dataset.k])));
  window.scrollTo(0,0);
}
function showStudent(r){
  const a=app();a.innerHTML="";
  const c=el("div","card");
  c.innerHTML=`<span class="eyebrow">Student detail</span><h2>${esc(r.name)}</h2>
    <p class="small">Started ${fmtDate(r.created)} · Last active ${fmtDate(r.updated)} · Now on: <b>${esc(currentSpot(r))}</b> · Practice ${r.earned.length}/50</p>`;
  const row=el("div","row noprint");
  const back=el("button","btn alt","← All students");back.type="button";back.addEventListener("click",showDashboard);row.appendChild(back);
  const rs=el("button","btn alt","Reset this student's progress");rs.type="button";rs.addEventListener("click",async()=>{if(!(await ask("Erase all of "+r.name+"'s progress and scores?",{ok:"Erase"})))return;const n=blankRec(r.name);n.created=r.created;save(n);showDashboard()});row.appendChild(rs);
  const del=el("button","btn alt","Remove student");del.type="button";del.addEventListener("click",async()=>{if(!(await ask("Remove "+r.name+" from the dashboard completely?",{ok:"Remove"})))return;await removeRec(r.key);showDashboard()});row.appendChild(del);
  c.appendChild(row);a.appendChild(c);
  const parts=SECTIONS.map(S=>({label:S.label,st:r.sec[S.id],write:r.writes[S.id],prac:practiceDone(r,S.id)+"/"+PRACTICE[S.id].length})).concat([{label:"Final book quiz",st:r.final}]);
  parts.forEach(p=>{
    const d=el("div","card");
    let h=`<h3>${esc(p.label)} ${p.st.passed?'<span class="pill ok">Mastered</span>':'<span class="pill wait">Not yet</span>'}</h3>`;
    if(p.prac)h+=`<p class="small">Practice answered: ${p.prac}</p>`;
    if(!p.st.attempts.length)h+=`<p class="small">No quiz tries yet.</p>`;
    p.st.attempts.forEach((t,k)=>{
      h+=`<div class="missed ${t.passed?"ok":""}"><b>Try ${k+1}: ${t.score}/${t.total} ${t.passed?"✓":""}</b> <span class="small">${fmtDate(t.at)}</span>`;
      if(t.missed&&t.missed.length)h+=`<ul class="plain small">${t.missed.map(m=>`<li>${esc(m.q)}<br>Chose: ${esc(m.chose)} · Correct: <b>${esc(m.right)}</b></li>`).join("")}</ul>`;
      h+=`</div>`;
    });
    if(p.write!=null)h+=`<p><b>Think and write:</b></p><p style="white-space:pre-wrap;background:#E9F6EE;border-radius:8px;padding:8px 12px">${p.write?esc(p.write):'<span class="small">(blank)</span>'}</p>`;
    d.innerHTML=h;a.appendChild(d);
  });
  window.scrollTo(0,0);
}
function downloadCSV(list){
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const head=["Student","Now on","Practice"].concat(SECTIONS.flatMap(S=>[S.label+" best",S.label+" tries",S.label+" mastered"]),["Final best","Final tries","Final mastered","Last active"]);
  const rows=list.map(r=>{
    const f=st=>{const b=best(st.attempts);return[b?b.score+"/"+b.total:"",st.attempts.length,st.passed?"yes":"no"]};
    return[r.name,currentSpot(r),r.earned.length+"/50"].concat(SECTIONS.flatMap(S=>f(r.sec[S.id])),f(r.final),[new Date(r.updated).toLocaleString()]);
  });
  const text=[head].concat(rows).map(x=>x.map(q).join(",")).join("\r\n");
  const blob=new Blob([text],{type:"text/csv"});const u=URL.createObjectURL(blob);
  const l=document.createElement("a");l.href=u;l.download="lemonade-war-scores.csv";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
}
