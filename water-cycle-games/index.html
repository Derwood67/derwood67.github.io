<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Eleven Grades 4-5 water cycle and weather games aligned to the NC 2023 science standards.">
<title>Water Cycle Game Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap">
<style>
:root{ color-scheme:light; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px) }
*,*::before,*::after{ box-sizing:border-box }
body{ margin:0; font-size:14px; font-family:system-ui,sans-serif }
img{ max-width:100% }
[hidden]{ display:none!important }
</style>
<style>
/* Layout: game picker strip up top, one game stage below; each game is a single focused card */
:root{
  --bg:#eef6fa; --surface:#ffffff; --ink:#15303d; --muted:#4f6b78; --line:#cfe1ea;
  --lake:#1f7a9c; --lake-soft:#d8eef6; --sun:#e89a1c; --sun-soft:#fdf0d6;
  --good:#1d8a4e; --good-soft:#dcf3e5; --bad:#c2412d; --bad-soft:#fbe3de;
  --sky:#cfe8f4; --ground:#8fb069; --cloud:#ffffff; --water:#3f9cc4; --leaf:#3f7d3a; --leaf-soft:#e1f0dc; --ice:#6d7fb0; --ice-soft:#e4e8f5; --tree:#3f7d3a; --trunk:#7a5533;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1d25; --surface:#142a35; --ink:#e3f1f7; --muted:#9db8c4; --line:#244452;
  --lake:#5cc0e2; --lake-soft:#173d4c; --sun:#f3b347; --sun-soft:#3a2c12;
  --good:#5fd394; --good-soft:#163b28; --bad:#f08a76; --bad-soft:#41201b;
  --sky:#1b3a4a; --ground:#4d6a35; --cloud:#d9e6ec; --water:#2f86ad; --leaf:#7cc673; --leaf-soft:#1c3a1a; --ice:#a9b7e6; --ice-soft:#232a45; --tree:#4f9a48; --trunk:#9a7350;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0d1d25; --surface:#142a35; --ink:#e3f1f7; --muted:#9db8c4; --line:#244452;
  --lake:#5cc0e2; --lake-soft:#173d4c; --sun:#f3b347; --sun-soft:#3a2c12;
  --good:#5fd394; --good-soft:#163b28; --bad:#f08a76; --bad-soft:#41201b;
  --sky:#1b3a4a; --ground:#4d6a35; --cloud:#d9e6ec; --water:#2f86ad; --leaf:#7cc673; --leaf-soft:#1c3a1a; --ice:#a9b7e6; --ice-soft:#232a45; --tree:#4f9a48; --trunk:#9a7350;
  color-scheme:dark }
body{ background:var(--bg); color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.5 }
.wrap{ max-width:820px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:20px 60px; display:flex; flex-direction:column; gap:18px }
.eyebrow{ font-size:13px; letter-spacing:.08em; text-transform:uppercase; font-weight:800; color:var(--lake) }
h1{ font-family:var(--display); font-weight:800; font-size:clamp(30px,6vw,42px); line-height:1.05; margin:0; text-wrap:balance }
h1 span{ color:var(--sun) }
h2{ font-family:var(--display); font-weight:800; font-size:26px; margin:0; line-height:1.1 }
.sub{ margin:0; color:var(--muted); max-width:62ch }
.picker{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px }
.pick{ font:inherit; text-align:left; border:2px solid var(--line); background:var(--surface); color:var(--ink); border-radius:14px; padding:12px 14px; cursor:pointer; display:flex; flex-direction:column; gap:2px }
.pick strong{ font-family:var(--display); font-size:20px; line-height:1.1 }
.pick small{ color:var(--muted); font-size:14px }
.pick[aria-current="true"]{ border-color:var(--lake); background:var(--lake-soft) }
.stage{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:14px; min-width:0 }
.top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap }
.top p{ margin:4px 0 0; color:var(--muted); font-size:15px; max-width:52ch }
.stats{ display:flex; gap:8px; flex-wrap:wrap }
.stat{ background:var(--lake-soft); border-radius:10px; padding:4px 12px; font-weight:800; font-size:15px; font-variant-numeric:tabular-nums }
.btn{ font:inherit; font-weight:800; font-size:16px; border-radius:10px; padding:9px 16px; border:2px solid var(--lake); background:transparent; color:var(--lake); cursor:pointer }
.btn:hover{ background:var(--lake-soft) }
.btn.solid{ background:var(--lake); color:var(--surface) }
button:focus-visible{ outline:3px solid var(--sun); outline-offset:2px }
.qtext{ font-weight:700; font-size:18px; margin:0 }
.opts{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr)); gap:8px }
.opt{ font:inherit; font-size:16px; text-align:left; padding:10px 12px; border-radius:10px; border:2px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer }
.opt:hover:not(:disabled){ border-color:var(--lake) }
.opt:disabled{ cursor:default }
.is-right{ border-color:var(--good)!important; background:var(--good-soft)!important }
.is-wrong{ border-color:var(--bad)!important; background:var(--bad-soft)!important }
.fb{ font-size:15px; border-radius:10px; padding:8px 12px; margin:0 }
.fb.ok{ background:var(--good-soft) } .fb.no{ background:var(--bad-soft) }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center }
.win{ background:var(--sun-soft); border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:8px }
.win h3{ font-family:var(--display); font-size:24px; margin:0 }
.win p{ margin:0 }

/* journey */
.loop{ overflow-x:auto }
.loop svg{ display:block; width:100%; min-width:460px; height:auto; border-radius:12px }
.drop{ transition:transform .5s ease }

/* match */
.grid{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px }
@media (max-width:520px){ .grid{ grid-template-columns:repeat(3,minmax(0,1fr)) } }
.card{ font:inherit; font-size:14px; font-weight:700; min-height:96px; border-radius:12px; border:2px solid var(--lake); background:var(--lake); color:var(--surface); cursor:pointer; padding:8px; display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.25; overflow-wrap:anywhere }
.card.up{ background:var(--surface); color:var(--ink) }
.card.up.term{ font-family:var(--display); font-size:17px; color:var(--lake) }
.card.got{ background:var(--good-soft); border-color:var(--good); color:var(--ink); cursor:default }

/* sort */
.example{ background:var(--bg); border:2px dashed var(--line); border-radius:14px; padding:18px; font-size:20px; font-weight:700; text-align:center; text-wrap:balance }
.bins{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px }
.bin{ font:inherit; font-weight:800; font-size:16px; border-radius:12px; padding:12px 10px; cursor:pointer; border:2px solid; display:flex; flex-direction:column; gap:2px; align-items:flex-start; text-align:left }
.bin small{ font-weight:600; font-size:13px; opacity:.85 }
.bin span.ct{ font-variant-numeric:tabular-nums; font-size:13px }
.bin.evap{ border-color:var(--sun); background:var(--sun-soft); color:var(--ink) }
.bin.tran{ border-color:var(--leaf); background:var(--leaf-soft); color:var(--ink) }
.bin.cond{ border-color:var(--lake); background:var(--lake-soft); color:var(--ink) }
.bin.prec{ border-color:var(--ice); background:var(--ice-soft); color:var(--ink) }
.bin:disabled{ opacity:.6; cursor:default }

/* speed */
.timer{ height:12px; border-radius:6px; background:var(--lake-soft); overflow:hidden }
.timer span{ display:block; height:100%; background:var(--sun); width:100% }
.statement{ font-size:22px; font-weight:800; text-align:center; text-wrap:balance; margin:6px 0; min-height:3em; display:flex; align-items:center; justify-content:center }
.tf{ display:grid; grid-template-columns:1fr 1fr; gap:10px }
.tf .btn{ font-size:22px; padding:16px }
.tf .t{ border-color:var(--good); color:var(--good) }
.tf .f{ border-color:var(--bad); color:var(--bad) }
.flash-ok{ color:var(--good) } .flash-no{ color:var(--bad) }
.pick .tag{ display:flex; gap:6px; flex-wrap:wrap; margin-top:4px }
.pick .tag em{ font-style:normal; font-size:12px; font-weight:800; letter-spacing:.04em; border-radius:6px; padding:1px 7px; background:var(--sun-soft); color:var(--ink) }
.pick .tag em.g4{ background:var(--leaf-soft) }
.filters{ display:flex; gap:8px; flex-wrap:wrap; align-items:center }
.filters span{ font-size:14px; font-weight:800; color:var(--muted) }
.fchip{ font:inherit; font-size:15px; font-weight:800; border-radius:999px; padding:5px 14px; border:2px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer }
.fchip[aria-pressed="true"]{ border-color:var(--lake); background:var(--lake-soft) }
.stdline{ font-size:14px; color:var(--muted); margin:0; max-width:70ch }
.stdline b{ color:var(--ink) }
.tablewrap{ overflow-x:auto }
table.wx{ border-collapse:collapse; font-size:15px; font-variant-numeric:tabular-nums; min-width:100% }
table.wx th, table.wx td{ border:1px solid var(--line); padding:6px 10px; text-align:left; white-space:nowrap }
table.wx th{ background:var(--lake-soft) }
.wxcap{ font-weight:800; font-size:14px; color:var(--muted); margin:0 0 4px }
.meter2{ height:12px; border-radius:6px; background:var(--bad-soft); overflow:hidden }
.meter2 span{ display:block; height:100%; background:var(--good); transition:width .4s }
.two{ display:grid; grid-template-columns:1fr 1fr; gap:10px }
.two .btn{ font-size:19px; padding:14px 10px }
.letters{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center }
.ltr{ font:inherit; font-family:var(--display); font-weight:800; font-size:22px; width:44px; height:48px; border-radius:10px; border:2px solid var(--lake); background:var(--surface); color:var(--lake); cursor:pointer }
.ltr:disabled{ opacity:.25; cursor:default }
.slots{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; min-height:52px }
.slot{ font:inherit; font-family:var(--display); font-weight:800; font-size:22px; width:44px; height:48px; border-radius:10px; border:2px solid var(--sun); background:var(--sun-soft); color:var(--ink); cursor:pointer }
.slot.empty{ border-style:dashed; background:transparent; cursor:default }
.clue{ text-align:center; font-weight:700; margin:0 }
.steps{ display:flex; flex-direction:column; gap:8px }
.step{ font:inherit; font-size:16px; text-align:left; padding:10px 12px; border-radius:10px; border:2px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer; display:flex; gap:10px; align-items:center }
.step:disabled{ opacity:.4; cursor:default }
.step .n{ font-family:var(--display); font-weight:800; color:var(--lake); min-width:1.6em; font-variant-numeric:tabular-nums }
.colhead{ font-weight:800; font-size:14px; color:var(--muted); margin:0; text-transform:uppercase; letter-spacing:.06em }
.ordergrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr)); gap:14px }
.ordergrid > div{ display:flex; flex-direction:column; gap:8px; min-width:0 }
@media (prefers-reduced-motion: reduce){ .meter2 span{ transition:none } }

/* 40-question practice */
.pr{ display:flex; flex-direction:column; gap:18px }
.pr .pbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:4; background:var(--surface); padding-block:8px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:4px }
.pr .pbar-top{ display:flex; justify-content:space-between; font-size:14px; font-weight:800; font-variant-numeric:tabular-nums }
.pr .track{ height:10px; border-radius:6px; background:var(--lake-soft); overflow:hidden; display:flex }
.pr .track .g{ background:var(--good) } .pr .track .b{ background:var(--bad) }
.pr .part{ display:flex; flex-direction:column; gap:12px }
.pr .part h3{ font-family:var(--display); font-weight:800; font-size:22px; margin:6px 0 0; line-height:1.1 }
.pr .part > p{ margin:0; color:var(--muted) }
.pr .bank{ display:flex; flex-wrap:wrap; gap:8px; font-weight:700 }
.pr .bank span{ background:var(--sun-soft); border-radius:999px; padding:3px 12px; font-size:15px }
.pr .model{ background:var(--lake-soft); border-radius:12px; padding:14px 16px; max-width:62ch }
.pr .q{ background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:12px }
.pr .q.right{ border-color:var(--good) } .pr .q.wrong{ border-color:var(--bad) }
.pr .qrow{ display:flex; gap:10px; font-weight:600 }
.pr .num{ font-family:var(--display); font-weight:800; color:var(--lake); min-width:2ch; font-variant-numeric:tabular-nums }
.pr .opts.words{ grid-template-columns:repeat(auto-fit,minmax(130px,1fr)) }
.pr .opt{ background:var(--surface); display:flex; gap:8px; align-items:flex-start }
.pr .opt b{ color:var(--muted) }
.pr .opt.dim{ opacity:.55 }
.pr .fb strong{ margin-right:4px }
.pr .scroll{ overflow-x:auto }
.pr .scene{ position:relative; min-width:540px; aspect-ratio:600/340; border-radius:14px; overflow:hidden; border:1px solid var(--line) }
.pr .scene svg{ position:absolute; inset:0; width:100%; height:100% }
.pr .zone{ position:absolute; transform:translate(-50%,-50%); font:inherit; font-size:14px; font-weight:800; min-width:118px; padding:6px 8px; border-radius:10px; border:2px dashed var(--lake); background:var(--surface); color:var(--lake); cursor:pointer; font-variant-numeric:tabular-nums }
.pr .zone.armed{ border-style:solid; box-shadow:0 0 0 4px var(--sun-soft) }
.pr .zone.is-right{ color:var(--good) } .pr .zone.is-wrong{ color:var(--bad) }
.pr .zone:disabled{ cursor:default }
.pr .sunlabel{ position:absolute; left:12%; top:25%; transform:translate(-50%,0); font-weight:800; font-size:14px }
.pr .chips{ display:flex; flex-wrap:wrap; gap:8px }
.pr .chip{ font:inherit; font-weight:800; font-size:15px; padding:8px 14px; border-radius:999px; border:2px solid var(--sun); background:var(--sun-soft); color:var(--ink); cursor:pointer }
.pr .chip[aria-pressed="true"]{ background:var(--sun); color:var(--surface) }
.pr .chip:disabled{ opacity:.35; cursor:default }
.pr .hint{ font-size:15px; color:var(--muted); margin:0 }
@media (prefers-reduced-motion: reduce){ .drop{ transition:none } }
</style>
</head>
<body>
<main class="wrap">
  <header style="display:flex;flex-direction:column;gap:6px">
    <span class="eyebrow">Grades 4–5 Science · NC 2023 Standard Course of Study</span>
    <h1>Water Cycle <span>Game Room</span></h1>
    <p class="sub">Eleven games, including the full 40-question challenge, on the water cycle, weather, and how water shapes the land. Each game lists the NC science standard it practices. Pick one to play.</p>
  </header>
  <div class="filters" role="group" aria-label="Show games for a grade">
    <span>Show:</span>
    <button class="fchip" type="button" data-f="all" aria-pressed="true">All games</button>
    <button class="fchip" type="button" data-f="4" aria-pressed="false">Grade 4</button>
    <button class="fchip" type="button" data-f="5" aria-pressed="false">Grade 5</button>
  </div>
  <nav class="picker" aria-label="Choose a game">
    <button class="pick" type="button" data-game="practice" data-g="5"><strong>40-Question Challenge</strong><small>The full worksheet with instant feedback and a diagram to label</small><span class="tag"><em>ESS.5.1.4</em></span></button>
    <button class="pick" type="button" data-game="journey" data-g="5"><strong>Raindrop Journey</strong><small>Answer questions to carry a drop around the cycle</small><span class="tag"><em>ESS.5.1.4</em></span></button>
    <button class="pick" type="button" data-game="match" data-g="5"><strong>Memory Match</strong><small>Flip cards to pair words with meanings</small><span class="tag"><em>ESS.5.1.4</em></span></button>
    <button class="pick" type="button" data-game="sort" data-g="5"><strong>Sort It Out</strong><small>Put real-life examples in the right process</small><span class="tag"><em>ESS.5.1.4</em></span></button>
    <button class="pick" type="button" data-game="speed" data-g="5"><strong>60-Second Splash</strong><small>True or false, as fast as you can</small><span class="tag"><em>ESS.5.1.4</em></span></button>
    <button class="pick" type="button" data-game="weather" data-g="5"><strong>Weather Watch</strong><small>Read real-style weather data and spot the pattern</small><span class="tag"><em>ESS.5.1.1</em><em>ESS.5.1.2</em></span></button>
    <button class="pick" type="button" data-game="coast" data-g="5"><strong>Coast or Mountains?</strong><small>How the ocean shapes North Carolina weather</small><span class="tag"><em>ESS.5.1.3</em></span></button>
    <button class="pick" type="button" data-game="heat" data-g="4 5"><strong>Heat It or Cool It</strong><small>Decide what energy change makes water change state</small><span class="tag"><em class="g4">PS.4.2.1</em><em>PS.5.1.3</em></span></button>
    <button class="pick" type="button" data-game="garden" data-g="4"><strong>Rain Garden Rescue</strong><small>Choose actions that stop flooding and erosion</small><span class="tag"><em class="g4">ESS.4.3.2</em><em class="g4">ESS.4.2.3</em></span></button>
    <button class="pick" type="button" data-game="scramble" data-g="4 5"><strong>Word Scramble</strong><small>Unscramble water and weather vocabulary</small><span class="tag"><em class="g4">ESS.4.2.3</em><em>ESS.5.1</em></span></button>
    <button class="pick" type="button" data-game="order" data-g="4 5"><strong>What Happens Next?</strong><small>Put the steps of each water story in order</small><span class="tag"><em class="g4">ESS.4.3.2</em><em>ESS.5.1.4</em></span></button>
  </nav>
  <p class="stdline" id="stdline"></p>
  <section class="stage" id="stage" aria-live="polite"></section>
</main>

<script>
const $ = (t,c,x)=>{const e=document.createElement(t); if(c) e.className=c; if(x!=null) e.textContent=x; return e;};
const shuffle = a=>{a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;};
const stage = document.getElementById("stage");

/* ---------- shared question bank ---------- */
const Q = [
 ["What is the main source of energy that drives the water cycle?",["the moon","the sun","the wind","the ocean"],1,"The sun supplies the heat energy for the whole cycle."],
 ["A puddle on the playground is gone by the afternoon on a sunny day. Which process caused this?",["condensation","precipitation","evaporation","transpiration"],2,"The sun heats the puddle and the water becomes water vapor."],
 ["Which process is the release of water vapor from the leaves of plants?",["transpiration","condensation","precipitation","runoff"],0,"Transpiration is water vapor leaving a plant through its leaves."],
 ["Water droplets form on the outside of a cold glass of lemonade. Which process does this model?",["evaporation","condensation","precipitation","transpiration"],1,"Water vapor cools on the cold glass and becomes liquid."],
 ["Water vapor rises, cools, and forms clouds. What happens to its energy?",["It gains thermal energy.","It loses thermal energy and becomes tiny droplets.","It turns into ice by gaining energy.","It stays the same."],1,"Cooling means losing thermal energy, so the vapor condenses."],
 ["Cloud droplets join until they are too heavy to stay up. What happens next?",["evaporation","transpiration","condensation","precipitation"],3,"Heavy drops fall as precipitation."],
 ["One pan of water sits in the sun and one in the shade. After 3 hours, which is most likely?",["The shade pan has less water.","The sun pan has less water.","Both have the same.","The sun pan has more water."],1,"More of the sun's energy means faster evaporation."],
 ["Why would the water cycle slow down without the sun?",["Clouds would block the rain.","Plants would release more water.","There would not be enough heat to evaporate water.","Oceans would turn fresh."],2,"Without the sun's heat, little water evaporates."],
 ["Water vapor is water in which state of matter?",["solid","liquid","gas","It has no state."],2,"Water vapor is water as an invisible gas."],
 ["On which day would wet laundry dry fastest?",["a hot, sunny day","a cool, cloudy day","a cold, rainy day","a chilly night"],0,"More heat means faster evaporation."],
 ["What are clouds mostly made of?",["smoke","tiny drops of water or ice","dust only","invisible water vapor"],1,"Clouds are condensed droplets and ice crystals you can see."],
 ["A bathroom mirror fogs up after a hot shower. Which process is this?",["evaporation","condensation","precipitation","transpiration"],1,"Warm vapor condenses on the cooler mirror."],
 ["Why does water vapor condense high in the sky?",["The air up high is warmer.","The air up high is colder.","The sun is closer.","Plants push it up."],1,"Colder air up high cools the vapor so it condenses."],
 ["Which order shows water moving from a lake back to the ground?",["precipitation → evaporation → condensation","condensation → precipitation → evaporation","evaporation → condensation → precipitation","evaporation → precipitation → condensation"],2,"Evaporate, condense into clouds, then fall."],
 ["Rain, snow, sleet, and hail are all forms of what?",["evaporation","transpiration","condensation","precipitation"],3,"Water falling from clouds is precipitation."],
 ["Dew forms on grass on a cool morning. Which process made it?",["evaporation","condensation","precipitation","transpiration"],1,"Vapor in the air cools on the grass and condenses."],
 ["In a bowl model, sunlight shines on warm water. What does the sunlight represent?",["the sun's energy, which starts evaporation","rain","a cloud","a plant"],0,"Sunlight is the energy that makes water evaporate."],
 ["In the bowl model, drops form under cold plastic wrap. What does this model?",["evaporation","condensation","precipitation","transpiration"],1,"Vapor cools on the cold wrap and condenses."],
 ["A bag over a plant in the sun gets drops inside. Which process put water into the bag's air?",["precipitation","runoff","transpiration","melting"],2,"The leaves released water vapor."],
 ["During evaporation, liquid water…",["loses energy and freezes","gains thermal energy and becomes a gas","falls from a cloud","soaks into soil"],1,"Energy from the sun lets water escape as a gas."]
];

/* ---------- 1. Raindrop Journey ---------- */
function journey(){
  const STEPS = 12;
  let pos=0, asked=0, right=0, deck=shuffle(Q), locked=false;
  const labels = {0:"Lake", 3:"Evaporation", 6:"Condensation", 9:"Precipitation"};
  const P = Array.from({length:STEPS},(_,i)=>{ const a = Math.PI*1.25 - i/STEPS*2*Math.PI; return [300+220*Math.cos(a), 160+105*Math.sin(-a)]; });
  stage.innerHTML="";
  const top=$("div","top"); const tl=$("div"); tl.appendChild($("h2",null,"Raindrop Journey")); tl.appendChild($("p",null,"Each right answer moves your raindrop one step around the water cycle. Get it all the way back to the lake to win."));

      if(k!=null) sb.onclick=()=>{ if(done) return; picked.splice(p,1); lbs[k].disabled=false; render(); }; slots.appendChild(sb); } }
    function finish(ok){ done=true; lbs.forEach(b=>b.disabled=true); [check,clear,give].forEach(b=>b.remove());
      if(ok) right++; fb.appendChild($("p","fb "+(ok?"ok":"no"), ok?`Correct! ${w.toLowerCase()}.`:`The word is ${w.toLowerCase()}.`));

    check.onclick=()=>{ const guess=picked.map(k=>mix[k]).join(""); if(guess.length<w.length){ fb.innerHTML=""; fb.appendChild($("p","fb no","Use all the letters first.")); return; }
      if(guess===w) finish(true); else { fb.innerHTML=""; fb.appendChild($("p","fb no","Not quite. Tap Clear and try a new order.")); } };

    endCard(done,`You scored ${correct} out of 40 (${pct}%)`, pct>=90?"Excellent work. You can explain how the sun's energy drives every part of the water cycle.":pct>=70?"Good job. Scroll up to the red cards and reread the explanations for the ones you missed.":"Keep practicing. Review the red cards, then play again.", ()=>{ practice(); stage.scrollIntoView({block:"start"}); }); }
}

const GAMES={practice,journey,match,sort,speed,weather,coast,heat,garden,scramble,order};
function open(name){ if(!GAMES[name]) name="practice"; clearInterval(speedTimer);
  document.querySelectorAll(".pick").forEach(p=>p.setAttribute("aria-current", p.dataset.game===name?"true":"false"));
  const sd=STD[name]; const sl=document.getElementById("stdline"); sl.innerHTML=""; const b=document.createElement("b"); b.textContent="Standard "+sd[0]+": "; sl.append(b, document.createTextNode(sd[1]));
  GAMES[name](); }
document.querySelectorAll(".pick").forEach(p=>p.addEventListener("click",()=>{ if(location.hash==="#"+p.dataset.game) open(p.dataset.game); else location.hash=p.dataset.game; stage.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"start"}); }));
document.querySelectorAll(".fchip").forEach(c=>c.addEventListener("click",()=>{ const f=c.dataset.f;
  document.querySelectorAll(".fchip").forEach(x=>x.setAttribute("aria-pressed", x===c?"true":"false"));
  document.querySelectorAll(".pick").forEach(p=>{ p.hidden = f!=="all" && !p.dataset.g.split(" ").includes(f); }); }));
window.addEventListener("hashchange",()=>open(location.hash.slice(1)));
open(location.hash.slice(1));
