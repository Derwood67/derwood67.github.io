<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Check-In Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}

/* Layout: graph-paper notebook page; one big question card centred, a 20-dot progress strip above it */
:root{
  --paper:#f3f7f8; --grid:#dbe8ec; --ink:#16303a; --muted:#56717b; --card:#ffffff; --line:#c9dade;
  --sci:#0f8a7e; --sci-soft:#d9f1ee; --frac:#d9572b; --frac-soft:#fbe4da;
  --good:#1f8a4c; --good-soft:#dcf3e5; --warn:#b7791f; --warn-soft:#fbefd5; --bad:#c23b3b; --bad-soft:#f9dfdf;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1c21; --grid:#18292f; --ink:#e6f1f3; --muted:#93acb4; --card:#152a31; --line:#264047;
  --sci:#3cc2b3; --sci-soft:#173c39; --frac:#f08a5d; --frac-soft:#3d2419;
  --good:#4fcf86; --good-soft:#163a26; --warn:#e9b04f; --warn-soft:#3b2e14; --bad:#f07272; --bad-soft:#3d1b1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1c21; --grid:#18292f; --ink:#e6f1f3; --muted:#93acb4; --card:#152a31; --line:#264047;
  --sci:#3cc2b3; --sci-soft:#173c39; --frac:#f08a5d; --frac-soft:#3d2419;
  --good:#4fcf86; --good-soft:#163a26; --warn:#e9b04f; --warn-soft:#3b2e14; --bad:#f07272; --bad-soft:#3d1b1b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;min-height:100%}
.wrap{max-width:860px;margin:0 auto;padding-block:24px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent,var(--sci));outline-offset:3px}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* menu */
.hero{display:grid;gap:8px;margin-bottom:24px}
.hero h1{font-size:clamp(40px,7vw,64px);font-weight:800}
.hero h1 span{color:var(--sci)} .hero h1 em{font-style:normal;color:var(--frac)}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.decks{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.deck{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:10px;
  transition:transform .15s,border-color .15s}
.deck:hover{transform:translateY(-3px);border-color:var(--c)}
.deck .tag{justify-self:start;background:var(--soft);color:var(--c);font-weight:700;font-size:13px;padding:3px 10px;border-radius:99px}
.deck h2{font-size:28px;font-weight:800}
.deck p{margin:0;color:var(--muted);font-size:15px}
.deck .go{font-family:var(--display);font-weight:800;color:var(--c);font-size:18px}
.opts{margin-top:20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--muted);font-size:15px}
.toggle{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:99px;padding:6px 14px}
.toggle input{accent-color:var(--sci);width:18px;height:18px}

/* game */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin-bottom:14px}
.bar .left{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:4px 14px;font-weight:700;font-variant-numeric:tabular-nums}
.chip b{color:var(--accent)}
.ghost{background:none;border:2px solid var(--line);border-radius:99px;padding:4px 14px;font-weight:700;color:var(--muted)}
.dots{display:grid;grid-template-columns:repeat(var(--n,30),1fr);gap:4px;margin-bottom:16px}
.dot{height:10px;border-radius:99px;background:var(--line)}
.dot.now{background:var(--accent)} .dot.ok{background:var(--good)} .dot.no{background:var(--bad)}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,32px);display:grid;gap:18px}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.std{background:var(--soft);color:var(--accent);font-weight:700;font-size:13px;padding:3px 10px;border-radius:99px}
.qnum{font-family:var(--display);font-weight:800;color:var(--muted)}
.qtext{font-size:clamp(19px,2.6vw,23px);font-weight:700;margin:0;max-width:62ch}
.viz{display:grid;gap:10px;overflow-x:auto}
.viz svg{display:block;max-width:100%;height:auto}
.viz .lbl{font-family:var(--display);font-weight:800;font-size:20px}
.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.ans{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:17px;min-width:0}
.ans .why{display:block;font-size:15px;margin-top:4px;color:var(--ink);opacity:.85}
.ans .t{min-width:0}
.ans .k{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--card);border:2px solid var(--line);font-family:var(--display);font-weight:800}
.ans:hover:not(:disabled){border-color:var(--accent)}
.ans:disabled{cursor:default}
.ans.right{background:var(--good-soft);border-color:var(--good)} .ans.right .k{background:var(--good);color:#fff;border-color:var(--good)}
.ans.wrong{background:var(--bad-soft);border-color:var(--bad)} .ans.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.ans.dim{opacity:.8}
.fb{border-radius:14px;padding:14px 16px;display:grid;gap:4px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fb strong{font-family:var(--display);font-size:20px}
.fb.ok strong{color:var(--good)} .fb.no strong{color:var(--bad)}
.fb p{margin:0}
.next{justify-self:end;background:var(--accent);color:#fff;border:none;border-radius:14px;padding:12px 22px;font-family:var(--display);font-weight:800;font-size:19px}
.hint{color:var(--muted);font-size:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .next{color:#0f1c21}}
:root[data-theme="dark"] .next{color:#0f1c21}

/* results */
.big{font-family:var(--display);font-weight:800;font-size:clamp(56px,12vw,96px);line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.res{display:grid;gap:16px}
.res .row{display:flex;flex-wrap:wrap;gap:10px}
.btn{background:var(--accent);color:#fff;border:none;border-radius:14px;padding:12px 20px;font-family:var(--display);font-weight:800;font-size:18px}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.miss{display:grid;gap:10px}
.miss div{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.miss b{display:block}
.miss span{color:var(--muted);font-size:15px}
/* name + chart + report */
.who{margin-top:20px;display:grid;gap:6px;max-width:420px}
.who label{font-weight:700}
.who input{font:inherit;font-size:19px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.who input:focus{outline:3px solid var(--sci);outline-offset:2px}
.who .err{color:var(--bad);font-size:15px;font-weight:700}
.chart{display:grid;gap:10px}
.crow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto;gap:12px;align-items:center}
.crow .nm{font-weight:700;font-size:15px;min-width:0}
.track{height:22px;background:var(--paper);border:2px solid var(--line);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px}
.pill{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap;font-variant-numeric:tabular-nums}
.lv-bad .fill{background:var(--bad)} .lv-bad .pill{background:var(--bad-soft);color:var(--bad)}
.lv-warn .fill{background:var(--warn)} .lv-warn .pill{background:var(--warn-soft);color:var(--warn)}
.lv-good .fill{background:var(--good)} .lv-good .pill{background:var(--good-soft);color:var(--good)}
@media (max-width:560px){.crow{grid-template-columns:1fr auto}.crow .track{grid-column:1/-1;grid-row:2}}
.focus{background:var(--bad-soft);border-radius:14px;padding:12px 16px}
.focus.allgood{background:var(--good-soft)}
.send{border:2px dashed var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:10px}
.send pre{margin:0;white-space:pre-wrap;font-family:var(--body);font-size:14px;background:var(--paper);border-radius:10px;padding:10px 12px;max-height:180px;overflow:auto}
.send .addr{font-weight:700;user-select:all}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{from{transform:scale(.98);opacity:.6}to{transform:none;opacity:1}}
.card{animation:pop .2s ease-out}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
// Each answer: [text, explanation of why it is right or wrong]. c = index of the correct answer.
const SCI = [
 {s:"Matter",q:"A student pours 200 g of water into a cup and stirs in 20 g of salt until it dissolves. What is the mass of the salt water?",c:2,a:[
  ["180 g","This subtracts the salt. The salt didn't leave the cup, so its mass is still counted."],
  ["200 g","This counts only the water. Dissolved salt is invisible, but it is still there and still has mass."],
  ["220 g","Mass is conserved: 200 g + 20 g = 220 g. Dissolving doesn't destroy any matter."],
  ["240 g","This adds 20 g twice. Nothing new was added, so the total is 200 g + 20 g."]]},
 {s:"Matter",q:"Which of these is a chemical change?",c:1,a:[
  ["An ice cube melting","Melting is a physical change. The water is still water, just in liquid form."],
  ["An iron nail rusting","Rust is a new substance formed when iron reacts with oxygen and water. That makes it a chemical change."],
  ["Paper being cut in half","Cutting changes size and shape only. Each piece is still paper, so this is a physical change."],
  ["Sugar dissolving in tea","Dissolving is a physical change. The sugar is still sugar and could be recovered by evaporating the water."]]},
 {s:"Matter",q:"Baking soda and vinegar are sealed in a plastic bag. The bag has a mass of 150 g. The mixture fizzes and the bag puffs up. What is the mass of the sealed bag now?",c:1,a:[
  ["Less than 150 g","Mass would go down only if gas escaped. The bag is sealed, so the gas is trapped inside."],
  ["Exactly 150 g","In a closed system, mass is conserved. The gas is new, but it is made from matter already in the bag."],
  ["More than 150 g","No matter entered the sealed bag. Puffing up means more volume, not more mass."],
  ["It cannot be measured","You can measure it on a scale. The sealed bag will still read 150 g."]]},
 {s:"Matter",q:"A 30 g ice cube melts completely in a closed container. What is the mass of the water?",c:2,a:[
  ["15 g","Melting doesn't cut matter in half. Changing state doesn't change mass."],
  ["25 g","No water escaped from the closed container, so no mass was lost."],
  ["30 g","Melting is a physical change. The water has the same mass as the ice did."],
  ["35 g","Nothing was added. Liquid water has the same mass as the ice it came from."]]},
 {s:"Matter",q:"Which mixture could be separated most easily using a magnet?",c:1,a:[
  ["Salt and water","Salt is not magnetic. Evaporation would separate this mixture."],
  ["Sand and iron filings","Iron is magnetic. A magnet pulls the filings out and leaves the sand behind."],
  ["Sugar and flour","Neither is magnetic. A magnet would not pull either one out."],
  ["Rice and beans","Neither is magnetic. You could sort these by hand or with a sieve."]]},
 {s:"Matter",q:"Which observation is the BEST evidence that a new substance formed?",c:2,a:[
  ["Water turns to steam when heated","Steam is still water in gas form. This is a physical change."],
  ["Clay is rolled into a ball","Only the shape changed. The clay is still clay."],
  ["Two liquids are mixed, bubbles form, and the cup gets warm","A gas forming and a temperature change are signs of a chemical change, which makes a new substance."],
  ["Juice is poured into a taller glass","The juice only changed containers. Its substance didn't change."]]},
 {s:"Matter",q:"Which property tells how much space an object takes up?",c:1,a:[
  ["Mass","Mass is the amount of matter in an object, not the space it fills."],
  ["Volume","Volume is the amount of space an object takes up."],
  ["Color","Color is a property you can see. It doesn't tell how much space something fills."],
  ["Temperature","Temperature tells how hot or cold something is, not its size."]]},
 {s:"Matter",q:"Which substance will dissolve in water?",c:3,a:[
  ["Sand","Sand sinks to the bottom and stays visible. It doesn't dissolve."],
  ["Pebbles","Pebbles don't break apart and spread through the water, so they don't dissolve."],
  ["Cooking oil","Oil floats on top of water in a layer. It doesn't dissolve."],
  ["Sugar","Sugar spreads evenly through the water and disappears from view. It dissolves and forms a solution."]]},
 {s:"Forces & Motion",q:"A ball is thrown straight up into the air. Why does it fall back to the ground?",c:1,a:[
  ["Friction pulls it down","Friction slows objects that rub together. It doesn't pull things toward Earth."],
  ["Gravity pulls it toward Earth","Gravity is the force that pulls objects toward the center of Earth."],
  ["Air pushes it down","Air resistance slows the ball, but it doesn't cause the fall."],
  ["It runs out of energy and stops","Objects don't just stop. A force, gravity, changes the ball's motion and pulls it down."]]},
 {s:"Forces & Motion",q:"A car travels 120 miles in 2 hours at a steady speed. What is its speed?",c:1,a:[
  ["30 miles per hour","This divides by 4 instead of 2. Speed = 120 ÷ 2."],
  ["60 miles per hour","Speed = distance ÷ time. 120 miles ÷ 2 hours = 60 miles per hour."],
  ["118 miles per hour","This subtracts instead of dividing. Speed means distance divided by time."],
  ["240 miles per hour","This multiplies instead of dividing. Speed = distance ÷ time."]]},
 {s:"Forces & Motion",q:"Two students push identical toy cars on the same floor. Kim pushes much harder than Leo. What most likely happens?",c:2,a:[
  ["Both cars travel the same distance","The forces are different, so the changes in motion will be different too."],
  ["Leo's car travels farther","Leo used the smaller force. A smaller push makes a smaller change in motion."],
  ["Kim's car moves faster and farther","A greater force causes a greater change in motion, so Kim's car speeds up more and goes farther."],
  ["Neither car moves","Both students push the cars, so both cars move."]]},
 {s:"Forces & Motion",q:"A toy car rolls off a ramp onto four different surfaces. On which surface will it stop the soonest?",c:3,a:[
  ["Smooth tile","Tile is smooth, so it has low friction. The car would roll a long way."],
  ["Ice","Ice has very little friction. The car would roll the farthest."],
  ["Wood floor","Wood is fairly smooth. The car would roll farther than on carpet."],
  ["Thick carpet","Carpet is rough, so it creates the most friction and slows the car fastest."]]},
 {s:"Forces & Motion",q:"Two teams pull on a rope with equal force in a tug-of-war. What happens to the rope?",c:2,a:[
  ["It moves toward the stronger team","Neither team is stronger here. The forces are equal."],
  ["It moves up into the air","The pulls are sideways. Nothing is pulling the rope upward."],
  ["It does not move","Equal forces in opposite directions are balanced. Balanced forces don't change motion."],
  ["It speeds up","Only unbalanced forces make an object speed up."]]},
 {s:"Forces & Motion",q:"A soccer ball is sitting still on the grass. What will make it start moving?",c:0,a:[
  ["An unbalanced force, like a kick","An unbalanced force changes an object's motion. A kick starts the ball moving."],
  ["Balanced forces acting on it","Balanced forces cancel out. The ball would stay still."],
  ["Gravity alone","Gravity pulls the ball down into the ground. It doesn't roll the ball across flat grass."],
  ["Nothing can make it move","Any unbalanced force, like a push or a kick, can start it moving."]]},
 {s:"Ecosystems",q:"In the food chain grass → rabbit → fox, where does the energy first come from?",c:1,a:[
  ["The soil","Soil gives plants water and nutrients, but not the energy they use to make food."],
  ["The sun","Grass uses sunlight to make food. That energy then passes to the rabbit and the fox."],
  ["The rabbit","The rabbit gets its energy by eating grass, so it isn't the first source."],
  ["The fox","The fox is at the end of the chain. It gets energy from the rabbit."]]},
 {s:"Ecosystems",q:"What is the main job of decomposers like mushrooms and bacteria?",c:2,a:[
  ["Make food from sunlight","That is what producers, like plants, do."],
  ["Hunt other animals","That is what predators do."],
  ["Break down dead things and return nutrients to the soil","Decomposers recycle nutrients from dead plants and animals so producers can use them again."],
  ["Pollinate flowers","Bees and other pollinators do that job, not decomposers."]]},
 {s:"Ecosystems",q:"In a field, snakes eat mice. If all the snakes were removed, what would most likely happen to the mice at first?",c:0,a:[
  ["The mouse population would increase","With no predators eating them, more mice survive, so their population grows at first."],
  ["The mouse population would decrease","The mice lost a predator, not a food source, so their numbers would go up."],
  ["The mice would become producers","Mice are consumers. They can't make their own food from sunlight."],
  ["Nothing would change","Removing a predator affects the whole food web, starting with its prey."]]},
 {s:"Ecosystems",q:"Which organism is a producer?",c:1,a:[
  ["Hawk","A hawk eats other animals. It is a consumer."],
  ["Oak tree","Plants make their own food using sunlight, so an oak tree is a producer."],
  ["Mushroom","A mushroom is a decomposer. It breaks down dead material."],
  ["Deer","A deer eats plants. It is a consumer."]]},
 {s:"Ecosystems",q:"In a food web, which way do the arrows point?",c:3,a:[
  ["From the predator to the prey","This is backwards. Energy moves from the prey to the predator that eats it."],
  ["From the animal to the sun","The sun gives energy to producers. Energy doesn't flow back to the sun."],
  ["From bigger animals to smaller animals","Arrows show who eats whom, not size."],
  ["From the organism eaten to the organism that eats it","Arrows show the flow of energy, from the food to the eater."]]},
 {s:"Ecosystems",q:"A deer eats only plants. What kind of consumer is it?",c:0,a:[
  ["Herbivore","Herbivores eat only plants, so a deer is a herbivore."],
  ["Carnivore","Carnivores eat only other animals."],
  ["Omnivore","Omnivores eat both plants and animals."],
  ["Decomposer","Decomposers break down dead things. A deer eats living plants."]]},
 {s:"Cells & Body Systems",q:"Which part of a cell controls the cell's activities?",c:2,a:[
  ["Cell membrane","The membrane controls what goes in and out of the cell, not all of its activities."],
  ["Cytoplasm","Cytoplasm is the jelly-like fluid that holds the cell parts."],
  ["Nucleus","The nucleus is the control center of the cell."],
  ["Cell wall","The cell wall gives plant cells support. Animal cells don't have one."]]},
 {s:"Cells & Body Systems",q:"Which two body systems work together to get oxygen to every part of the body?",c:2,a:[
  ["Skeletal and muscular","These systems work together to move the body, not to deliver oxygen."],
  ["Digestive and nervous","Digestion breaks down food, and nerves send signals. Neither one carries oxygen."],
  ["Respiratory and circulatory","The lungs take in oxygen, and the heart and blood carry it through the body."],
  ["Nervous and skeletal","These systems control and support the body. They don't move oxygen."]]},
 {s:"Cells & Body Systems",q:"How do muscles help you bend your arm?",c:1,a:[
  ["Muscles push on bones","Muscles can only pull. They contract, or shorten, and can't push."],
  ["Muscles pull on bones","Muscles contract and pull on bones to make them move."],
  ["Bones pull on muscles","Bones can't move by themselves. Muscles move them."],
  ["Nerves pull on bones","Nerves send the signal, but muscles do the pulling."]]},
 {s:"Cells & Body Systems",q:"Which body system breaks food down into nutrients the body can use?",c:3,a:[
  ["Circulatory system","The circulatory system carries nutrients around the body after food is broken down."],
  ["Skeletal system","The skeletal system supports and protects the body."],
  ["Respiratory system","The respiratory system takes in oxygen and releases carbon dioxide."],
  ["Digestive system","The stomach and intestines break food down into nutrients."]]},
 {s:"Cells & Body Systems",q:"You touch a hot stove and pull your hand away fast. Which system sent the message to move?",c:0,a:[
  ["Nervous system","Nerves and the brain sense the heat and send a signal to your muscles."],
  ["Digestive system","The digestive system breaks down food. It doesn't sense heat."],
  ["Respiratory system","The respiratory system handles breathing, not reactions."],
  ["Skeletal system","Bones support your body, but they don't send signals."]]},
 {s:"Weather",q:"A cold front is moving into central North Carolina. What weather should people most likely expect?",c:1,a:[
  ["Clear skies for a week","Fronts bring changing weather, not a long calm stretch."],
  ["Thunderstorms, then cooler temperatures","A cold front pushes warm air up fast, which often causes storms. Then cooler air moves in."],
  ["Warmer, more humid air","That describes a warm front, not a cold front."],
  ["No change in the weather","When air masses meet at a front, the weather changes."]]},
 {s:"Weather",q:"Water vapor rises, cools, and forms clouds. What is this step of the water cycle called?",c:2,a:[
  ["Evaporation","Evaporation is liquid water turning into vapor. That happens before clouds form."],
  ["Precipitation","Precipitation is water falling as rain, snow, sleet, or hail."],
  ["Condensation","Condensation is water vapor cooling into tiny liquid drops, which form clouds."],
  ["Runoff","Runoff is water flowing over land into streams and rivers."]]},
 {s:"Weather",q:"A barometer shows the air pressure is falling quickly. What does this usually mean?",c:1,a:[
  ["Clear, sunny weather is coming","Rising pressure usually means clear weather."],
  ["Cloudy, stormy weather is likely","Falling air pressure usually means clouds and precipitation are on the way."],
  ["The temperature will stay the same","A barometer measures air pressure, not temperature."],
  ["It is about to get windless","Falling pressure often brings more wind, not less."]]},
 {s:"Weather",q:"Which tool measures wind speed?",c:3,a:[
  ["Thermometer","A thermometer measures temperature."],
  ["Rain gauge","A rain gauge measures how much rain falls."],
  ["Barometer","A barometer measures air pressure."],
  ["Anemometer","An anemometer has spinning cups that measure wind speed."]]},
 {s:"Weather",q:"Tall, dark cumulonimbus clouds are building in the afternoon. What weather do they usually bring?",c:0,a:[
  ["Thunderstorms","Cumulonimbus clouds are tall storm clouds that bring thunder, lightning, and heavy rain."],
  ["Clear skies","Clear skies have few or no clouds."],
  ["Light fog","Fog is a cloud that forms near the ground, not a tall storm cloud."],
  ["Fair weather all day","Puffy white cumulus clouds mean fair weather. Cumulonimbus clouds mean storms."]]}
];
const FR = [
 {s:"NC.4.NF.1",q:"Which fraction is equivalent to 1/2?",c:2,v:[[1,2],[4,8]],a:[
  ["2/3","2/3 is more than half. Half of 3 parts would be 1½ parts, not 2."],
  ["3/5","3/5 is more than half. Half of 5 parts would be 2½ parts."],
  ["4/8","1/2 × 4/4 = 4/8. Four out of eight equal parts is exactly half."],
  ["5/12","5/12 is less than half. Half of 12 is 6, so 6/12 would equal 1/2."]]},
 {s:"NC.4.NF.1",q:"2/3 = ?/12. What number goes in the box?",c:1,v:[[2,3],[8,12]],a:[

const FR_SK=["Identify equivalent","Find the missing number","Use fraction models","Identify equivalent","Word problems","Explain & prove","Identify equivalent","Use fraction models","Identify equivalent","Find the missing number","Word problems","Find the missing number","Use fraction models","Explain & prove","Identify equivalent","Word problems","Identify equivalent","Use fraction models","Find the missing number","Word problems","Find the missing number","Identify equivalent","Find the missing number","Identify equivalent","Use fraction models","Explain & prove","Find the missing number","Word problems","Explain & prove","Identify equivalent"];
FR.forEach((q,i)=>q.s="NC.4.NF.1 · "+FR_SK[i]);
// Bar models only show what the question already gives; never the answer.
FR.forEach(q=>{ if(!q.v) return;
  q.v=q.v.filter(([n,d],k)=>k===0||q.q.includes(`${n}/${d}`)||q.q.includes(`?/${d}`)||n===0)
         .map(([n,d],k)=>k>0&&!q.q.includes(`${n}/${d}`)?[0,d]:[n,d]); });
const TEACHER="darren-echols@dpsnc.net";
const DECKS = {
  sci:{name:"5th Grade Science",tag:"NC Science · Grade 5",blurb:"Matter, forces and motion, ecosystems, cells and body systems, and weather.",qs:SCI,c:"var(--sci)",soft:"var(--sci-soft)"},
  frac:{name:"Equivalent Fractions",tag:"NC.4.NF.1 · Grade 4",blurb:"Find, model, and explain equivalent fractions with bar models.",qs:FR,c:"var(--frac)",soft:"var(--frac-soft)"},
  mix:{name:"Mixed Review",tag:"Both strands",blurb:"15 science and 15 fraction questions, shuffled together.",qs:null,c:"var(--ink)",soft:"var(--line)"}
};
const app = document.getElementById('app');
let st = {shuffle:true,name:''};
const esc = s => String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const shuf = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function menu(){
  document.documentElement.style.removeProperty('--accent');
  app.innerHTML = `<div class="hero"><span class="eyebrow">EOG-style check-in practice</span>
  <h1><span>Check-In</span> <em>Challenge</em></h1>
  <p>Pick a deck. Each one has 30 multiple-choice questions. After every answer, each choice shows why it is right or wrong. Press A, B, C, or D on the keyboard, or tap an answer.</p></div>
  <div class="decks">${Object.entries(DECKS).map(([k,d])=>`
    <button class="deck" data-k="${k}" style="--c:${d.c};--soft:${d.soft}">
      <span class="tag">${d.tag}</span><h2>${d.name}</h2><p>${d.blurb}</p><span class="go">Start 30 questions →</span></button>`).join('')}</div>
  <div class="who"><label for="sname">Student name</label><input id="sname" autocomplete="off" placeholder="Type your first and last name" value="${esc(st.name)}"><span class="err" id="nerr" hidden>Type your name before you start.</span></div>
  <div class="opts"><a class="toggle" href="Check-In_Challenge_Review_Packet.pdf" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;font-weight:700">Printable review packet (PDF)</a><label class="toggle"><input type="checkbox" id="shuf" ${st.shuffle?'checked':''}> Shuffle question order</label></div>`;
  const ni=document.getElementById('sname'); ni.oninput=()=>{st.name=ni.value.trim();document.getElementById('nerr').hidden=true};
  app.querySelectorAll('.deck').forEach(b=>b.onclick=()=>{if(!st.name){document.getElementById('nerr').hidden=false;ni.focus();return}start(b.dataset.k)});
  document.getElementById('shuf').onchange=e=>st.shuffle=e.target.checked;
}

function start(k){
  const d = DECKS[k];
  let qs = k==='mix' ? shuf(shuf(SCI).slice(0,15).concat(shuf(FR).slice(0,15))) : (st.shuffle?shuf(d.qs):d.qs.slice());
  qs = qs.map(q=>{const order=shuf(q.a.map((_,i)=>i));return {...q,a:order.map(i=>q.a[i]),c:order.indexOf(q.c)}});
  Object.assign(st,{k,d,qs,i:0,score:0,streak:0,best:0,res:[],picks:[],answered:null});
  document.documentElement.style.setProperty('--n',qs.length);
  document.documentElement.style.setProperty('--accent',d.c);
  document.documentElement.style.setProperty('--soft',d.soft);
  render();
}

function bars(v){
  const W=520,H=44,gap=18;
  return `<div class="viz">${v.map(([n,d])=>{
    const w=W/d;
    const cells=Array.from({length:d},(_,i)=>`<rect x="${i*w+1}" y="1" width="${w-2}" height="${H-2}" rx="4" fill="${i<n?'var(--accent)':'var(--card)'}" stroke="var(--ink)" stroke-width="1.5"/>`).join('');
    const label = n===0?`?/${d}`:`${n}/${d}`;
    return `<div style="display:flex;align-items:center;gap:14px"><svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Bar split into ${d} equal parts, ${n} shaded">${cells}</svg><span class="lbl">${label}</span></div>`;
  }).join('')}</div>`;
}

function render(){
  const {qs,i,d,answered}=st, q=qs[i];
  const dots = qs.map((_,j)=>`<span class="dot ${st.res[j]===true?'ok':st.res[j]===false?'no':j===i?'now':''}"></span>`).join('');
  app.innerHTML = `<div class="bar"><div class="left">
    <span class="chip">Score <b>${st.score}</b>/${qs.length}</span>
    <span class="chip">Streak <b>${st.streak}</b></span><span class="chip">${esc(st.name)}</span></div>
    <button class="ghost" id="quit">← Decks</button></div>
  <div class="dots">${dots}</div>
  <div class="card">
    <div class="qhead"><span class="qnum">Question ${i+1} of ${qs.length}</span><span class="std">${esc(q.s)}</span></div>
    <p class="qtext">${esc(q.q)}</p>
    ${q.v?bars(q.v):''}
    <div class="answers">${q.a.map((t,j)=>{
      let cls='';
      if(answered!==null){ if(j===q.c)cls='right'; else if(j===answered)cls='wrong'; else cls='dim'; }
      return `<button class="ans ${cls}" data-j="${j}" ${answered!==null?'disabled':''}><span class="k">${'ABCD'[j]}</span><span class="t">${esc(t[0])}${answered!==null?`<span class="why">${j===q.c?'✓ ':'✗ '}${esc(t[1])}</span>`:''}</span></button>`}).join('')}</div>
    ${answered!==null?`<div class="fb ${answered===q.c?'ok':'no'}"><strong>${answered===q.c?(st.streak>=3?`Correct! ${st.streak} in a row`:'Correct!'):`Not quite. The answer is ${'ABCD'[q.c]}.`}</strong><p>${esc(answered===q.c?q.a[q.c][1]:'You chose '+'ABCD'[answered]+': '+q.a[answered][1])}</p></div>
      <button class="next" id="next">${i+1<qs.length?'Next question →':'See results →'}</button>`
      :`<span class="hint">Think it through, then choose one answer.</span>`}
  </div>`;
  document.getElementById('quit').onclick=menu;
  app.querySelectorAll('.ans').forEach(b=>b.onclick=()=>pick(+b.dataset.j));
  const n=document.getElementById('next'); if(n){n.onclick=advance;n.focus();}
}

function pick(j){
  if(st.answered!==null)return;
  const q=st.qs[st.i], ok=j===q.c;
  st.answered=j; st.res[st.i]=ok; st.picks[st.i]=j;
  if(ok){st.score++;st.streak++;st.best=Math.max(st.best,st.streak)} else st.streak=0;
  render();
}
function advance(){
  st.answered=null; st.i++;
  st.i<st.qs.length?render():results();
}

function topicStats(){
  const m=new Map();
  st.qs.forEach((q,j)=>{const t=m.get(q.s)||{name:q.s,ok:0,n:0};t.n++;if(st.res[j])t.ok++;m.set(q.s,t)});
  return [...m.values()].map(t=>({...t,p:Math.round(t.ok/t.n*100)})).sort((x,y)=>x.p-y.p||y.n-x.n);
}
const level=p=>p<60?['bad','Needs help']:p<80?['warn','Almost there']:['good','On track'];

function results(){
  const {qs,score,d,best}=st, pct=Math.round(score/qs.length*100);
  const msg = pct>=90?'Outstanding! You are EOG ready.':pct>=70?'Solid work. Review the ones you missed.':pct>=50?'Good effort. Go over the explanations and try again.':'Keep practicing. Read each explanation, then play again.';
  const missed = qs.map((q,j)=>({q,j})).filter(x=>!st.res[x.j]);
  const ts=topicStats(), help=ts.filter(t=>t.p<60);
  const date=new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
  const report=[`Check-In Challenge report`,`Student: ${st.name}`,`Date: ${date}`,`Deck: ${d.name}`,`Score: ${score}/${qs.length} (${pct}%)`,``,
    `Results by standard (lowest first):`,...ts.map(t=>`- ${t.name}: ${t.ok}/${t.n} (${t.p}%) – ${level(t.p)[1]}`),``,
    help.length?`Needs more help with: ${help.map(t=>t.name).join('; ')}`:`No standards below 60%.`,
    missed.length?`Missed questions: ${missed.map(x=>'Q'+(x.j+1)).join(', ')}`:''].join('\n');
  app.innerHTML = `<div class="card res"><span class="eyebrow">${esc(d.name)} · results for ${esc(st.name)}</span>
    <div class="big">${score}/${qs.length}</div>
    <h2 style="font-size:28px">${msg}</h2>
    <p style="margin:0;color:var(--muted)">${pct}% correct · best streak ${best} · ${esc(date)}</p>
    <h3 style="font-size:22px;margin-top:6px">Score by standard</h3>
    <div class="chart" role="list">${ts.map(t=>{const [c,l]=level(t.p);return `<div class="crow lv-${c}" role="listitem"><span class="nm">${esc(t.name)}</span><div class="track" aria-hidden="true"><div class="fill" style="width:${Math.max(t.p,3)}%"></div></div><span class="pill">${t.ok}/${t.n} · ${l}</span></div>`}).join('')}</div>
    <div class="focus ${help.length?'':'allgood'}">${help.length?`<b>Needs more help with:</b> ${help.map(t=>esc(t.name)).join(', ')}`:`<b>No standard is below 60%.</b> Keep reviewing the "Almost there" ones.`}</div>
    <div class="send"><b>Send this report to your teacher</b>
      <span>Copy it and email it to <span class="addr">${TEACHER}</span></span>
      <pre id="rep">${esc(report)}</pre>
      <div class="row"><button class="btn" id="copy">Copy report</button><span id="copied" class="hint" hidden></span></div></div>
    <div class="row"><button class="btn" id="again">Play this deck again</button><button class="btn alt" id="home">Choose a different deck</button></div>
    ${missed.length?`<h3 style="font-size:22px;margin-top:8px">Review the ${missed.length} you missed</h3>
    <div class="miss">${missed.map(({q,j})=>`<div><b>Q${j+1}. ${esc(q.q)}</b><span>You chose: ${esc(q.a[st.picks[j]][0])}. ${esc(q.a[st.picks[j]][1])}<br>Correct: ${esc(q.a[q.c][0])}. ${esc(q.a[q.c][1])}</span></div>`).join('')}</div>`:'<p style="margin:0">Perfect score. Nothing to review!</p>'}
  </div>`;
  document.getElementById('again').onclick=()=>start(st.k);
  document.getElementById('home').onclick=menu;
  document.getElementById('copy').onclick=()=>{
    const done=t=>{const c=document.getElementById('copied');c.textContent=t;c.hidden=false};
    const sel=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('rep'));const s=getSelection();s.removeAllRanges();s.addRange(r);done('Report selected. Press Ctrl+C to copy.')};
    try{navigator.clipboard.writeText(report).then(()=>done('Copied. Paste it into an email to '+TEACHER+'.'),sel)}catch(e){sel()}
  };
  window.scrollTo(0,0);
}

document.addEventListener('keydown',e=>{
  if(!st.qs||!document.querySelector('.ans'))return;
  const j='abcd'.indexOf(e.key.toLowerCase());
  if(j>=0&&st.answered===null&&j<st.qs[st.i].a.length)pick(j);
  else if((e.key==='Enter'||e.key===' ')&&st.answered!==null&&document.activeElement?.id!=='next'){e.preventDefault();advance()}
});
menu();
</script>

</body>
</html>
