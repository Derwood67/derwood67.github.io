<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frog Hop Fractions</title>
<meta name="description" content="Teaches how to build and use a number line and other fraction models through a hopping game.">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Pond theme. Number line = a log across the water, ticks = lily pads, the frog makes the jumps.
   Workshop teaches building a number line beside bubble + bar models; 9 levels practice it. */
:root{
  color-scheme: light;
  --pond:#CFEFF2;--pond2:#A9DDE6;--paper:#FFFFFF;--ink:#17324D;--soft:#4D6479;
  --leaf:#2E9E5B;--leaf-dk:#1B5E37;--lily:#7BCB6B;--pink:#F0628E;--sun:#FFD447;
  --good:#1E7A47;--good-bg:#DDF5E5;--bad:#B3261E;--bad-bg:#FCE4E1;
  --display:"Fredoka","Trebuchet MS",sans-serif;--body:"Nunito","Verdana",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(180deg,var(--pond),var(--pond2));min-height:100vh;color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;font-weight:600}
.wrap{max-width:960px;margin:0 auto;padding:18px 16px 60px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(2rem,6vw,3rem);font-weight:700}
h2{font-size:1.6rem;font-weight:600}
h3{font-size:1.2rem;font-weight:600}
p{margin:0;max-width:68ch}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
[hidden]{display:none!important}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 5px 0 var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--display);font-weight:600;font-size:1.05rem;background:var(--leaf);color:#fff;border:3px solid var(--ink);border-radius:14px;padding:9px 18px;box-shadow:0 4px 0 var(--ink);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:#fff;color:var(--ink)}
.btn.pink{background:var(--pink)}
.btn.sun{background:var(--sun);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.round-btn{width:48px;height:48px;border-radius:50%;padding:0;font-size:1.6rem;line-height:1}
.count{font-family:var(--display);font-size:1.8rem;font-weight:700;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.small{font-size:.92rem;color:var(--soft)}
.tag{display:inline-block;background:var(--sun);border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-size:.85rem;font-weight:800;vertical-align:middle}

/* stacked fraction */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-family:var(--display);font-weight:700;line-height:1;margin:0 .12em}
.fr .n{border-bottom:.12em solid currentColor;padding:0 .15em .06em}
.fr .d{padding:.06em .15em 0}
.big .fr{font-size:1.35em}

/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top .grow{flex:1;min-width:200px}
.top .tools{display:flex;gap:8px}
.chip{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font-size:.95rem}

/* map */
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.lvl{text-align:left;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:0 5px 0 var(--ink)}
.lvl:hover:not(:disabled){background:#F3FFF0}
.lvl:disabled{opacity:.55;cursor:not-allowed;border-style:dashed;box-shadow:none}
.lvl .pad{flex:none;width:58px;height:58px;border-radius:50%;background:var(--lily);border:3px solid var(--leaf-dk);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.5rem;color:#fff;position:relative}
.lvl .pad::after{content:"";position:absolute;right:-2px;top:22px;width:18px;height:14px;background:var(--pond);transform:rotate(15deg);border-left:3px solid var(--leaf-dk)}
.lvl b{font-family:var(--display);font-size:1.15rem;display:block}
.lvl .stars{letter-spacing:2px;color:#E0A800;font-size:1.1rem}
.lvl.workshop{background:var(--sun)}
.lvl.ext{border-color:#7C4DCC;box-shadow:0 5px 0 #4B2C85}
.lvl.ext .pad{background:#7C4DCC;border-color:#4B2C85}
.lvl.ext .pad::after{display:none}
.lvl.workshop .pad{background:var(--pink);border-color:#8C1D3D}

/* play */
.prompt{font-family:var(--display);font-size:1.45rem;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stage{display:flex;flex-direction:column;gap:12px;align-items:center}
.models{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:center;width:100%}
.readout{font-family:var(--display);font-size:1.3rem}
svg.nl{width:100%;max-width:860px;height:auto;display:block;touch-action:manipulation}
svg.bub{width:min(240px,70vw);height:auto}
svg.bar{width:100%;max-width:600px;height:auto}
.slice{cursor:pointer}
.slice:hover{filter:brightness(.95)}
.hit{cursor:pointer}
.hit:hover + .lilypad, .hit:focus + .lilypad{filter:brightness(1.15)}
.fb{font-size:1.05rem;border-radius:12px;padding:10px 14px;max-width:70ch;align-self:stretch}
.fb.good{background:var(--good-bg);color:var(--good);border:2px solid var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--bad);border:2px solid var(--bad)}
.fb:empty{display:none}
.progress{display:flex;gap:6px}
.progress i{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.progress i.done{background:var(--lily)}
.progress i.now{background:var(--sun)}
.numin{width:76px;text-align:center;font-family:var(--display);font-size:1.6rem;border:3px solid var(--ink);border-radius:12px;padding:4px}
.fracin{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.fracin hr{width:90px;border:none;border-top:4px solid var(--ink);margin:0}

/* workshop */
.steps{display:flex;gap:8px;flex-wrap:wrap}
.step{border:2px solid var(--ink);border-radius:999px;padding:4px 14px;background:#fff;font-family:var(--display)}
.step[aria-current="step"]{background:var(--leaf);color:#fff}
.explain{background:#FFF8D6;border:2px solid var(--ink);border-radius:14px;padding:12px 14px;font-size:1.08rem}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;width:100%}
.model{border:2px dashed #9DB3C4;border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.model h3{font-size:1.05rem}
.ctrl{display:flex;gap:18px;flex-wrap:wrap;align-items:center;justify-content:center}
.ctrl .grp{display:flex;align-items:center;gap:8px;background:#F2F8FB;border:2px solid var(--ink);border-radius:16px;padding:6px 10px}

.finish{align-items:center;text-align:center}
.finish .stars{font-size:3rem;letter-spacing:6px;color:#E0A800}
.lvlbadge{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:1px 10px;font-size:.85rem;font-weight:800;font-family:var(--display)}
.lvlbadge.m3{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.lvlbadge.m2{background:#FFF3C4;color:#7A5A00;border-color:#C99A00}
.lvlbadge.m1{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.lvlbadge.m0{background:#EEF2F5;color:var(--soft);border-color:#B8C4CE}
.finish .lvlbadge{font-size:1.6rem;padding:6px 22px;border-width:3px}
.scale{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.progress i.retry{background:var(--sun)}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.teacher{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.teacher input{width:110px;border:2px solid var(--ink);border-radius:10px;padding:6px 8px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
<link rel="stylesheet" href="/shared/brand.css">
<script src="/shared/standards.js"></script>
<script src="/shared/frame.js" data-app="Frog Hop Fractions" data-subject="math" data-tags="Grades 3–5|Fraction models"></script>
</head>

<!-- Class sign-in gate: first-name sign-in, blocked names, locked and assigned apps, teacher unlock. Live settings: /classgate.json (edited from Control Center → Lock & Assign). Source: /shared/classgate-block.html -->
<style>
#cg-ov{position:fixed;inset:0;z-index:2147483000;background:#141c24;display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#cg-ov *{box-sizing:border-box}
#cg-ov .cg-card{background:#fff;color:#1b2420;border-radius:14px;max-width:420px;width:100%;padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 32px rgba(0,0,0,.35);font-size:18px;line-height:1.45}
#cg-ov h2{margin:0;font-size:1.45rem;line-height:1.2}
#cg-ov p{margin:0}
#cg-ov a{color:#0b6b4a;font-weight:700}
#cg-ov label{font-weight:700}
#cg-ov input{font:inherit;width:100%;padding:12px;border:2px solid #c9d1cc;border-radius:8px;background:#f6f8f6;color:#1b2420}
#cg-ov input:focus{outline:3px solid #f2c230;outline-offset:1px}
#cg-ov button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:12px 16px;background:#0b6b4a;color:#fff;cursor:pointer}
#cg-ov button.cg-alt{background:#e7ece9;color:#1b2420}
#cg-ov .cg-icon{font-size:2.2rem;line-height:1}
#cg-ov .cg-msg{min-height:1.4em;color:#a83226;font-size:.95rem}
#cg-ov .cg-small{font-size:.9rem;color:#55625b}
#cg-ov details{border-top:1px solid #e1e6e2;padding-top:10px}
#cg-ov summary{cursor:pointer;font-size:.9rem;color:#55625b}
#cg-ov form{display:flex;flex-direction:column;gap:10px;margin:0}
#cg-badge{position:fixed;right:10px;bottom:10px;z-index:2147482000;background:#1b2430;color:#fff;font:600 14px/1.2 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;border-radius:999px;padding:7px 8px 7px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 3px 10px rgba(0,0,0,.25)}
#cg-badge button{font:inherit;background:#f2c230;color:#1b1b1b;border:0;border-radius:999px;padding:4px 10px;cursor:pointer}
</style>
<script data-login>
(function(){
  var BLOCKED=["james"];          /* fallback list; /classgate.json on the site replaces it when it loads */
  var CFG={lockAll:false,apps:{}}; /* locked and assigned apps; filled in from /classgate.json */
  var CODE_HASH="cf2d0fe7ea0a7780592080ef0bf415a6043a3d59aa5d72ace64d39c6e0837285";  /* scrambled teacher code; the code itself is not stored in this page */
  var TRY_KEY="echols-classgate-tries";
  function sha(t){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")})}
  /* Checks a teacher code. Three wrong tries locks code entry on this device for 10 minutes. Resolves "ok", "wrong" or "wait". */
  function checkCode(code){var t={};try{t=JSON.parse(lsGet(TRY_KEY))||{}}catch(x){}
    if(t.until&&Date.now()<t.until)return Promise.resolve("wait");
    return sha("echols-room2:"+String(code||"").trim()).then(function(h){
      if(h===CODE_HASH){lsSet(TRY_KEY,null);return "ok"}
      t.n=(t.n||0)+1;if(t.n>=3){t={n:0,until:Date.now()+600000};lsSet(TRY_KEY,JSON.stringify(t));return "wait"}
      lsSet(TRY_KEY,JSON.stringify(t));return "wrong"},function(){return "wrong"})}
  var CODE_MSG={wrong:"That code is not right.",wait:"Too many tries. Wait 10 minutes and try again."};
  var LOCK_KEY="echols-classgate-lock", NAME_KEY="echols-classgate-name", TEACH_KEY="echols-classgate-teacher";
  var me=document.currentScript, needLogin=!!(me&&me.getAttribute("data-login")!==null);
  function attr(a){return (me&&me.getAttribute(a))||""}
  /* data-watch: name inputs of an app's own sign-in. data-pick: buttons whose text is a name. data-session: saved sign-ins (s:key or l:key:prop). data-app: app id (default: first folder of the address). */
  var WATCH=attr("data-watch"), PICK=attr("data-pick"), SESS=attr("data-session").split(",").filter(Boolean);
  var APP=attr("data-app")||(function(){var p=decodeURIComponent(location.pathname).split("/").filter(Boolean)[0]||"";
    return p.replace(/\.html?$/i,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")})();
  var BOOK=(function(){try{return new URLSearchParams(location.search).get("book")||""}catch(e){return ""}})();
  var current="", locked=false, shown="", denied="";
  function first(n){return String(n||"").trim().split(/[\s\-_]+/)[0].toLowerCase().replace(/[^a-z]/g,"")}
  function isBlocked(n){return BLOCKED.indexOf(first(n))>-1}
  /* Mr. Echols (teacher preview) and portfolio guests (?visitor) are not held by app locks or assignments; guest work never reaches class records. */
  function teacher(){return ssGet(TEACH_KEY)==="1"||ssGet("ec-guest")==="1"||ssGet("ec-visitor")==="1"||/[?&]visitor\b/.test(location.search)}
  /* This app's setting: {mode:"open"|"locked"|"assigned", students:[first names]} */
  function setting(){var a=CFG.apps||{};return (BOOK&&a[APP+":"+BOOK])||a[APP]||{mode:"open"}}
  function appLocked(){if(teacher())return false;return !!CFG.lockAll||setting().mode==="locked"}
  function notAssigned(n){if(teacher()||!n)return false;var s=setting();if(s.mode!=="assigned")return false;
    return (s.students||[]).map(first).indexOf(first(n))<0}
  function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function lsSet(k,v){try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
  function ssGet(k){try{return sessionStorage.getItem(k)}catch(e){return null}}
  function ssSet(k,v){try{v===null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function tidy(n){return String(n).replace(/\s+/g," ").trim().split(" ").map(function(w){return w.charAt(0).toUpperCase()+w.slice(1)}).join(" ")}
  function overlay(html){var o=document.getElementById("cg-ov");if(!o){o=document.createElement("div");o.id="cg-ov";o.setAttribute("role","dialog");o.setAttribute("aria-modal","true");document.body.appendChild(o)}o.innerHTML='<div class="cg-card">'+html+'</div>';var i=o.querySelector("input:not([type=password])");if(i)setTimeout(function(){i.focus()},30);return o}
  function close(){var o=document.getElementById("cg-ov");if(o)o.remove();shown=""}
  function badge(){var b=document.getElementById("cg-badge");if(b)b.remove();var n=ssGet(NAME_KEY);if(!needLogin||!n)return;b=document.createElement("div");b.id="cg-badge";b.innerHTML='<span>'+esc(n)+'</span><button type="button">Sign out</button>';b.querySelector("button").onclick=function(){ssSet(NAME_KEY,null);location.reload()};document.body.appendChild(b)}
  function showBlocked(){shown="blocked";
    var o=overlay('<h2>This activity is not available</h2><p>This app is not open to you right now. Please check with Mr. Echols.</p>'+
      '<details><summary>Teacher unlock</summary><form id="cg-unlock" style="margin-top:10px"><label for="cg-code">Teacher code</label><input id="cg-code" type="password" inputmode="numeric" autocomplete="off"><button type="submit">Unlock this device</button><p class="cg-msg" id="cg-umsg"></p></form></details>');
    o.querySelector("#cg-unlock").onsubmit=function(e){e.preventDefault();var c=o.querySelector("#cg-code");
      checkCode(c.value).then(function(r){if(r==="ok"){lsSet(LOCK_KEY,null);ssSet(NAME_KEY,null);location.reload();return}
        c.value="";o.querySelector("#cg-umsg").textContent=CODE_MSG[r]})};
  }
  /* Locked app or not assigned: no device lock, and the page opens again by itself when Mr. Echols opens it. */
  function teacherPreview(o){var f=o.querySelector("#cg-tp");if(!f)return;f.onsubmit=function(e){e.preventDefault();var c=o.querySelector("#cg-tcode");
    checkCode(c.value).then(function(r){if(r==="ok"){ssSet(TEACH_KEY,"1");location.reload();return}c.value="";o.querySelector("#cg-tmsg").textContent=CODE_MSG[r]})}}
  var TP='<details><summary>Teacher preview</summary><form id="cg-tp" style="margin-top:10px"><label for="cg-tcode">Teacher code</label><input id="cg-tcode" type="password" inputmode="numeric" autocomplete="off"><button type="submit">Open for this tab</button><p class="cg-msg" id="cg-tmsg"></p></form></details>';
  var MY='<p class="cg-small"><a href="/my-apps/">See my apps</a></p>';
  function showAppLocked(){if(shown==="applocked")return;shown="applocked";var b=document.getElementById("cg-badge");if(b)b.remove();
    teacherPreview(overlay('<div class="cg-icon" aria-hidden="true">🔒</div><h2>This app is locked</h2><p>Mr. Echols has locked this app for now. It will open again when he unlocks it.</p>'+MY+TP))}
  function showNotAssigned(n){if(shown==="notassigned")return;shown="notassigned";denied=String(n||"");var b=document.getElementById("cg-badge");if(b)b.remove();
    var o=overlay('<div class="cg-icon" aria-hidden="true">📋</div><h2>Not assigned to you</h2><p>'+(n?esc(tidy(first(n)))+', this':'This')+' app is not on your list right now. Check with Mr. Echols.</p>'+MY+
      '<button type="button" class="cg-alt" id="cg-other">I typed the wrong name</button>'+TP);
    o.querySelector("#cg-other").onclick=function(){ssSet(NAME_KEY,null);location.reload()};teacherPreview(o)}
  function lock(){if(locked)return;locked=true;lsSet(LOCK_KEY,"1");ssSet(NAME_KEY,null);var b=document.getElementById("cg-badge");if(b)b.remove();showBlocked()}
  /* One name check for every sign-in path: false when the name may not use this app. */
  function allow(n){if(isBlocked(n)){lock();return false}if(appLocked()){showAppLocked();return false}if(notAssigned(n)){showNotAssigned(n);return false}return true}
  function showLogin(){shown="login";
    var o=overlay('<h2>Sign in</h2><p class="cg-small">Mr. Echols’ Room 2</p><form id="cg-form"><label for="cg-name">Type your first name</label><input id="cg-name" type="text" maxlength="30" autocomplete="off" autocapitalize="words" placeholder="First name"><button type="submit">Start</button><p class="cg-msg" id="cg-msg"></p></form>');
    o.querySelector("#cg-form").onsubmit=function(e){e.preventDefault();
      var raw=o.querySelector("#cg-name").value.replace(/\s+/g," ").trim();
      if(!/^[A-Za-zÀ-ɏ][A-Za-zÀ-ɏ .'\-]{0,29}$/.test(raw)){o.querySelector("#cg-msg").textContent="Please type your first name using letters.";return}
      if(!allow(raw))return;
      var n=tidy(raw);current=n;ssSet(NAME_KEY,n);close();badge();
      try{document.dispatchEvent(new CustomEvent("classgate:signin",{detail:{name:n}}))}catch(err){}
    };
  }
  window.ClassGate={
    /* Apps with their own sign-in call this; returns false for a blocked name (and locks the device), a locked app, or a student this app isn't assigned to. */
    check:function(n){if(lsGet(LOCK_KEY)&&BLOCKED.length){showBlocked();return false}if(!allow(n))return false;current=String(n||"");return true},
    name:function(){return ssGet(NAME_KEY)||""},
    app:function(){return APP},
    /* Teacher code check for in-app teacher tools: resolves "ok", "wrong" or "wait". */
    checkCode:checkCode, codeMsg:function(r){return CODE_MSG[r]||""}
  };
  function saved(){var out=[];SESS.forEach(function(s){var p=s.split(":"),v=null;try{v=(p[0]==="l"?localStorage:sessionStorage).getItem(p[1])}catch(e){}
    if(v&&p[2]){try{v=(JSON.parse(v)||{})[p[2]]}catch(e){v=null}}if(v)out.push(String(v))});return out}
  function watched(){var out=[];if(!WATCH)return out;try{Array.prototype.forEach.call(document.querySelectorAll(WATCH),function(i){if(i!==document.activeElement&&i.value)out.push(i.value)})}catch(e){}return out}
  /* Signs a blocked student out of anything already open, and closes the app when it is locked or not assigned. */
  function sweep(){if(locked)return;
    if(lsGet(LOCK_KEY)&&BLOCKED.length){locked=true;showBlocked();return}
    if(appLocked()){showAppLocked();return}
    var all=[ssGet(NAME_KEY),current,denied].concat(saved(),watched());
    for(var i=0;i<all.length;i++)if(all[i]&&isBlocked(all[i])){lock();return}
    for(i=0;i<all.length;i++)if(all[i]&&notAssigned(all[i])){showNotAssigned(all[i]);return}
    /* reopened by the teacher while the lock screen was up */
    if(shown==="applocked"||shown==="notassigned")location.reload()}
  function refresh(){if(!window.fetch)return;
    fetch("/classgate.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(j){if(!j)return;
      if(Array.isArray(j.blocked))BLOCKED=j.blocked.map(first).filter(Boolean);
      CFG={lockAll:!!j.lockAll,apps:(j.apps&&typeof j.apps==="object")?j.apps:{}};sweep()}).catch(function(){})}
  function guard(e){if(locked||shown==="applocked"||shown==="notassigned")return;var bad=null;
    if(WATCH){try{Array.prototype.forEach.call(document.querySelectorAll(WATCH),function(i){if(!i.value||bad)return;if(isBlocked(i.value))bad="b";else if(notAssigned(i.value))bad=i.value;else current=i.value})}catch(x){}}
    if(!bad&&PICK&&e.type==="click"&&e.target.closest){var b=e.target.closest(PICK);if(b){var nm=b.getAttribute("data-n")||b.textContent;if(isBlocked(nm))bad="b";else if(notAssigned(nm))bad=nm}}
    if(!bad&&(WATCH||PICK)&&appLocked())bad="l";
    if(bad){e.preventDefault();e.stopImmediatePropagation();if(bad==="b")lock();else if(bad==="l")showAppLocked();else showNotAssigned(bad)}}
  function start(){
    if(lsGet(LOCK_KEY)&&BLOCKED.length){locked=true;showBlocked();return}
    var n=ssGet(NAME_KEY);
    if(n&&isBlocked(n)){lock();return}
    if(needLogin&&!n)showLogin();else badge();
    if(WATCH||PICK){["submit","click","change"].forEach(function(t){document.addEventListener(t,guard,true)});
      document.addEventListener("keydown",function(e){if(e.key==="Enter")guard(e)},true)}
    sweep();refresh();setInterval(sweep,2000);setInterval(refresh,30000);
    document.addEventListener("visibilitychange",function(){if(!document.hidden)refresh()});
  }
  if(document.body)start();else document.addEventListener("DOMContentLoaded",start);
})();
</script>

<script>
/* ================= HELPERS ================= */
const $=s=>document.querySelector(s);
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>b?gcd(b,a%b):a;
const fr=(a,b)=>`<span class="fr"><span class="n">${a}</span><span class="d">${b}</span></span>`;
function mixed(a,b){const w=Math.floor(a/b),r=a%b;if(!w)return fr(r,b);if(!r)return `<span style="font-family:var(--display);font-weight:700">${w}</span>`;return `<span style="font-family:var(--display);font-weight:700">${w}</span>${fr(r,b)}`}
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
const app=()=>$("#app");

/* ================= SAVE ================= */
const KEY="frogHopFractions.v1";
let prog={stars:{},all:false};
try{prog=Object.assign(prog,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
function saveProg(){try{localStorage.setItem(KEY,JSON.stringify(prog))}catch(e){}updateStars()}
const LV=["Not started","Not yet","Almost","Mastery"];
const LVICON=["","○","◐","●"];
const lvBadge=v=>`<span class="lvlbadge m${v}">${v?LVICON[v]+" ":""}${LV[v]}</span>`;
const levelFor=first=>first>=5?3:first>=3?2:1;   /* first-try correct out of 6 */
function updateStars(){$("#star-total").textContent="● Mastered "+Object.values(prog.stars).filter(v=>v===3).length+" of "+LEVELS.length}

/* ================= SOUND ================= */
let soundOn=true,ac=null;
function tone(f,d,type,v,when){if(!soundOn)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime+(when||0);const o=ac.createOscillator(),g=ac.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={
  hop(){tone(320,.12,"triangle",.07);tone(520,.1,"triangle",.05,.06)},
  tick(){tone(700,.05,"square",.03)},
  good(){[523,659,784].forEach((f,i)=>tone(f,.18,"triangle",.08,i*.09))},
  bad(){tone(220,.2,"sawtooth",.04);tone(180,.25,"sawtooth",.04,.12)},
  win(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.2,"triangle",.08,i*.11))},
  ribbit(){tone(140,.08,"square",.05);tone(110,.12,"square",.05,.09)}
};
$("#sound").addEventListener("click",e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?"🔊 Sound on":"🔇 Sound off";e.currentTarget.setAttribute("aria-pressed",soundOn)});

/* ================= CONFETTI ================= */
function confetti(){
  if(reduceMotion)return;
  const c=$("#confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#F0628E","#FFD447","#2E9E5B","#4FB3D9","#FF9F43"];
  const ps=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,s:6+Math.random()*6,c:pick(cols),r:Math.random()*6}));
  let f=0;(function step(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<120)requestAnimationFrame(step);else x.clearRect(0,0,c.width,c.height)})();
}

/* ================= FROG ================= */
function frogShape(color){
  const body=color||"#4CAF50",dk="#1B4D2A";
  return `<ellipse cx="-13" cy="-3" rx="8" ry="5" fill="${body}" stroke="${dk}" stroke-width="2"/>
  <ellipse cx="13" cy="-3" rx="8" ry="5" fill="${body}" stroke="${dk}" stroke-width="2"/>
  <ellipse cx="0" cy="-15" rx="17" ry="14" fill="${body}" stroke="${dk}" stroke-width="2.5"/>
  <ellipse cx="0" cy="-10" rx="10" ry="7" fill="#FFF6C8" opacity=".8"/>
  <circle cx="-8" cy="-29" r="7" fill="#fff" stroke="${dk}" stroke-width="2"/><circle cx="8" cy="-29" r="7" fill="#fff" stroke="${dk}" stroke-width="2"/>
  <circle cx="-7" cy="-29" r="3" fill="${dk}"/><circle cx="9" cy="-29" r="3" fill="${dk}"/>
  <path d="M-7 -19 Q0 -13 7 -19" fill="none" stroke="${dk}" stroke-width="2" stroke-linecap="round"/>
  <circle cx="-12" cy="-19" r="2.5" fill="#F7A1B8"/><circle cx="12" cy="-19" r="2.5" fill="#F7A1B8"/>`;
}
$("#logo-frog").innerHTML=frogShape();

/* ================= MODELS ================= */
/* Number line: o = {den, wholes, cut(bool), labels:'none'|'ends'|'wholes'|'all', pads(bool), frog:n|null, frogColor, segs(bool) } */
const NL={x0:70,x1:730,y:96};
function lineSVG(o){
  const den=o.den,neg=o.neg||0,wholes=(o.wholes||1)+neg,N=den*wholes,step=(NL.x1-NL.x0)/N,y=NL.y,X=n=>NL.x0+n*step;
  const lab=o.labels||"ends",h=Math.max(lab==="all"?(wholes>1?200:170):150,o.flags?190:0);
  let s=`<svg class="nl" viewBox="0 0 800 ${h}" data-den="${den}" data-wholes="${wholes}" role="img" aria-label="Number line from 0 to ${wholes}${o.cut!==false?", each whole cut into "+den+" equal parts":""}">`;
  s+=`<rect x="10" y="${y-34}" width="780" height="68" rx="34" fill="#9BD5E3" opacity=".55"/>`;
  s+=`<path d="M20 ${y+18} q15 -6 30 0 t30 0" stroke="#fff" stroke-width="2" fill="none" opacity=".7"/><path d="M700 ${y-20} q15 -6 30 0 t30 0" stroke="#fff" stroke-width="2" fill="none" opacity=".7"/>`;
  if(o.segs&&o.cut!==false){for(let n=0;n<N;n++)s+=`<rect x="${X(n)+2}" y="${y-9}" width="${step-4}" height="18" rx="6" fill="${n%2?"#FFD447":"#F7A1B8"}" opacity=".85"/>`}
  s+=`<line x1="${NL.x0-30}" y1="${y}" x2="${NL.x1+30}" y2="${y}" stroke="#7A4B23" stroke-width="7" stroke-linecap="round"/>`;
  s+=`<path d="M${NL.x0-42} ${y} l14 -9 v18 z M${NL.x1+42} ${y} l-14 -9 v18 z" fill="#7A4B23"/>`;
  s+=`<g class="trails"></g>`;
  for(let n=0;n<=N;n++){
    const whole=n%den===0&&!o.plain;
    if(o.cut===false&&!whole)continue;
    s+=`<line x1="${X(n)}" y1="${y-(whole?20:13)}" x2="${X(n)}" y2="${y+(whole?20:13)}" stroke="#17324D" stroke-width="${whole?4:3}" stroke-linecap="round"/>`;
  }
  if(o.pads){
    const rx=Math.max(9,Math.min(24,step*.42));
    for(let n=0;n<=N;n++){
      s+=`<rect class="hit" data-n="${n}" x="${X(n)-Math.max(step/2,14)}" y="${y-60}" width="${Math.max(step,28)}" height="90" fill="transparent" tabindex="0" role="button" aria-label="Lily pad ${n} of ${den} parts"/>`;
      s+=`<ellipse class="lilypad" cx="${X(n)}" cy="${y}" rx="${rx}" ry="${Math.min(10,rx*.6)}" fill="#7BCB6B" stroke="#1B5E37" stroke-width="2" pointer-events="none"/>`;
    }
  }
  // labels
  const fx=(n,yy)=>`<text x="${X(n)}" y="${yy}" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="${den>8?17:20}" fill="#17324D">${n}</text><line x1="${X(n)-11}" x2="${X(n)+11}" y1="${yy+5}" y2="${yy+5}" stroke="#17324D" stroke-width="2.5"/><text x="${X(n)}" y="${yy+24}" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="${den>8?17:20}" fill="#17324D">${den}</text>`;
  const wx=(w,yy)=>`<text x="${X(w*den)}" y="${yy}" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="30" fill="#17324D">${w-neg<0?"−"+(neg-w):w-neg}</text>`;
  if(lab==="all"){
    for(let n=0;n<=N;n++)s+=fx(n,y+40);
    for(let w=0;w<=wholes;w++)s+=`<rect x="${X(w*den)-16}" y="${y+78}" width="32" height="34" rx="9" fill="#FFD447" stroke="#17324D" stroke-width="2"/>`+wx(w,y+105);
  }else if(lab==="zero"){s+=wx(neg,y+54);
  }else if(lab==="ends"||lab==="wholes"){
    for(let w=0;w<=wholes;w++)s+=wx(w,y+54);
  }
  (o.flags||[]).forEach(f=>{const fx_=NL.x0+(f.v+neg)*(NL.x1-NL.x0)/wholes,c=f.color||"#E07A1F";
    s+=`<line x1="${fx_}" y1="${y-4}" x2="${fx_}" y2="${y+26}" stroke="${c}" stroke-width="3"/><circle cx="${fx_}" cy="${y}" r="7" fill="${c}" stroke="#17324D" stroke-width="2"/><rect x="${fx_-21}" y="${y+26}" width="42" height="56" rx="10" fill="${c}" stroke="#17324D" stroke-width="2"/>${f.d?`<text x="${fx_}" y="${y+48}" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="19" fill="#fff">${f.n}</text><line x1="${fx_-11}" x2="${fx_+11}" y1="${y+54}" y2="${y+54}" stroke="#fff" stroke-width="2.5"/><text x="${fx_}" y="${y+73}" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="19" fill="#fff">${f.d}</text>`:`<text x="${fx_}" y="${y+62}" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="26" fill="#fff">${f.n}</text>`}`});
  if(o.frog!=null)s+=`<g class="frog" pointer-events="none" transform="translate(${X(o.frog)},${y})">${frogShape(o.frogColor)}</g>`;
  return s+"</svg>";
}
function nlX(svg,n){const N=svg.dataset.den*svg.dataset.wholes;return NL.x0+n*(NL.x1-NL.x0)/N}
function hop(svg,from,to,cb,trail,stride){stride=stride||1;
  const frog=svg.querySelector(".frog"),y=NL.y,trails=svg.querySelector(".trails");
  if(trail)trails.innerHTML="";
  let cur=from,count=0;const dir=to>=from?1:-1;
  if(from===to){cb&&cb();return}
  function one(){
    if(cur===to){cb&&cb();return}
    const nx=cur+dir*stride,xa=nlX(svg,cur),xb=nlX(svg,nx),mid=(xa+xb)/2,ht=Math.min(48,18+Math.abs(xb-xa)*.6);count++;
    if(trail){trails.insertAdjacentHTML("beforeend",`<path d="M${xa} ${y-6} Q${mid} ${y-ht*2} ${xb} ${y-6}" fill="none" stroke="#F0628E" stroke-width="3" stroke-dasharray="6 5"/><circle cx="${mid}" cy="${y-ht-20}" r="12" fill="#fff" stroke="#F0628E" stroke-width="2"/><text x="${mid}" y="${y-ht-14}" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="16" fill="#B3264F">${count}</text>`)}
    sfx.hop();
    if(reduceMotion){frog.setAttribute("transform",`translate(${xb},${y})`);cur=nx;setTimeout(one,150);return}
    const t0=performance.now(),dur=Math.max(220,Math.min(380,Math.abs(xb-xa)*3));
    (function f(t){const k=Math.min(1,(t-t0)/dur);frog.setAttribute("transform",`translate(${xa+(xb-xa)*k},${y-ht*4*k*(1-k)})`);if(k<1)requestAnimationFrame(f);else{cur=nx;setTimeout(one,70)}})(t0);
  }
  one();
}
function bubbleSVG(parts,shaded,click){
  const cx=120,cy=120,r=100;let s=`<svg class="bub" viewBox="0 0 240 240" role="img" aria-label="Bubble cut into ${parts} equal parts, ${shaded.size} shaded">`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${r+6}" fill="#E8F8FF" stroke="#8CC8E0" stroke-width="3"/>`;
  for(let i=0;i<parts;i++){
    const fill=shaded.has(i)?"#F0628E":"rgba(190,232,250,.9)";
    const attrs=`class="${click?"slice":""}" data-i="${i}" fill="${fill}" stroke="#17324D" stroke-width="3"${click?` tabindex="0" role="button" aria-label="Part ${i+1}${shaded.has(i)?", shaded":""}"`:""}`;
    if(parts===1){s+=`<circle cx="${cx}" cy="${cy}" r="${r}" ${attrs}/>`;continue}
    const a0=-Math.PI/2+i*2*Math.PI/parts,a1=a0+2*Math.PI/parts;
    s+=`<path d="M${cx} ${cy} L${cx+r*Math.cos(a0)} ${cy+r*Math.sin(a0)} A${r} ${r} 0 ${parts===2?1:0} 1 ${cx+r*Math.cos(a1)} ${cy+r*Math.sin(a1)} Z" ${attrs}/>`;
  }
  s+=`<ellipse cx="82" cy="70" rx="26" ry="13" fill="#fff" opacity=".55" transform="rotate(-30 82 70)" pointer-events="none"/><circle cx="62" cy="96" r="5" fill="#fff" opacity=".6" pointer-events="none"/>`;
  return s+"</svg>";
}
function barSVG(parts,shaded,click){
  const x0=20,w=560;let s=`<svg class="bar" viewBox="0 0 600 100" role="img" aria-label="Bar cut into ${parts} equal parts, ${shaded.size} shaded">`;
  for(let i=0;i<parts;i++){const x=x0+i*w/parts;s+=`<rect ${click?`class="slice" tabindex="0" role="button" aria-label="Part ${i+1}"`:""} data-i="${i}" x="${x}" y="15" width="${w/parts}" height="70" fill="${shaded.has(i)?"#F0628E":"#E8F8FF"}" stroke="#17324D" stroke-width="3"/>`}
  return s+"</svg>";
}
const setOf=n=>new Set(Array.from({length:n},(_,i)=>i));
function onPick(el,sel,fn){
  el.addEventListener("click",e=>{const t=e.target.closest(sel);if(t)fn(t)});
  el.addEventListener("keydown",e=>{if(e.key!=="Enter"&&e.key!==" ")return;const t=e.target.closest(sel);if(t){e.preventDefault();fn(t)}});
}

/* ================= WORKSHOP ================= */
const W={a:3,b:4,step:0};
const WSTEPS=[
  {t:"Draw the line",x:b=>`Draw a straight line. Put <b>0</b> at the start and <b>1</b> at the end. Everything from 0 to 1 is <b>one whole</b>, just like one whole bubble or one whole bar.`},
  {t:"Cut equal parts",x:b=>`Cut the whole into <b>${b} equal parts</b>. The <b>denominator</b> (bottom number) tells how many equal parts are in one whole. Every part must be the same size, like equal slices of the bubble.`},
  {t:"Label the marks",x:b=>`Label each mark by counting parts from 0: ${fr(1,b)}, ${fr(2,b)}, ${fr(3,b)}… The bottom number stays ${b} because every part is still one of ${b} equal parts. At 1 you get ${fr(b,b)}, which is one whole.`},
  {t:"Hop to the fraction",x:(b,a)=>`Start at 0 and make <b>${a} jump${a===1?"":"s"}</b>. The <b>numerator</b> (top number) tells how many parts we count. Fernando lands on ${fr(a,b)}, the same amount you see shaded in the bubble and the bar.`}
];
function workshop(){
  const a=app();a.innerHTML="";
  const c=document.createElement("div");c.className="card";
  c.innerHTML=`<div class="row" style="justify-content:space-between"><button class="btn alt" id="back" type="button">← Pond map</button><span class="tag">Learn</span></div>
  <h2>Number Line Workshop</h2>
  <p>Pick a fraction. Then build its number line step by step and watch it match the bubble and the bar.</p>
  <div class="ctrl">
    <div class="grp"><span>Top number <span class="small">(numerator)</span></span><button class="btn alt round-btn" data-k="a-" type="button" aria-label="Numerator down">−</button><span class="count" id="wa"></span><button class="btn alt round-btn" data-k="a+" type="button" aria-label="Numerator up">+</button></div>
    <div class="grp"><span>Bottom number <span class="small">(denominator)</span></span><button class="btn alt round-btn" data-k="b-" type="button" aria-label="Denominator down">−</button><span class="count" id="wb"></span><button class="btn alt round-btn" data-k="b+" type="button" aria-label="Denominator up">+</button></div>
    <div class="big readout" id="wfr"></div>
  </div>
  <nav class="steps" id="wsteps" aria-label="Steps"></nav>
  <div class="explain" id="wx" aria-live="polite"></div>
  <div id="wline" style="width:100%"></div>
  <div class="row" style="justify-content:center"><button class="btn alt" id="wprev" type="button">← Back a step</button><button class="btn" id="wnext" type="button">Next step →</button></div>
  <h3 style="margin-top:6px">Same fraction, three models</h3>
  <div class="three"><div class="model"><h3>Bubble model</h3><div id="wbub" class="models"></div></div><div class="model" style="grid-column:span 2;min-width:0"><h3>Bar model</h3><div id="wbar" style="width:100%;display:flex;flex-direction:column;gap:6px;align-items:center"></div></div></div>
  <p class="small">Try it: make the top number bigger than the bottom number to see a fraction greater than 1.</p>`;
  a.appendChild(c);
  $("#back").addEventListener("click",home);
  c.querySelectorAll("[data-k]").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.k;
    if(k==="a+")W.a=Math.min(W.b*2,W.a+1);if(k==="a-")W.a=Math.max(0,W.a-1);
    if(k==="b+")W.b=Math.min(12,W.b+1);if(k==="b-")W.b=Math.max(1,W.b-1);
    W.a=Math.min(W.a,W.b*2);sfx.tick();drawW();
  }));
  $("#wnext").addEventListener("click",()=>{if(W.step<3){W.step++;drawW(true)}else{drawW(true)}});
  $("#wprev").addEventListener("click",()=>{if(W.step>0){W.step--;drawW()}});
  drawW();
}
function drawW(animate){
  const {a,b,step}=W,wholes=a>b?2:1;
  $("#wa").textContent=a;$("#wb").textContent=b;$("#wfr").innerHTML=fr(a,b)+(a>b?` <span class="small">=</span> ${mixed(a,b)}`:"");
  $("#wsteps").innerHTML=WSTEPS.map((s,i)=>`<button class="step" type="button" data-s="${i}" ${i===step?'aria-current="step"':""}>${i+1}. ${s.t}</button>`).join("");
  $("#wsteps").querySelectorAll("button").forEach(x=>x.addEventListener("click",()=>{W.step=+x.dataset.s;drawW(W.step===3)}));
  $("#wx").innerHTML=WSTEPS[step].x(b,a)+(wholes>1&&step>0?` <br><span class="small">This fraction is more than 1, so the line goes to 2. Each whole gets ${b} equal parts.</span>`:"");
  $("#wnext").textContent=step<3?"Next step →":"Hop again ↻";
  $("#wprev").disabled=step===0;
  $("#wline").innerHTML=lineSVG({den:b,wholes,cut:step>=1,labels:step>=2?"all":"ends",segs:step===1,frog:step===3?0:null});
  if(step===3){const svg=$("#wline svg");setTimeout(()=>hop(svg,0,a,()=>{if(a)sfx.ribbit()},true),animate?250:50)}
  // bubbles + bars
  const nb=Math.max(1,Math.ceil(a/b));let bub="",bar="";
  for(let k=0;k<Math.max(nb,wholes);k++){const sh=Math.max(0,Math.min(b,a-k*b));bub+=bubbleSVG(b,setOf(sh),false);bar+=barSVG(b,setOf(sh),false)}
  $("#wbub").innerHTML=bub;$("#wbar").innerHTML=bar;
}

/* ================= LEVELS ================= */
const ROUNDS=6;
const LEVELS=[
 {id:"bubble",name:"Bubble Pop",icon:"1",blurb:"Shade fraction bubbles",
  teach:`A fraction bubble is one whole cut into <b>equal parts</b>. The <b>bottom number</b> tells how many parts. The <b>top number</b> tells how many to shade. To show ${fr(3,4)}: the bubble has 4 equal parts, so shade 3.`,
  gen(i,used){let b,a,k;do{b=pick(i<2?[2,3,4]:[3,4,5,6,8]);a=ri(1,b-1)}while(used.has(a+"/"+b));used.add(a+"/"+b);k=(i>=4&&b<=6)?2:1;return{a,b,parts:b*k}},
  render(R,api){
   const sh=new Set();
   api.prompt(`Shade the bubble to show <span class="big">${fr(R.a,R.b)}</span>`+(R.parts!==R.b?` <span class="tag">Tricky! ${R.parts} parts</span>`:""));
   api.stage(`<div class="models"><div id="bub"></div><div class="readout" id="ro"></div></div>`);
   const draw=()=>{$("#bub").innerHTML=bubbleSVG(R.parts,sh,true);$("#ro").innerHTML=`You shaded ${fr(sh.size,R.parts)}`};

 {id:"past1",name:"Leap Past 1",icon:"8",blurb:"Fractions greater than 1",

 {id:"race",name:"Who Hops Farther?",icon:"9",blurb:"Compare fractions",
  teach:`On a number line, the fraction <b>farther from 0</b> is the <b>greater</b> fraction. Watch both frogs hop, then decide: who went farther? If they land on the same spot, the fractions are equal.`,

   let a1,b1,a2,b2;do{b1=pick([2,3,4,5,6,8]);b2=pick([2,3,4,5,6,8,10,12]);a1=ri(1,b1-1);a2=ri(1,b2-1)}while(a1*b2===a2*b1);return{a1,b1,a2,b2}},

 {id:"x-mystery",name:"Mystery Log",grade:"Gr 3–4",icon:"A",blurb:"Find where 1 is hiding",ext:true,

  gen(i,used){let a,b,best;for(;;){b=pick([5,6,7,8,9,10,11,12]);a=ri(1,b-1);const v=a/b,ds=[v,Math.abs(v-.5),1-v];const m=Math.min(...ds);if(ds.filter(x=>Math.abs(x-m)<1e-9).length>1||Math.abs(v-.5)<1e-9||used.has(a+"/"+b))continue;best=ds.indexOf(m);break}used.add(a+"/"+b);return{a,b,best}},

   api.prompt(`Is <span class="big">${fr(R.a,R.b)}</span> closest to 0, ${fr(1,2)}, or 1? Think first, no counting pads!`);

 {id:"x-add",name:"Add the Hops",grade:"Gr 4–5",icon:"D",blurb:"Add fractions on the line",ext:true,

      else{api.miss(`Count how many parts make one whole on this log. Then think: how many of those parts is the second fraction?`);setTimeout(()=>{busy=false;paint()},1800)}

 {id:"x-times",name:"Jump Multiplier",grade:"Gr 4",icon:"E",blurb:"Multiply a fraction by a whole number",ext:true,
  teach:`${"3 × "}${fr(2,5)} means <b>3 jumps</b>, and each jump is ${fr(2,5)} long. That's the same as 6 little jumps of ${fr(1,5)}, so 3 × ${fr(2,5)} = ${fr(6,5)} = 1${fr(1,5)}.`,
  deeper:`Is 4 × ${fr(2,3)} more or less than 4? How can you tell before you multiply?`,

 {id:"x-order",name:"Line Up the Frogs",grade:"Gr 4–5",icon:"F",blurb:"Order three fractions",ext:true,

  gen(i,used){let f;do{f=[0,1,2].map(()=>{const b=pick([2,3,4,5,6,8,10,12]);return[ri(1,b-1),b]})}while(new Set(f.map(x=>x[0]/x[1])).size<3||used.has(f.map(x=>x.join("/")).sort().join()));used.add(f.map(x=>x.join("/")).sort().join());return{f,picked:[]}},
  render(R,api){

 {id:"x-decimal",name:"Decimal Dock",grade:"Gr 4–6",icon:"G",blurb:"Fractions and decimals",ext:true,
  teach:`Decimals are fractions in disguise! 0.6 means 6 tenths, ${fr(6,10)}. On a log cut into 5 parts, each part is ${fr(1,5)} = ${fr(2,10)} = 0.2, so 0.6 is 3 jumps. On a log cut into 4 parts, each part is 0.25.`,

 {id:"x-divide",name:"How Many Jumps?",grade:"Gr 5–6",icon:"H",blurb:"Divide with fractions",ext:true,
  teach:`Division asks <b>“how many fit?”</b> 2 ÷ ${fr(1,3)} means: how many jumps of ${fr(1,3)} does it take to reach 2? Each whole holds 3 thirds, so 2 wholes hold 6. That's why 2 ÷ ${fr(1,3)} = 6. It works for any fraction: ${fr(3,4)} ÷ ${fr(3,8)} = 2, because 2 jumps of ${fr(3,8)} reach ${fr(3,4)}.`,
  deeper:`When you divide by a fraction less than 1, why is the answer bigger than the number you started with?`,
  gen(i,used){let D,s,q,W,b;for(;;){if(i<3){b=pick([2,3,4]);W=ri(1,3);D=b;s=1;q=W*b}else{D=pick([4,6,8,12]);s=pick([2,3,4].filter(x=>x<D&&D%x!==1));q=ri(2,5)}if(q*s>2*D||!s)continue;const k=q+"|"+s+"|"+D;if(used.has(k))continue;used.add(k);break}
   const T=q*s,gt=gcd(T,D),gj=gcd(s,D);return{D,s,q,tn:T/gt,td:D/gt,jn:s/gj,jd:D/gj,w:Math.ceil(T/D)}},

     <div class="row"><label for="qq" class="readout">Number of jumps:</label><input class="numin" id="qq" inputmode="numeric" maxlength="2"></div>`);
   const svg=$("#ln svg");

     else api.miss(`Figure out how many little parts one jump of ${jmp} covers, and how many little parts it is from 0 to the flag.`)};

 {id:"x-negative",name:"Below Zero",grade:"Gr 6",icon:"I",blurb:"Negative fractions and opposites",ext:true,

LEVELS.push(...EXT);
const CORE=LEVELS.filter(L=>!L.ext).length;
const levelLabel=i=>LEVELS[i].ext?"Challenge "+LEVELS[i].icon:"Level "+(i+1);

/* ================= HOME / MAP ================= */
const unlocked=i=>prog.all||i===0||i===CORE||(prog.stars[LEVELS[i-1].id]||0)>=2;

  const intro=document.createElement("div");intro.className="card";

  let m=document.createElement("div");m.className="map";
  const ws=document.createElement("button");ws.type="button";ws.className="lvl workshop";

  let xm=null;

      a.appendChild(h);xm=document.createElement("div");xm.className="map";m=xm}
    const b=document.createElement("button");b.type="button";b.className="lvl"+(L.ext?" ext":"");b.disabled=!unlocked(i);

function intro_(i){

/* ================= GAME ENGINE ================= */
let G=null;
function play(i){
  G={i,L:LEVELS[i],r:0,misses:0,first:0,hist:[],used:new Set()};
  const a=app();a.innerHTML="";
  const c=document.createElement("div");c.className="card";
  c.innerHTML=`<div class="row" style="justify-content:space-between"><button class="btn alt" id="back" type="button">← Pond map</button><span><b style="font-family:var(--display)">${levelLabel(i)}: ${G.L.name}</b></span><div class="progress" id="dots" aria-label="Round progress"></div></div>
   <div class="prompt" id="prompt" aria-live="polite"></div>
   <div class="stage" id="stage"></div>
   <div class="row" id="controls" style="justify-content:center"></div>
   <div class="fb" id="fb" role="status"></div>
   <div class="row" style="justify-content:center"><button class="btn pink" id="next" type="button" hidden>Next round →</button></div>`;
  a.appendChild(c);
  $("#back").addEventListener("click",home);
  $("#next").addEventListener("click",()=>{G.r++;G.r>=ROUNDS?finish():round()});
  round();
}
function round(){
  $("#dots").innerHTML=Array.from({length:ROUNDS},(_,k)=>`<i class="${k<G.r?(G.hist[k]?"done":"retry"):k===G.r?"now":""}" title="${k<G.r?(G.hist[k]?"Right on first try":"Needed another try"):""}"></i>`).join("");
  $("#fb").className="fb";$("#fb").innerHTML="";$("#next").hidden=true;
  const R=G.L.gen(G.r,G.used);R.done=false;G.R=R;
  const api={
    prompt:h=>{$("#prompt").innerHTML=h},
    stage:h=>{$("#stage").innerHTML=h},
    controls:list=>{const c=$("#controls");c.innerHTML="";list.forEach(([label,cls,fn])=>{const b=document.createElement("button");b.type="button";b.className=cls;b.innerHTML=label;b.addEventListener("click",()=>{if(!R.done)fn()});c.appendChild(b)})},
    say:h=>{$("#fb").className="fb good";$("#fb").innerHTML=h},
    ok:h=>{if(R.done)return;R.done=true;G.hist[G.r]=!R.missed;if(!R.missed)G.first++;sfx.good();$("#fb").className="fb good";$("#fb").innerHTML="✓ "+h;$("#controls").querySelectorAll("button").forEach(b=>b.disabled=true);$("#next").hidden=false;$("#next").textContent=G.r===ROUNDS-1?"See my results":"Next round →";$("#next").focus({preventScroll:true});$("#fb").scrollIntoView({block:"nearest",behavior:reduceMotion?"auto":"smooth"})},
    miss:h=>{if(R.done)return;G.misses++;R.missed=true;sfx.bad();$("#fb").className="fb bad";$("#fb").innerHTML="Not yet. "+h}
  };
  G.L.render(R,api);
}
function finish(){
  const st=levelFor(G.first);
  const prev=prog.stars[G.L.id]||0;prog.stars[G.L.id]=Math.max(prev,st);saveProg();
  if(st>=2){sfx.win();confetti()}else sfx.ribbit();
  const a=app();a.innerHTML="";
  const c=document.createElement("div");c.className="card finish";
  const nextI=st>=2&&G.i+1<LEVELS.length&&G.i+1!==CORE?G.i+1:null;
  c.innerHTML=`<svg width="120" height="100" viewBox="-40 -48 80 60" aria-hidden="true">${frogShape()}</svg>
    <h2>${levelLabel(G.i)}: ${G.L.name}</h2><div>${lvBadge(st)}</div><p><b>${G.first} of ${ROUNDS}</b> rounds right on the first try.</p>
    <p>${st===3?(G.first===ROUNDS?"Perfect hopping! You have mastered this skill.":"You have mastered this skill!"):st===2?"You are almost there! The next level is unlocked. Play this one again to reach Mastery.":"Not yet, and that is okay. Review the lesson, then try again. Reach Almost to unlock the next level."}${prev>st?`<br><span class="small">Your best so far is still ${LV[prev]}.</span>`:""}</p>
    ${G.L.deeper?`<div class="explain" style="text-align:left"><b>Think deeper:</b> ${G.L.deeper}<br><span class="small">Talk it over with a partner or write your answer in your math journal.</span></div>`:""}
    <div class="row" style="justify-content:center">${nextI!=null?`<button class="btn pink" id="nx" type="button">Next level: ${LEVELS[nextI].name} →</button>`:(st<2?`<button class="btn pink" id="review" type="button">Review the lesson</button>`:G.i+1===LEVELS.length?`<span class="tag">Challenge Pond conquered! 🏆</span>`:G.i+1===CORE?`<span class="tag">You finished every level! Try the Challenge Pond 🏆</span>`:"")}
    <button class="btn alt" id="again" type="button">Play again</button><button class="btn alt" id="map" type="button">Pond map</button></div>`;
  a.appendChild(c);
  if(nextI!=null)$("#nx").addEventListener("click",()=>intro_(nextI));
  if($("#review"))$("#review").addEventListener("click",()=>intro_(G.i));
  $("#again").addEventListener("click",()=>play(G.i));$("#map").addEventListener("click",home);
  window.scrollTo(0,0);
}

$("#teacher-open").addEventListener("click",()=>{const f=$("#teacher");f.hidden=!f.hidden;if(!f.hidden)$("#tcode").focus()});
$("#teacher").addEventListener("submit",e=>{e.preventDefault();
  ClassGate.checkCode($("#tcode").value).then(r=>{if(r==="ok"){prog.all=true;saveProg();$("#tmsg").textContent="All levels unlocked on this device.";$("#tcode").value="";home()}
  else{$("#tmsg").textContent=ClassGate.codeMsg(r);$("#tcode").value=""}})});
let resetArm=false;
$("#reset").addEventListener("click",async e=>{const btn=e.currentTarget;
  const r=await ClassGate.checkCode($("#tcode").value);
  if(r!=="ok"){$("#tmsg").textContent=r==="wait"?ClassGate.codeMsg(r):"Type the teacher code first.";return}
  e={currentTarget:btn};
  if(!resetArm){resetArm=true;e.currentTarget.textContent="Tap again to erase progress";return}
  prog={stars:{},all:false};saveProg();resetArm=false;e.currentTarget.textContent="Reset progress on this device";$("#tmsg").textContent="Progress reset.";$("#tcode").value="";home()});

home();
</script>
</body>
</html>
